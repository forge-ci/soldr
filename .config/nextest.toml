experimental = ["wrapper-scripts"]

# Per-test timeouts live here now (soldr#2493 follow-up).
#
# They used to live in `timed_test!`, a macro that ran each body on a worker
# thread and called `std::process::abort()` when the body outlived its budget.
# That had two failures that no amount of tuning fixes:
#
#   1. The diagnostic was invisible. The banner went through `eprintln!`, which
#      libtest *captures*; the captured buffer is only printed when libtest
#      reports a result, and `abort()` guarantees it never does. CI saw a bare
#      `signal: 6, SIGABRT` and nothing else. The macro's own docs said to
#      re-run with `--nocapture` to see it -- not an option for a CI failure
#      that already happened.
#   2. The blast radius was the whole binary. `abort()` kills every other test
#      in the process. In soldr#2517's Linux lane a 60s test's expiry killed a
#      120s test that was only 60s in and had done nothing wrong.
#
# nextest runs each test in its own process, so a timeout kills exactly one
# test and the run summary names it. On Unix, the wrapper below catches
# nextest's SIGTERM, terminates its child process group, and drains both
# captured pipes to EOF before returning. Linux also dumps the test's threads;
# other Unix hosts currently perform termination and draining only. The
# explicit grace period bounds that diagnostic work before nextest escalates
# to SIGKILL. Windows nextest timeouts kill the job object immediately and
# cannot run a graceful diagnostic hook.
#
# `period` x `terminate-after` is the budget: 60s x 2 = 120s, which is exactly
# the old `DEFAULT_TEST_TIMEOUT`. Tests that declared a *shorter* budget are
# not given overrides -- those were fail-fast niceties rather than safety
# limits, and 162 per-test entries would be noise. Only the 12 tests that
# declared MORE than the default get one, below.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "30s" }

# =====================================================================
# soldr#2934 -- READ THIS BEFORE EDITING ANY `filter = ` LINE BELOW.
#
# The 98 standalone integration-test files under `crates/soldr-cli/tests/`
# were consolidated into 8 linked test binaries -- `broker`, `daemon`,
# `cargo_front_door`, `cache_gc`, `cook_dylint`, `fetch_tools`,
# `toolchain_env`, `guards`. Each former file is now a `mod` declared by its
# category's `main.rs`, which changes both halves of every filter here:
#
#   * `binary(cli_broker_routes)` names nothing anymore. The binary is
#     `broker`; the old file is the module `cli_broker_routes` inside it.
#   * libtest now reports those tests as `<module>::<test_name>`, so a bare
#     `test(=some_test_name)` no longer matches either.
#
# A filter that matches nothing IS NOT AN ERROR IN NEXTEST. It is silently
# ignored: the test drops back to the default 60s x 2 = 120s budget, and the
# failure surfaces weeks later as a bogus TIMEOUT with nothing pointing at
# this file. So whenever a test is renamed, or moves between modules, or a
# module is renamed, re-verify every filter naming it. `cargo nextest list
# -E '<filter>'` prints the selected set; an empty set means the filter is
# dead and the budget below is not being granted to anything.
#
# Module-prefix form used below: `binary(<category>) & test(/^<module>::/)`.
# `test(/.../)` is nextest's regex matcher (alongside `=` exact-match and `~`
# substring); `^` anchors the module name to the start of the test name so it
# cannot match mid-path. The `binary(...)` conjunct is not strictly required
# -- module names are unique across the tree -- but it tightens the match and
# documents which `--test <name>` binary to reach for when reproducing.
# Individual tests keep the exact form, now module-qualified:
# `test(=<module>::<test_name>)`.
#
# Tests in `crates/soldr-daemon/tests/` and `crates/soldr-cache/tests/` did
# NOT move and keep their own per-file binaries, so their filters are bare
# names. Unit tests living in a crate's `src/` are named by their full module
# path (e.g. `daemon::session_serve::tests::<test_name>`) and always were.
# =====================================================================

# These tests cold-start or directly control the broker/daemon runtime. They
# must share one group: separate one-thread groups still run concurrently and
# contend for the same bounded route-start and shutdown paths on shared runners.
[test-groups.soldr-runtime]
max-threads = 1

# soldr#3625: ONE Linux group for every cold broker/daemon start, two wide.
#
# Linux used to carry two separate two-thread twins (`soldr-runtime-linux`
# for this group's membership, `soldr-cargo-cold-builds-linux` for the
# cold-build family below), and the front-door modules with the same shape --
# `cli_cargo_zccache_mode`, `cli_maturin`, `cli_rust_analyzer`, ... -- sat in
# no group at all. Separate groups run concurrently, so up to four grouped
# cold starts plus any number of ungrouped ones overlapped. Every recorded
# soldr#3625 failure is that overlap: `broker progress-silence deadline
# exceeded` (limit ~5-6s) on a fresh root's first SESSION compile, with four
# cold starts in flight --
#   * `daemon_restart_warmth::{hard_killed_daemon_loses_at_most_one_save_batch,
#     graceful_daemon_restart_serves_the_next_build_warm}` beside two
#     `cli_dylint_wrapper` tests;
#   * `cli_cargo_zccache_mode::the_flag_wins_over_config_and_the_users_own_variable`
#     beside a second `cli_cargo_zccache_mode` test and two `cli_cargo_linker`;
#   * `cli_maturin::direct_maturin_build_routes_nested_cargo_through_zccache`
#     beside both `daemon_restart_warmth` tests and `cli_rust_analyzer`.
# So soldr#3138's premise below ("`progress_silence` ... untouched" by the
# extra concurrency) holds for two overlapping cold starts and not for four.
#
# Why a per-group cap, given CLAUDE.md's "concurrency caps are a last resort":
#   * It is not a global cap. CARGO_BUILD_JOBS / SOLDR_JOBS / NEXTEST_TEST_THREADS
#     are untouched; ~3,600 other tests keep the full pool. Only tests with one
#     specific shape are capped -- a Soldr front door handed a cacheable compile
#     on a fresh SOLDR_CACHE_DIR (or one that drives the broker/daemon runtime
#     directly) -- and `tests/test_nextest_cold_start_group.py` derives that
#     shape from the test sources, so membership is enforced, not remembered.
#   * Exclusive admission (rung 2) cannot express it: the contended work is the
#     broker spawn, route acquisition and daemon bring-up for a fresh root,
#     which all happen BEFORE any compile reaches the embedded service's
#     admission gate. There is no gate yet to ask. Rung 1 -- a cheaper cold
#     start -- is soldr#3152/#3163's work and does not exist today.
#   * SOLDR_BROKER_PROGRESS_SILENCE_MS stays where it is. It is the stall
#     detector; raising it would hide the real broker stalls it exists to catch.
#
# Why two and not one: before #3161 Linux ran this group and the cold-build
# group at one thread each -- two overlapping cold starts -- and none of the 15
# incidents listed below was on Linux. Replaying three 2026-10-09 gate logs
# (8 test threads) through a list scheduler with the measured per-test times:
# today's layout 163-287s, one group at 2 threads 280-528s, at 1 thread
# 535-1035s. One thread would triple the tests lane for no observed benefit
# over two. The replay uses durations measured WHILE four cold starts
# contended, so the two-thread figure is an upper bound.
#
# Other platforms keep the two one-thread groups (`soldr-runtime`,
# `soldr-cargo-cold-builds`), which is the same at-most-two invariant; the
# windows/ARM/Rosetta history below is why they do not go wider.
[test-groups.soldr-cold-start-linux]
max-threads = 2

# soldr#3138 (history; its two-thread Linux twin is now
# `soldr-cold-start-linux` above): same membership, two threads, Linux only.
#
# `max-threads = 1` on `soldr-runtime` is NOT an OOM crutch. Classifying all
# 15 documented incidents (soldr#2336/#2517/#2624/#2696/#2697/#2720/#2729/
# #2737/#2867/#2883/#2934/#2944/#3038/#3059/#3096) found none memory-related,
# and two concurrent daemon lifecycles at the 512 MiB `daemon_rss_ceiling`
# target are trivial on a 16 GB runner carrying 14 GB of swap. What it protects
# is a *threshold*: a cold start slowed by contention crossing
# `BrokerDeadlines::route_ceiling`, a FIXED 120s wall-clock deadline
# (`crates/soldr-cli/src/broker_deadlines.rs`).
#
# Two facts make raising it on Linux the right trade:
#
#   1. Every one of those incidents was on windows-gnu/msvc, ARM/GNU, or
#      macOS-Rosetta, where cold start is already several times slower. None was
#      on the Linux gate. Those lanes keep `max-threads = 1` through the
#      ungated override that follows each Linux-gated one below.
#   2. The ceiling is not the hang detector. `first_response` (2s) and
#      `progress_silence` (5s) catch a dead or stalled broker; `route_ceiling`
#      fires only on "alive, progressing, but slow" -- exactly the contention
#      this introduces. `continuous_progress_is_still_bounded_by_route_ceiling`
#      (crates/soldr-cli/src/session_transport.rs) pins that semantics, which is
#      why `_build-and-test.yml` raises SOLDR_ROUTE_ACQUIRE_CEILING_MS alongside
#      this change: it gives up "slow" vs "very slow" discrimination and keeps
#      hang detection at 5s.
#
# Measured contention is ~1.7x per test (63-78s in isolation reaching 121s when
# racing, per the entries below), so 2x concurrency is a net ~1.18x throughput
# win rather than a loss. The 68 members sum to 961s of serial work inside a
# 1046s stage -- they ARE the stage's floor -- so this is the only lever that
# lowers that floor instead of repacking around it.
#
# Deliberately 2, not more: the measurement supports one additional concurrent
# cold start, not an uncapped group. `soldr-cargo-cold-builds` stays at 1.

# soldr#3138 -- scheduling was investigated here and REJECTED. Do not retry it
# without new evidence.
#
# The measurement is real: the 68 `soldr-runtime` members sum to 961s of
# strictly serial work inside a 1046s stage, nextest reaches them late, and the
# last 300s of a gate run executes 32 tests totalling 483 test-seconds --
# effective concurrency 1.6 on a 4-thread runner, with the longest test
# (`daemon_rss_ceiling::daemon_dies_...`, 45.9s) starting at t+963 of t+1048.
# Longest-job-last is genuinely the worst order for a serial chain, and
# `priority` (nextest >= 0.9.91; this repo runs 0.9.143) would reorder it.
#
# It has been tried and it lost. soldr#3024 attempt 2 promoted the cold-builds
# group to priority 100 and Fresh Nextest regressed from an 18m11 median to
# 26m14 -- front-loading the constrained tests makes them contend with cold
# nested builds from the very start, and that costs more than the idle tail
# saves. `tests/test_nextest_timeout_wrapper.py` guards against reintroducing
# it, which is how this attempt was caught.
#
# The idle tail is therefore a symptom, not the bug. The 961s chain is 92% of
# the stage, so no reordering can beat it -- the only lever that moves this
# number is making each of those 68 tests cheaper (broker/daemon cold start),
# which needs the per-child instrumentation soldr#3152 asks for.

[[profile.default.overrides]]
filter = '(binary(cache_gc) & test(/^agent_worktree_share::/)) + (binary(daemon) & test(/^(cli_daemon_builds|cli_daemon_flush_caches|cli_daemon_lifecycle|cli_daemon_single_instance|cli_daemon_target_touch|daemon_cache_maintenance|daemon_restart_warmth|daemon_rss_ceiling)::/))'
platform = { target = 'cfg(target_os = "linux")' }
test-group = 'soldr-cold-start-linux'

[[profile.default.overrides]]
filter = '(binary(cache_gc) & test(/^agent_worktree_share::/)) + (binary(daemon) & test(/^(cli_daemon_builds|cli_daemon_flush_caches|cli_daemon_lifecycle|cli_daemon_single_instance|cli_daemon_target_touch|daemon_cache_maintenance|daemon_restart_warmth|daemon_rss_ceiling)::/))'
test-group = 'soldr-runtime'

# soldr#3038: `daemon_rss_ceiling` spawns its own broker-owned daemon and
# drives a real (if small) chained-workspace build through it, so it needs
# the 300s budget for the same reason as the `session_*` real-rustc entry
# below: a cold embedded-zccache daemon start plus several sequential
# `cargo build` passes routinely exceeds the 120s default on a contended
# runner, and this is real work, not a hang.
[[profile.default.overrides]]
filter = 'test(=daemon_rss_ceiling::daemon_stays_under_the_512mib_target_while_serving_a_chained_build)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

# soldr#3096: the breach test runs the same shape of workload (a trivial
# build plus the 12-crate chained build through a broker-owned daemon) and
# passes in 29-56s, which left under 2.2x headroom on the 120s default --
# it timed out on contended ARM/GNU runners. Same budget as its sibling;
# the test's own per-build waits are shorter than this so its diagnostic,
# not nextest's, reports which build stalled.
[[profile.default.overrides]]
filter = 'test(=daemon_rss_ceiling::daemon_dies_and_dumps_memory_when_the_ceiling_is_breached)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

# soldr#3059: the rate-gate reproduction warms up with a trivial crate, the
# cold chained build and one rebuild pass, then measures eight rebuild passes
# through a broker-owned daemon (~27 s locally). Same budget as its siblings. `#[ignore]`d by default
# (see the test's own doc comment), but still needs a real budget for the
# explicit `--ignored` runs this test exists to be run with.
[[profile.default.overrides]]
filter = 'test(=daemon_rss_ceiling::daemon_rss_retention_rate_per_compile_stays_within_budget)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

