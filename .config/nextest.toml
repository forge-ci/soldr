# These modules run real Cargo front doors from isolated homes. Keep their
# shared pressure serial without coupling them to broker/daemon lifecycle tests.
# On hosted Windows, launching even one beside unrelated test processes has
# produced clusters of 120s timeouts (soldr#2697), so the first override also
# reserves the complete Windows-target Nextest pool. Linux does not need that
# full-runner reservation: retaining it there left the second CI test thread
# idle for 708 measured test-seconds and made Fresh Nextest take 26m57s. The
# duplicated filter is guarded for exact equality in
# tests/test_nextest_timeout_wrapper.py so membership cannot drift.
#
# The second windows-gnu replay named two more members of the same family
# (run 32470380389): `cargo_without_timeout_allows_progress_cpu_and_lock_waits`
# runs three back-to-back isolated-HOME front doors, and
# `cargo_front_door_forces_msvc_target_even_with_polluted_path` runs a real
# fixture build with a scrubbed PATH. Both timed out at exactly 120s while
# 852 siblings passed, so they join the reservation rather than getting a
# larger private budget.
#
# soldr#2737 promoted `cli_cargo_basic` from a per-test entry to the whole
# unit (then the `cli_cargo_basic` binary, now the `cli_cargo_basic` module of
# `cargo_front_door`): 19 of its 21 tests drive `isolated_soldr_command`, so it
# has the same profile as the three modules above rather than being a mixed bag
# with a few cold builds in it. `cli_dylint_wrapper` has the same shape: its
# fake compiler chains still cold-start isolated Soldr front doors, and the
# prescribed `soldr ci-test` run measured two of them at 121s when they raced
# each other versus 63-78s in isolation (soldr#2867). Three separate rounds
# had already added the `cli_cargo_basic` tests one at a time (soldr#2696,
# then two more timing out at 120s on
# job 97088274620) -- that drip was the signal. The subsumed per-test entry
# for `cargo_without_timeout_allows_progress_cpu_and_lock_waits` is gone with
# it. The remaining `test(=...)` entries stay per-test on purpose: they live
# in modules that are NOT predominantly cold front doors, and a fast test
# added to one of those should not inherit a whole-runner reservation.
#
# soldr#2720 named the next one on a docs-only PR (run 32530365077):
# `cli_exec::exec_cargo_build_routes_through_child_shims` drives
# `isolated_soldr_command` for `soldr exec cargo build`, so it cold-starts
# its own broker and daemon. Its cargo/rustc/zccache are fake scripts, so
# the 120.208s was soldr cold-start under contention, not tool work.
# Test-scoped rather than module-scoped: that module holds one test today,
# but a fast test added to it later should not inherit a whole-runner
# reservation.
#
# soldr#2944 split the bounded doc-route harness into
# `cli_cargo_doc_routes`. Six real front-door tests there use the same isolated
# homes as these modules, so they retain the full-runner reservation after the
# module move rather than running beside the cold-build family. The other
# tests in that module only parse phases or budgets (and the direct rustdoc
# passthrough has no Cargo cold route), so naming the whole module would
# unnecessarily serialize them.
#
# soldr#2934 note: this entry previously named
# `test(=exec_cargo_build_routes_through_child_shims_and_zccache)`, a test that
# does not exist anywhere in the tree -- the `_and_zccache` suffix was dropped
# from the function at some point and the filter was never updated, so the
# reservation described above had silently not been in effect. Repaired to the
# real name.
[test-groups.soldr-cargo-cold-builds]
max-threads = 1

# soldr#3138 follow-up to #3161 (history; soldr#3625 folded this Linux twin,
# `soldr-cargo-cold-builds-linux`, into `soldr-cold-start-linux`): same
# membership, two threads, Linux only.
#
# After #3161 raised `soldr-runtime` on Linux, THIS group became the gate's
# serial tail. Measured on run 34086777738: t+812..t+983 of a 983s stage ran
# at concurrency 1 -- 171s, one test at a time -- and every member cost a
# near-identical ~15.7s (15.87 / 15.37 / 15.48 / 15.82 / 15.62 / 15.67 / 15.77
# / 15.83). That uniformity is the cold broker+daemon start itself, now that
# soldr#2521/#2996 made the executable image hash a cache hit; it is real work,
# not a stall, and it is the same shape #3161 addressed one group over.
#
# Two things make raising it here specifically safe:
#
#   1. This file already records that Linux is the less constrained platform
#      for this group -- "Linux does not need that full-runner reservation:
#      retaining it there left the second CI test thread idle for 708 measured
#      test-seconds and made Fresh Nextest take 26m57s". The full-runner
#      reservation was already relaxed on Linux for exactly this reason; this
#      continues that, and the Windows reservation above is untouched.
#   2. soldr#3024 attempt 2's regression (18m11 -> 26m14) was `priority` on this
#      group -- a DISPATCH-ORDER change that front-loaded these tests against
#      cold nested builds. This is a CAPACITY change and adds no reordering;
#      `priority` remains absent and guarded.
#
# Paired with the same SOLDR_ROUTE_ACQUIRE_CEILING_MS raise #3161 added to
# `_build-and-test.yml`, for the same reason: two concurrent cold starts slow
# each other, and the 120s `route_ceiling` is a threshold rather than a hang
# detector.
#
# Expect less than half the 171s back. #3161 measured total test-seconds rising
# 19% when its group went two-wide -- the contention tax is real and partly
# cancels the packing win. This is worth doing anyway because the tail is
# strictly serial today, but it is not a 2x.

[[profile.default.overrides]]
filter = '(binary(cargo_front_door) & test(/^(cli_cargo_basic|cli_cargo_linker|cli_cargo_run_trampoline|cli_cargo_wrappers|cli_dylint_wrapper)::/)) + (binary(cargo_front_door) & test(/^cli_cargo_doc_routes::(cargo_doc_keeps_rustc_wrapped_but_rustdoc_direct|bare_doc_keeps_rustc_wrapped_but_rustdoc_direct|cargo_doc_route_deadline_kills_wrapper_hold_tree|bare_doc_route_deadline_kills_rustdoc_hold_tree|cargo_doc_tests_keep_rustc_wrapped_but_rustdoc_direct|rustdoc_path_shim_reenters_direct_passthrough_without_zccache)$/)) + test(=cli_wrapper::cargo_front_door_forces_msvc_target_even_with_polluted_path) + test(=cli_exec::exec_cargo_build_routes_through_child_shims)'
platform = { target = 'cfg(target_os = "windows")' }
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = '(binary(cargo_front_door) & test(/^(cli_cargo_basic|cli_cargo_linker|cli_cargo_run_trampoline|cli_cargo_wrappers|cli_dylint_wrapper)::/)) + (binary(cargo_front_door) & test(/^cli_cargo_doc_routes::(cargo_doc_keeps_rustc_wrapped_but_rustdoc_direct|bare_doc_keeps_rustc_wrapped_but_rustdoc_direct|cargo_doc_route_deadline_kills_wrapper_hold_tree|bare_doc_route_deadline_kills_rustdoc_hold_tree|cargo_doc_tests_keep_rustc_wrapped_but_rustdoc_direct|rustdoc_path_shim_reenters_direct_passthrough_without_zccache)$/)) + test(=cli_wrapper::cargo_front_door_forces_msvc_target_even_with_polluted_path) + test(=cli_exec::exec_cargo_build_routes_through_child_shims)'
platform = { target = 'cfg(target_os = "linux")' }
test-group = 'soldr-cold-start-linux'

[[profile.default.overrides]]
filter = '(binary(cargo_front_door) & test(/^(cli_cargo_basic|cli_cargo_linker|cli_cargo_run_trampoline|cli_cargo_wrappers|cli_dylint_wrapper)::/)) + (binary(cargo_front_door) & test(/^cli_cargo_doc_routes::(cargo_doc_keeps_rustc_wrapped_but_rustdoc_direct|bare_doc_keeps_rustc_wrapped_but_rustdoc_direct|cargo_doc_route_deadline_kills_wrapper_hold_tree|bare_doc_route_deadline_kills_rustdoc_hold_tree|cargo_doc_tests_keep_rustc_wrapped_but_rustdoc_direct|rustdoc_path_shim_reenters_direct_passthrough_without_zccache)$/)) + test(=cli_wrapper::cargo_front_door_forces_msvc_target_even_with_polluted_path) + test(=cli_exec::exec_cargo_build_routes_through_child_shims)'
test-group = 'soldr-cargo-cold-builds'

# soldr#3625: front-door modules with the cold-start shape that were in no
# group. Each hands a Soldr front door a cacheable compile (`cargo build`,
# `cargo clippy`, `maturin build`, `wheel`, `rust-analyzer`'s spawned cargo)
# on a fresh SOLDR_CACHE_DIR, so its first compile pays a broker spawn plus a
# daemon bring-up. Two of them failed soldr#3625 (`cli_cargo_zccache_mode`,
# `cli_maturin`), and `cli_rust_analyzer` was a contender in the third.
# `tests/test_nextest_cold_start_group.py` derived this list from the sources
# and fails when a module with the shape is missing from every cold-start
# group, or when a name below stops being a real module.
#
# Kept as its own filter rather than appended to the cold-build filter above:
# that filter is shared verbatim with the Windows full-runner reservation
# (every CPU's worth of threads), which none of these has earned. Off Linux
# they join the one-thread `soldr-cargo-cold-builds` group they share a shape
# with.
[[profile.default.overrides]]
filter = '(binary(cargo_front_door) & test(/^(cli_cargo_clippy_fixture|cli_cargo_dylint_link|cli_cargo_native_cc|cli_cargo_zccache_mode|cold_first_compile)::/)) + (binary(daemon) & test(/^cli_debug_trace_observer::/)) + (binary(fetch_tools) & test(/^(cli_maturin|cli_rust_analyzer|cli_wheel)::/)) + (binary(toolchain_env) & test(/^cli_save::/))'
platform = { target = 'cfg(target_os = "linux")' }
test-group = 'soldr-cold-start-linux'

[[profile.default.overrides]]
filter = '(binary(cargo_front_door) & test(/^(cli_cargo_clippy_fixture|cli_cargo_dylint_link|cli_cargo_native_cc|cli_cargo_zccache_mode|cold_first_compile)::/)) + (binary(daemon) & test(/^cli_debug_trace_observer::/)) + (binary(fetch_tools) & test(/^(cli_maturin|cli_rust_analyzer|cli_wheel)::/)) + (binary(toolchain_env) & test(/^cli_save::/))'
test-group = 'soldr-cargo-cold-builds'

# The run-wrapper is the native `soldr-nextest-wrapper`
# (crates/soldr-nextest-wrapper, soldr#3454); `nextest_wrapper.sh` refuses a
# developer host and otherwise finds the binary beside the test binary's Cargo
# profile directory, where a workspace build and an extracted Nextest archive
# both put it; a scoped source run builds it there on first use. The same wrapper hosts soldr#2885's per-test memory controls
# (`crates/soldr-nextest-wrapper/src/guard.rs`). They are inert unless
# `soldr ci-test` hands them an admission directory and a per-test ceiling for
# its Nextest execution stage; a plain `soldr cargo nextest run` is unchanged.
[scripts.wrapper.timeout-diagnostics]
command = { command-line = ".github/scripts/nextest_wrapper.sh", relative-to = "workspace-root" }
target-runner = "within-wrapper"

[[profile.default.scripts]]
filter = "all()"
# Select by the executable's target, not the build host. Cross-built Windows
# archives are assembled on Linux, and must retain their PE test executables
# instead of recording this Unix wrapper as the program to launch.
platform = { target = "cfg(unix)" }
run-wrapper = "timeout-diagnostics"

# 300s: real-rustc end-to-end compiles through the session bridge, plus the
# Windows long-path publication cases -- plus (soldr#2883)
# `windows_stop_start_is_immediately_status_ready`, whose broker route start
# is legitimately slow on windows-gnu: measured at 89.8s against the 90s the
# fixture allows it, so the bounds have to nest rather than race.
#
# The three `session_*` tests are soldr-daemon *lib* unit tests living under
# `crates/soldr-daemon/src/daemon/`, so their names carry the full module path.
# They were written here as bare names and therefore matched nothing; soldr#2934
# repaired them alongside the soldr-cli migration.
[[profile.default.overrides]]
filter = 'test(=daemon::session_endpoint::tests::session_endpoint_serves_real_compile_via_mux) + test(=daemon::session_serve::tests::session_compile_e2e_real_rustc_through_the_bridge) + test(=daemon::session_serve::tests::session_client_disconnect_mid_compile_aborts_without_reply) + test(=agent_worktree_share::windows_long_path_publication_survives_fresh_worktree_reuse) + test(=agent_worktree_share::windows_deep_cache_root_keeps_staged_linker_path_short) + test(=cli_daemon_lifecycle::cargo_test_recovers_after_daemon_stop_without_herd_spawning) + test(=daemon_restart_warmth::graceful_daemon_restart_serves_the_next_build_warm) + test(=daemon_restart_warmth::hard_killed_daemon_loses_at_most_one_save_batch) + test(=cli_daemon_lifecycle::windows_stop_start_is_immediately_status_ready)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

# 240s: daemon single-instance races, which spin up two daemons and wait for
# one to lose.
#
# soldr#2934: this entry also named `no_spawn_guard_leaves_no_daemon_runtime_copy`,
# which does not exist anywhere in the workspace under that or any near name --
# it had been dead well before the consolidation. Dropped rather than left as a
# no-op term. If that test is reintroduced, re-add it module-qualified.
[[profile.default.overrides]]
filter = 'test(=cli_daemon_single_instance::two_daemons_against_one_root_never_coexist) + test(=cli_daemon_single_instance::losing_daemon_leaves_the_state_db_openable)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "30s" }

# 180s: toolchain-preparation memo invalidation and rustup passthrough, both
# of which shell out to a real toolchain.
[[profile.default.overrides]]
filter = 'test(=cli_cargo_wrappers::cargo_front_door_invalidates_toolchain_preparation_memo) + test(=cli_toolchain::rustup_passthrough_forwards_args_unchanged_for_unscoped_subcommands) + test(=daemon_cache_maintenance::prod_dev_daemons_and_manual_orphan_maintenance_are_isolated)'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "30s" }

# soldr#3138: this entry used to also carry `threads-required = "num-cpus"`,
# reserving the ENTIRE runner for one test. It was the only tuning decision in
# this file with no comment saying why, and it was measured costing 25.1s of
# whole-runner idle on the Linux gate (t+88s..t+113s of a 1046s stage) -- three
# of four threads parked.
#
# Removed rather than documented, because the reservation does not buy this test
# anything the group already gives it. It is a member of `soldr-runtime`
# (`binary(broker) & test(/^cli_broker_resurrection::/)` above), so it already
# never runs beside another broker/daemon lifecycle test. What it measures is a
# SIGSTOPped owner's lease *expiring*, which is wall-clock: unrelated CPU load
# on other threads does not shorten or lengthen a lease.
#
# If this does turn out to need more than group isolation, the fix is to say so
# here -- an uncommented whole-runner reservation is how 25s went missing
# unnoticed in the first place.
[[profile.default.overrides]]
filter = 'test(=cli_broker_resurrection::issue_2476_sigstop_owner_is_fenced_after_lease_expiry)'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "30s" }

# 240s: two complete isolated-HOME soldr runs back to back (the cargo-fmt and
# bare-fmt labels), each paying a cold broker+daemon start. When this budget
# was set that included a full executable image hash per start (soldr#2517);
# the broker's blake3 is now memoized per inode (soldr#2521/#2996) and the
# daemon's per-start SHA-256 fell from ~2.9s to ~0.13s (soldr#3173), so what
# remains is spawn, route acquisition and bringup -- per phase in
# `daemon-bringup.jsonl` (soldr#3163). soldr#2624 observations 3-4, taken
# before those fixes: timed out at exactly
# 120s twice on contended windows-msvc target-runs while stub siblings in the
# same module legitimately ran 49-85s — the length is real cold-start work
# x2, not a hang (the second strike's retained output shows the first soldr
# child still executing, and the run passed on a quieter runner).
[[profile.default.overrides]]
filter = 'test(=cli_cargo_wrappers::cargo_fmt_routes_rustfmt_through_zccache_formatter)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "30s" }

# 240s: this module drives fake compiler chains through isolated Soldr homes.
# The ci-test cold proof measured the two competing front doors at 121s each;
# after reserving the cold-build group, the longest single front door still
# crossed the default boundary at 123s. Keep the usual 60s diagnostics while
# allowing the same four-period budget as the other multi-front-door fixtures.
[[profile.default.overrides]]
filter = 'binary(cargo_front_door) & test(/^cli_dylint_wrapper::/)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "30s" }

# 240s: the `toolchain link` pair and the cargo-fmt home-boundary test, for
# the same reason as `cargo_fmt_routes_rustfmt_through_zccache_formatter`
# above -- each is a full isolated-HOME soldr run paying a cold broker+daemon
# start (image hashing is no longer the dominant term; see that entry), and
# the idempotency test runs `toolchain link` twice.
#
# The length is measured, not assumed: on the windows-gnu replay lane
# `toolchain_link_writes_every_routed_tool_into_shim_dir` PASSED at 116.202s
# -- 3.8s inside the 120s wall -- while its strictly-more-work sibling
# `toolchain_link_is_idempotent_when_rerun_with_same_soldr_binary` timed out
# at exactly 120s. Their env-plumbing neighbours in the same modules finished
# in 1.8s and 3.0s, so this is cold-start cost on the slowest lane, not a hang.
#
# soldr#2729: the same lane later named the other two members of that
# module on `main` itself (run 32536450196) --
# `toolchain_link_emits_schema_v1_json_payload` at 120.251s and
# `toolchain_link_force_overwrites_user_modified_shim` at 120.223s. Same
# `isolated_soldr_command` cold start, same treatment: they were simply
# not among the two observed when the pair above was measured.
[[profile.default.overrides]]
filter = 'test(=cli_toolchain::toolchain_link_writes_every_routed_tool_into_shim_dir) + test(=cli_toolchain::toolchain_link_is_idempotent_when_rerun_with_same_soldr_binary) + test(=cli_toolchain::toolchain_link_emits_schema_v1_json_payload) + test(=cli_toolchain::toolchain_link_force_overwrites_user_modified_shim) + test(=cli_toolchain_home_boundary::cargo_fmt_host_toolchain_does_not_mix_in_managed_rustup_home)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "30s" }

# 240s: the retained soldr#2442 adapter kill-matrix. Generic multi-route
# isolation and concurrent single-flight replacement live in running-process
# 4.10.9; these cases retain only Soldr CLI/route/image behavior after real
# SIGKILLs (plus a source-only ownership inventory guard).
[[profile.default.overrides]]
filter = 'binary(broker) & test(/^cli_kill_matrix::/)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "30s" }

# Inherits `[profile.default]`, so the timeouts above apply here too. That is
# required, not incidental: with `timed_test!` gone, this profile would
# otherwise let a hung test run until the job's 45-minute ceiling.
[profile.target-run]
fail-fast = false

# Target-run intentionally inherits the default profile's zero-retry policy.
# A failed attempt is evidence, not a reason to spend another target-run slot
# rerunning a deterministic failure. The workflow bounds the lane to three
# distinct failures so it still reports a small useful cluster before exiting.

# soldr#2968: the x86_64 macOS replay now runs on `macos-15` ARM under
# Rosetta, where every packaged tool and every child process is emulated.
# `gc_list_json_reports_built_project_target_dir` is the suite's most
# process-heavy test -- it cold-starts a broker and daemon route and builds a
# project -- and it is already singled out above for exactly that reason
# (test-group `soldr-runtime`, after it starved on the windows-gnu lane).
#
# Under emulation it landed at 120.273s against the inherited 60s x 2 budget:
# over by a quarter of a second, on a lane where the same work is several
# times more expensive than the budget was sized for. Widening it here rather
# than in `[profile.default]` keeps the tighter deadline everywhere the test
# runs natively, so a real regression on a native lane still surfaces at 120s.
[[profile.target-run.overrides]]
filter = 'test(=cli_gc::gc_list_json_reports_built_project_target_dir)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

# The native-cache-off proof shells out through an isolated Cargo front door
# and then validates that C/C++ injection stayed disabled.  On the x86_64
# macOS replay under Rosetta it completed successfully in 119.66s, but the
# outer timeout wrapper received nextest's SIGTERM at the inherited 120s
# boundary first and marked the already-successful test as a timeout
# (runs 33380028079 and 33376007990).  Keep the native deadline tight and
# grant only the emulated target-run this measured 300s budget.
[[profile.target-run.overrides]]
filter = 'test(=cli_cargo_native_cc::no_cache_global_disables_native_too)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "30s" }

[profile.target-run.junit]
path = "junit.xml"
report-name = "soldr-target-run"
store-failure-output = true
