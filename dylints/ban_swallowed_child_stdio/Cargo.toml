[package]
name = "ban_swallowed_child_stdio"
version = "0.1.0"
description = "Ban discarding child stdout/stderr with a null sink"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.2.0"

[dev-dependencies]
dylint_testing = "=6.2.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]

# cargo-dylint discovers prebuilt libraries in the `release` profile directory.
# Keep that directory contract without paying shipped-binary optimization costs
# for a CI-only lint plugin.
[profile.release]
opt-level = 0
lto = false
codegen-units = 16
strip = "none"
