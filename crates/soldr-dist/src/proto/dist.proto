syntax = "proto3";
package soldr.dist;
message InputFile {
  string abs_path = 1;
  string blake3 = 2;
  uint64 size = 3;
  bool executable = 4;
}
message DistJob {
  string compiler_kind = 1;
  string compiler_identity = 2;
  repeated string argv = 3;
  map<string, string> env = 4;
  string cwd = 5;
  bytes stdin = 6;
  repeated InputFile inputs = 7;
  repeated string outputs = 8;
  repeated string rewrite_env = 9;
}
message Hello {
  uint32 version = 1;
  repeated string toolchains = 2;
}
message Offer {
  DistJob job = 1;
  repeated string speculative = 2;
}
message Need {
  repeated string digests = 1;
  uint64 cas_hits = 2;
  bool cas_hits_known = 3;
}
message Blob {
  string digest = 1;
  uint64 size = 2;
}
message Accepted {
}
message Declined {
  string reason = 1;
}
message OutputFile {
  string abs_path = 1;
  string blake3 = 2;
  uint64 size = 3;
  uint32 mode = 4;
}
message Done {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  repeated OutputFile outputs = 4;
  bytes dependency_info = 5;
}
message Fetch {
  repeated string digests = 1;
}
message Status {
  string node_id = 1;
  string role = 2;
  repeated string trusted_clients = 3;
  repeated string trusted_workers = 4;
  uint64 cas_bytes = 5;
  uint64 running_joblets = 6;
  uint64 pid = 7;
  string build_id = 8;
  string signal_url = 9;
  JobMetrics last_job = 10;
}
message Reply {
  Accepted accepted = 1;
  Declined declined = 2;
  Done done = 3;
  Need need = 4;
}

message JobMetrics {
  string worker_id = 1;
  string path = 2;
  string remote_addr = 3;
  uint64 rtt_micros = 4;
  bool rtt_known = 5;
  uint64 bytes_sent = 6;
  uint64 bytes_received = 7;
  uint64 connection_bytes_sent = 8;
  uint64 connection_bytes_received = 9;
  uint64 input_files = 10;
  uint64 input_digests = 11;
  uint64 need_digests = 12;
  uint64 cas_hits = 13;
  uint64 uploaded_blobs = 14;
  uint64 dedup_inputs = 15;
  uint64 speculative_blobs = 16;
  string outcome = 17;
  string decline_reason = 18;
  int32 exit_code = 19;
  uint64 elapsed_millis = 20;
  string connection_side = 21;
  bool cas_hits_known = 22;
  uint64 completed_unix_millis = 23;
}
