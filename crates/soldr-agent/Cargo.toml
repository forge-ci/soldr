[package]
name = "soldr-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
futures-util = { version = "=0.3.33", features = ["sink"] }
getrandom = "=0.4.3"
if-addrs = "=0.13.4"
fs2.workspace = true
prost.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.10"
serde.workspace = true
serde_json.workspace = true
soldr-platform = { path = "../soldr-platform" }
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
