[package]
name = "soldr-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "soldr host-platform leaf: the one crate that selects Windows/Linux/macOS mechanics"
publish = false

# Dependency-leaf crate (issue #2493): soldr-platform must NOT depend on
# soldr-core, soldr-fetch, soldr-cache, soldr-daemon, soldr-cli, or zccache.
# Only external libraries needed for host primitives may appear here.
# `kernal-api` is allowed here despite the leaf rule: it is the shared
# systems-facade crate soldr and zccache are both consolidating onto
# (soldr#3297), not an internal soldr crate.
# `running-process` is the external process-creation boundary, consumed as an
# exact crates.io pin. soldr#2837 retired the vendored `_vender/` submodule and
# the workspace [patch] tables that used to redirect it.

[dependencies]
blake3 = "1"
interprocess = { version = "2", features = ["tokio"] }
# Exact pin: kernal-api is pre-1.0, so per its COMPATIBILITY.md every
# consumer must resolve the same release. This must equal the kernal-api
# version the locked `zccache` package depends on (soldr#3297); the guard
# `kernal_api_version_matches_across_the_fleet` in
# crates/soldr-cli/tests/guards/version_lockstep.rs enforces that.
kernal-api = { version = "=0.1.26", default-features = false, features = ["fs"] }
running-process = { version = "=4.10.16", default-features = false, features = ["client"] }
fs2 = { workspace = true }
wait-timeout = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
