[package]
name = "soldr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "soldr foundation: shared types, config, paths, wire schema, defender plumbing, test watchdog"
publish = false

[dependencies]
soldr-platform = { path = "../soldr-platform" }
prost = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
wait-timeout = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# soldr#1761: `GetLogicalProcessorInformationEx` is the only way to read
# physical-core topology on Windows without adding a heavier crate.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
