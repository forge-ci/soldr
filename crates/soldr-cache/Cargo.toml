[package]
name = "soldr-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "soldr RUSTC_WRAPPER cache library: hashing, cache layout, save/load transport, auto-GC"
publish = false

[dependencies]
soldr-core = { path = "../soldr-core" }
soldr-platform = { path = "../soldr-platform" }

filetime = { workspace = true }
fs2 = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
tar = { workspace = true }
tracing = { workspace = true }
# soldr#2899: cache_lib only reads zccache's hashing, config, and embedded
# service types, all of which are unconditional. No zccache feature is enabled.
# soldr#3289: source-mtime replay delegates to `zccache::fingerprint::mtime_replay`,
# which the amalgamated crate re-exports unconditionally, so still no zccache
# feature is enabled.
zccache = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
zstd = { workspace = true }

[lints]
workspace = true
