name: Setup Soldr Action

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact candidate SHA selected by canonical CI
        required: true
        type: string
  # Full CI owns automatic invocation; manual smoke runs remain available.
  workflow_dispatch:

permissions:
  contents: read

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  # A called workflow inherits the caller's github.workflow; use a literal
  # prefix so this job cannot cancel the canonical CI run that invoked it.
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: setup-soldr-action-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # zackees/ci.yml#6: every cache this workflow can save in PR context
  # carries `pr-<N>` in its key, so the ci-pre janitor can delete it once
  # the PR closes. Empty outside a pull request, so main keys are
  # unchanged. Enforced by .github/scripts/check_pr_cache_keys.py.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 45
    env:
      # soldr still fetches managed support tools from GitHub Releases.
      # Use soldr's explicit opt-in token env so release metadata requests
      # are authenticated without weakening the generic GITHUB_TOKEN guard.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Enlarge swap (OOM headroom)
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#2131. install.sh was executed by nothing -- it appeared in the
      # workflows only inside `paths:` triggers -- so a bash 4.0 builtin sat in
      # the one script users are told to run and every check stayed green
      # (soldr#2130). This job already triggers on install.sh, so it is the
      # cheapest place to actually run it.
      #
      # soldr#3071: this used to run on both a Linux and a macOS leg, and the
      # macOS leg was the one that mattered -- it executed under the real
      # /bin/bash 3.2, which is what the original bug needed; Linux's bash 5
      # could not have caught it. No GitHub Actions job may run on a macos-*
      # runner any more, so that live coverage is gone; the static regex scan
      # in tests/test_macos_bash_portability.py is what is left guarding
      # bash-4-only constructs in this and every other contributor-facing
      # shell script. This step (Linux, bash 5) still covers the CRLF
      # handling install.sh also fixed, which was never macOS-specific.
      # This workflow had no uv step; the same pinned action ci.yml uses.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}

      - name: Smoke-test install.sh (soldr#2131)
        shell: bash
        run: |
          set -euo pipefail
          bash --version | head -1
          uv run --no-project --python 3.13 --with pytest python -m pytest \
            tests/test_install_sh_smoke.py -q

      - name: Verify setup-soldr pin matches v0
        shell: bash
        # Non-blocking: a stale pin warns visibly in the PR checks list
        # (the step turns yellow) but does not fail the job. We'll handle
        # the pin bump out-of-band rather than gating every unrelated PR
        # on an upstream tag move.
        continue-on-error: true
        run: |
          set -uo pipefail
          # soldr#2763: the `command -v python3` fallback existed because this
          # workflow had no interpreter it could count on. The uv step above
          # supplies one on every leg, so the branch is gone rather than being
          # converted twice.
          uv run --no-project --python 3.13 python \
            .github/scripts/verify_setup_soldr_pin.py
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::warning title=setup-soldr pin stale::Pin in .github/workflows/setup-soldr-action.yml does not match v0 — non-blocking; bump out-of-band."
            exit $status
          fi

      - id: setup
        # This is zackees/setup-soldr@v0 pinned to a full SHA
        # because this repository's ruleset requires SHA-pinned actions.
        uses: zackees/setup-soldr@794fb3083729fd6be3396ab6cbd573c9f756d2f5
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          cook-delta: false
          cache: true
          zccache-seed-strict: true
          linker: platform-default
          # Keep the action runtime cache separate from the Soldr build under
          # test. The dogfood build below overrides SOLDR_CACHE_DIR so soldr
          # owns zccache under that separate root.
          cache-dir: ${{ runner.temp }}/setup-soldr-action-state
          cache-key-suffix: dogfood-action-state
          build-cache: false
          # soldr#2996 removed soldr's target-cache implementation, so the
          # action's layer has nothing left to drive. Kept explicit rather
          # than defaulted until the input itself is retired upstream.
          target-cache: false
          # This workflow builds and tests soldr explicitly below. Running
          # soldr-cook here compiles the same workspace first, and release-only
          # Cargo.lock version bumps invalidate its whole-lockfile cache key.
          prebuild-deps: none

      - name: Show action outputs
        shell: pwsh
        run: |
          Write-Host "soldr-path=${{ steps.setup.outputs.soldr-path }}"
          Write-Host "soldr-version=${{ steps.setup.outputs.soldr-version }}"
          Write-Host "cache-dir=${{ steps.setup.outputs.cache-dir }}"
          Write-Host "cache-hit=${{ steps.setup.outputs.cache-hit }}"
          Write-Host "build-cache-hit=${{ steps.setup.outputs.build-cache-hit }}"
          Write-Host "target-cache-hit=${{ steps.setup.outputs.target-cache-hit }}"
          Write-Host "toolchain=${{ steps.setup.outputs.toolchain }}"

      - name: Verify setup state
        shell: pwsh
        run: |
          if (-not (Test-Path $env:SOLDR_CACHE_DIR)) { throw "missing SOLDR_CACHE_DIR" }
          if (-not (Test-Path $env:CARGO_HOME)) { throw "missing CARGO_HOME" }
          if (-not (Test-Path $env:RUSTUP_HOME)) { throw "missing RUSTUP_HOME" }
          soldr version --json
          soldr cargo --version
          soldr rustc --version

      - name: Repair incomplete cached rustlib
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.13 python ci/repair_rustlib.py

      - name: Verify cache isolation
        shell: pwsh
        env:
          SOLDR_DOGFOOD_BUILD_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test
        run: |
          $actionCache = [System.IO.Path]::GetFullPath($env:SOLDR_CACHE_DIR)
          $buildCache = [System.IO.Path]::GetFullPath($env:SOLDR_DOGFOOD_BUILD_CACHE_DIR)
          $actionPrefix = $actionCache.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          $buildPrefix = $buildCache.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          if ($actionCache -eq $buildCache -or $buildCache.StartsWith($actionPrefix) -or $actionCache.StartsWith($buildPrefix)) {
            throw "setup-soldr action cache must be disjoint from the Soldr build-under-test cache"
          }
          New-Item -ItemType Directory -Force -Path $buildCache | Out-Null
          $zccacheDir = Join-Path -Path (Join-Path -Path $buildCache -ChildPath "cache") -ChildPath "zccache"
          New-Item -ItemType Directory -Force -Path $zccacheDir | Out-Null
          Write-Host "action-cache=$actionCache"
          Write-Host "build-under-test-cache=$buildCache"
          Write-Host "build-under-test-zccache=$zccacheDir"

      - id: dogfood-build-cache
        name: Restore dogfood build cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-build-under-test/cache/zccache
          key: setup-soldr-dogfood-zccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            setup-soldr-dogfood-zccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            setup-soldr-dogfood-zccache-v1-${{ runner.os }}-${{ runner.arch }}-

      # soldr#3398: the prune step below counts entries touched after this
      # stamp as this run's working set; everything older is prunable.
      - name: Mark dogfood zccache store restore time
        shell: bash
        run: date +%s > "${{ runner.temp }}/dogfood-zccache-restored-at"

      - name: Stop setup-soldr builder cache before dogfood build
        uses: zackees/setup-soldr/cleanup@794fb3083729fd6be3396ab6cbd573c9f756d2f5

      - name: Build through soldr
        shell: pwsh
        # Uncapped (soldr#3148). The action installs the latest soldr release;
        # this step ran at jobs=1 while that release predated soldr#3211
        # (compiler children SIGTERMed mid-compile, soldr#3210). 0.9.16
        # carries soldr#3211, so exclusive admission owns concurrency.
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test/cache/zccache
        run: |
          Write-Host "dogfood-build-cache-hit=${{ steps.dogfood-build-cache.outputs.cache-hit }}"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo build --package soldr-cli
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Write-Host ([string]::Format([Globalization.CultureInfo]::InvariantCulture, "dogfood-build-seconds={0:F3}", $timer.Elapsed.TotalSeconds))
          exit $exitCode

      - name: Test through soldr
        shell: pwsh
        # Rung-4 cap, step-scoped (CLAUDE.md): this runs with `--no-cache`, so
        # no embedded compiler service and no admission gate to ask.
        env:
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test
        run: |
          Remove-Item Env:ZCCACHE_CACHE_DIR -ErrorAction SilentlyContinue
          $binaryName = Split-Path -Leaf (Get-Command soldr).Source
          if ([string]::IsNullOrWhiteSpace($env:CARGO_TARGET_DIR)) {
            $targetDir = Join-Path $PWD "target"
          } elseif ([System.IO.Path]::IsPathRooted($env:CARGO_TARGET_DIR)) {
            $targetDir = $env:CARGO_TARGET_DIR
          } else {
            $targetDir = Join-Path $PWD $env:CARGO_TARGET_DIR
          }
          $rustcVersion = & soldr rustc -vV
          $rustcExitCode = $LASTEXITCODE
          $hostLine = ($rustcVersion | Select-String '^host:\s*' | Select-Object -First 1).Line
          if ($rustcExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($hostLine)) {
            throw "could not resolve the host triple for the freshly built soldr"
          }
          $hostTriple = $hostLine -replace '^host:\s*', ''
          $defaultLayout = Join-Path $targetDir (Join-Path "debug" $binaryName)
          $hostLayout = Join-Path $targetDir (Join-Path (Join-Path $hostTriple "debug") $binaryName)
          $candidates = if ($IsWindows) { @($hostLayout, $defaultLayout) } else { @($defaultLayout, $hostLayout) }
          $builtSoldr = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $builtSoldr) { throw "missing freshly built soldr binary; checked: $($candidates -join ', ')" }
          $stagingDir = Join-Path $env:RUNNER_TEMP "soldr-under-test"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          $soldrUnderTest = Join-Path $stagingDir $binaryName
          Copy-Item -LiteralPath $builtSoldr -Destination $soldrUnderTest -Force
          if (-not $IsWindows) { & chmod +x -- $soldrUnderTest }
          $versionJson = & $soldrUnderTest version --json
          if ($LASTEXITCODE -ne 0) { throw "freshly built soldr version probe failed" }
          $actualVersion = ($versionJson | ConvertFrom-Json).soldr_version
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($actualVersion -ne $expectedVersion) {
            throw "wrong soldr under test: expected $expectedVersion, got $actualVersion"
          }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $soldrUnderTest --no-cache cargo nextest run -p soldr-cli --tests
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Write-Host ([string]::Format([Globalization.CultureInfo]::InvariantCulture, "dogfood-test-seconds={0:F3}", $timer.Elapsed.TotalSeconds))
          exit $exitCode

      - name: Show dogfood cache status
        if: always()
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test/cache/zccache
        run: |
          $soldr = Get-Command soldr -ErrorAction SilentlyContinue
          if (-not $soldr) {
            Write-Host "soldr is unavailable; skipping dogfood cache status"
            exit 0
          }
          & $soldr.Source cache
          if ($LASTEXITCODE -ne 0) {
            Write-Host "soldr cache status unavailable after dogfood build"
            exit 0
          }

      - name: Stop dogfood zccache before cache save
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-build-under-test/cache/zccache
        run: |
          $soldr = Get-Command soldr -ErrorAction SilentlyContinue
          if (-not $soldr) {
            Write-Host "soldr is unavailable; nothing to stop."
            exit 0
          }
          & $soldr.Source zccache stop

      # soldr#3398 (R8 in check_cache_ownership.py): the restore above falls
      # back through a lockfile-hash prefix and the build appends to the
      # store, so without this the saved generation grows forever. Drop the
      # version trees this run never touched and trim the store to its share
      # of the `setup-soldr-action-stores` family (512 MiB of 1.30 GiB) before
      # the save. `check_cache_budget.py --prune` keeps only the newest saved
      # generation per lockfile prefix.
      - name: Measure, prune and trim the dogfood zccache store (soldr#3398)
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.dogfood-build-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          store="${{ runner.temp }}/soldr-build-under-test/cache/zccache/daemon-state"
          if [[ ! -d "$store" ]]; then
            echo "no dogfood zccache store at $store; nothing to trim"
            exit 0
          fi
          uv run --no-project --python 3.13 python .github/scripts/measure_zccache_working_set.py \
            --store "$store" \
            --since-file "${{ runner.temp }}/dogfood-zccache-restored-at" \
            --prune-dead-version-dirs \
            --trim \
            --cap-bytes 536870912 \
            --reserve-bytes 0 \
            --soldr "$(command -v soldr)"

      # actions/cache@v4 has no `save-if` input, so main-only saving requires
      # the restore/save split (soldr#3047). This save must stay after the
      # zccache stop above — the cache is saved with the daemon stopped.
      - name: Save dogfood build cache (soldr#3047)
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.dogfood-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-build-under-test/cache/zccache
          key: ${{ steps.dogfood-build-cache.outputs.cache-primary-key }}
