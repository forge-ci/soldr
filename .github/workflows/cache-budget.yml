# Thin event caller for the cache janitor and budget verdict in ci-pre.yml
# (soldr#3047, zackees/ci.yml#6 row 9 "Cache (live)").
#
# ci.yml calls ci-pre.yml as its first job on every PR, main push and
# dispatch. This file adds the triggers ci.yml does not have, so there is one
# janitor with one set of rules:
#
# * push to any other branch -- the janitor runs on every push;
# * the completion of a main CI run, which is when the new cache generation
#   has been saved (soldr#3342);
# * the completion of a merge-queue CI run, which sweeps here because a job in
#   the queue run itself would let a scheduling artifact decide that run's
#   conclusion (queue-cache-sweep below);
# * the six-hourly schedule and workflow_dispatch;
# * pull_request `closed` -- delete that PR's own entries immediately. This
#   is the one pull_request type a non-ci.yml workflow may declare
#   (check_pr_workflow_triggers.py): it only runs after the PR is closed, so
#   it can never become a required check on an open PR.

name: Cache Budget
# Versioned causal receipt for whole-event compute accounting. The Actions
# API exposes this title even when the default branch SHA advances mid-run.
run-name: ${{ github.event_name == 'workflow_run' && format('ci-cost-parent-v1={0}', github.event.workflow_run.id) || 'Cache Budget' }}

on:
  push:
    # Main pushes run ci.yml, which already calls ci-pre.yml first.
    branches-ignore:
      - main
  pull_request:
    types: [closed]
  # soldr#3342: main's CI saves its new run-ID-suffixed Tier-2 cache generation
  # *after* the janitor that ci.yml runs first, so the superseded generation
  # survived until the next scheduled sweep. Sweep again once that run is done.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'gh-readonly-queue/main/**']
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci-pre:
    name: CI Pre
    if: ${{ github.event_name != 'pull_request' && github.event.workflow_run.event != 'merge_group' }}
    uses: ./.github/workflows/ci-pre.yml
    permissions:
      contents: read
      actions: write
      pull-requests: read

  # GEN-022's end-of-queue sweep, one hop after the queue run instead of inside
  # it. A pending sweep can still be replaced by a newer request for the group,
  # but that only cancels this Cache Budget run, and the newer sweep does the
  # same work against newer state. workflow_run executes the default branch's
  # reviewed workflow and code, never the queue candidate's. Dispatch runs it
  # too, so the sweep can be exercised without waiting for queue traffic.
  queue-cache-sweep:
    name: End-of-queue cache sweep
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/ci.yml
          ref: 9d6875b9b33c3ea54aa70cfcce8fcb1a2668747e
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Evict down to the cache budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: python3 -m ci_lint cache janitor --repo .

  closed-pr-cleanup:
    name: Delete closed PR caches
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The PR's merge ref may be gone once it is closed; run the default
          # branch's reviewed script instead of the PR's.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check_cache_budget.py
            .github/scripts/cache_families.py
            ci.toml
            src/soldr/__init__.py
            src/soldr/_process.py
            ci/cache-ownership.json
          sparse-checkout-cone-mode: false
      # A fork PR's token is read-only: a refused delete is logged, the job
      # still exits 0, and the next push-triggered sweep deletes the entry.
      - name: Delete this PR's cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: python3 .github/scripts/check_cache_budget.py --delete-ref "$PR_REF"
