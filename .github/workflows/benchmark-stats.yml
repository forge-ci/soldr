name: Benchmark Stats

# Publish soldr's canary timings to the `benchmark-stats` branch + GitHub
# Pages after an active development day. Spec: issue #768. Inspired by
# zackees/zccache@benchmark-stats; keeps a slim history and Chart.js graphs.

on:
  workflow_dispatch:
  # soldr#1213 — nightly cron so an active day always produces at least one
  # benchmark run. The gate below inverts to schedule mode on this trigger:
  # runs only if there was at least one non-bot commit in the last 24h.
  # 3:17 UTC deliberately off-hour to avoid the top-of-hour thundering
  # herd (see the same nudge in .claude cron guidance).
  schedule:
    - cron: '17 3 * * *'

concurrency:
  # Only one publish at a time per ref; distinct active-day schedules retain
  # independent run IDs on main.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326 / #1328 / #1329 / #1330.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  # soldr#1203 + soldr#1213 — perf/benchmark workflows are expensive
  # (build + bench + publish, ~30-60 min). The gate reconciles two
  # concerns:
  #
  #   * schedule — nightly cron. Run when there WAS at least one
  #     non-bot commit in the last 24h (i.e. active day, something
  #     new to benchmark). Skip on quiet days.
  #   * workflow_dispatch — explicit human request, always run.
  #
  # Net: one benchmark per active day, zero on quiet days, and no
  # benchmark runner on an ordinary main push.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-24.04
    # soldr#1978 item 8 burn-down: a fetch-depth-250 checkout plus perf_gate.py
    # is a seconds-to-minutes job; 10 min is deep headroom, well under the
    # 360-min default this replaces.
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason:     ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # perf_gate.py walks up to 200 commits back. Fetch that much so
          # the check has data to work with. Well above the default
          # shallow depth of 1.
          fetch-depth: 250
      - name: Evaluate activity gate
        id: check
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "workflow_dispatch — bypassing gate; run unconditionally."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=bypass: workflow_dispatch" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            schedule)
              python3 .github/scripts/perf_gate.py --mode schedule --hours 24
              ;;
            push)
              python3 .github/scripts/perf_gate.py --mode push --hours 24
              ;;
            *)
              echo "Unknown event ${{ github.event_name }} — running to be safe."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=bypass: unknown event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

  benchmark:
    name: Generate + publish benchmark stats
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Single definition of "this run may publish". It was previously
      # spelled out on each of the three publish steps below while the
      # deploy-pages job used a DIFFERENT spelling that also allowed
      # `schedule` (added by soldr#1213/#1214). The steps were never
      # updated, so every nightly run did ~13 min of benchmark work, then
      # skipped all three publish steps, and deploy-pages still demanded
      # the `github-pages` artifact that was therefore never uploaded —
      # failing with "No artifacts named github-pages were found".
      #
      # Keep this in sync with deploy-pages.if; the duplication is what
      # caused the drift. On `schedule` the ref check is skipped because
      # scheduled workflows always run against the default branch.
      PUBLISH_PAGES: ${{ github.event_name == 'schedule' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          path: soldr

      # soldr#1340 — pre-cache the 1.98.1 toolchain in ~/.rustup so
      # setup-soldr uses it (Setup soldr build cache drops from ~22 s
      # to ~2-7 s on cache HIT). Same pattern as #1341/#1342/#1343/
      # #1345/#1346.
      - name: Cache rustup 1.98.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-1.98.1-linux-x64-v1

      - name: Install rustup 1.98.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@35b5765c99cf392c259e684daeda10a950f72fff
        env:
          ACTION_WORKSPACE: ${{ github.workspace }}/soldr
          # setup-soldr#629: optional S3 remote build cache (DO Spaces).
          SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
          SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          cook-delta: false
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          toolchain: 1.98.1
          cache: true
          zccache-seed-strict: true
          s3-bucket: forge-ci-cache
          s3-endpoint: sfo3.digitaloceanspaces.com

      # Benchmark Stats is a per-commit trend: measure the commit under
      # test, not setup-soldr's released default. Build from this job's
      # checkout (through the
      # released soldr wrapper installed above, so the build is
      # cache-accelerated) and prepend the result to PATH so every later
      # bench step resolves the current-commit binaries.
      - name: Build soldr from the commit under test
        working-directory: soldr
        run: |
          set -euo pipefail
          # Build the one soldr executable, then materialize the daemon
          # argv[0] alias used by the canaries.
          soldr cargo build --release -p soldr-cli --bin soldr
          BIN_DIR="$HOME/soldr-under-test/bin"
          mkdir -p "$BIN_DIR"
          cp target/release/soldr "$BIN_DIR/soldr"
          for bin in soldr-daemon; do
            ln "$BIN_DIR/soldr" "$BIN_DIR/$bin" 2>/dev/null || cp "$BIN_DIR/soldr" "$BIN_DIR/$bin"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/soldr" --version

      - name: Run canary benchmarks
        working-directory: soldr
        run: bash bench/run_canaries.sh

      # soldr#1166 — the previous "one big apt install" step spent ~15 min
      # here because Azure's Ubuntu mirror ran at ~62 kB/s and python3-
      # matplotlib pulled in scipy + numpy + blas + lapack + friends
      # (~55 MB of debs). Split into two steps: matplotlib/Pillow come
      # from PyPI wheels via uv (~30 s), sccache stays apt-pinned for
      # measurement-reproducibility per #785/#790.
      - name: Install pinned sccache (apt)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            sccache=0.7.7-2ubuntu0.1

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Install benchmark rendering deps (matplotlib + Pillow) via uv
        run: |
          set -euo pipefail
          # Ubuntu 24.04's system python is PEP 668 "externally managed";
          # --break-system-packages is required for --system installs.
          # sudo -E preserves PATH so sudo finds uv on the hostedtoolcache
          # (soldr#1170 — plain `uv pip install --system` hit a permission
          # error because /usr/local/lib/python3.12/dist-packages is
          # root-owned). Ephemeral runners are safe to modify system Python.
          sudo -E env "PATH=$PATH" uv pip install --system --break-system-packages matplotlib Pillow

      - name: Run comparison benchmarks
        working-directory: soldr
        env:
          COMPARISON_BUILD_TIMEOUT_SECONDS: "60"
        run: bash bench/run_comparison.sh

      - name: Assemble publish dir
        working-directory: soldr
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash bench/assemble_benchmark_stats.sh

      - name: Render benchmark-trend.png
        working-directory: soldr
        run: python3 bench/render_benchmark_trend.py

      - name: Render comparison bar JPGs
        working-directory: soldr
        run: python3 bench/render_comparison_bars.py

      - name: Publish to benchmark-stats branch
        if: ${{ success() && env.PUBLISH_PAGES == 'true' }}
        working-directory: soldr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
        run: bash bench/publish_benchmark_stats.sh

      - name: Configure Pages
        if: ${{ success() && env.PUBLISH_PAGES == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: ${{ success() && env.PUBLISH_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: soldr/benchmark-stats

      - name: Upload canary output as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-stats-${{ github.sha }}
          path: soldr/benchmark-stats
          if-no-files-found: warn
          retention-days: 14

  deploy-pages:
    name: Deploy benchmark page
    needs: benchmark
    # soldr#1213 — allow nightly schedule to deploy pages too. On
    # `schedule` GitHub does not populate `github.ref` from a branch push;
    # scheduled workflows always run against the default branch, so the
    # ref check still holds implicitly. Skip the branch-format check on
    # schedule to avoid a false negative.
    if: ${{ needs.benchmark.result == 'success' && (github.event_name == 'schedule' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    runs-on: ubuntu-24.04
    # soldr#1978 item 8 burn-down: a single actions/deploy-pages step; 15 min
    # covers a slow Pages deploy/queue with room to spare.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
