# soldr#1051 / #1038 / #2336: consolidated Linux cross-build for all 9 targets.
#
# One ubuntu-24.04 job per target triple that does the whole every-commit
# pipeline for that target in a single runner spin-up. Target dispatch
# table:
#
#   *-unknown-linux-gnu                 -> soldr build + catalogue-backed GCC
#   *-unknown-linux-musl                 -> cargo zigbuild
#   *-apple-darwin                       -> soldr build + target-shaped Apple SDK
#   *-pc-windows-msvc                    -> soldr build + blessed MSVC SDK
#                                             env (cargo-xwin fallback when
#                                             managed cache is unavailable)
#
# Output: the soldr binary (ci-nextest profile, NOT --release — soldr#1981)
# at target/<triple>/ci-nextest/soldr[.exe] + an
# optional cargo nextest archive at dist/<artifact_name>-tests.tar.zst.
# Both are uploaded as the named artifact for downstream
# _ci-target-run.yml consumption.

name: CI cross-build (linux host)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: Target triple to cross-build for.
      artifact_name:
        type: string
        required: true
        description: Name to use for the uploaded artifact.
      source_ref:
        type: string
        default: ""
        description: |
          Optional commit SHA to checkout. Defaults to the workflow's
          implicit ref via actions/checkout default behavior.
      bootstrap_artifact_name:
        type: string
        default: ""
        description: |
          Optional artifact containing the host x86_64-linux bootstrap
          soldr binary. Darwin/MSVC lanes prefer this over rebuilding
          or restoring their own per-lane bootstrap cache.
      upload_test_archive:
        type: boolean
        default: true
        description: |
          Whether to upload the packaged binary + nextest archive for a
          paired `_ci-target-run.yml` job to replay.

          Set false on a build-only lane (soldr#1978 item 3): with no
          consumer, the upload is a multi-hundred-MB `compression-level: 0`
          round-trip through the artifact store that is deleted unread.
          The archive is still *built* either way -- compiling the whole
          workspace's test binaries for the target is real coverage that
          catches target-incompatible test code, and it is the only such
          coverage on a lane with no replay.

permissions:
  contents: read

env:
  # zackees/ci.yml#6: every cache this workflow can save in PR context
  # carries `pr-<N>` in its key, so the ci-pre janitor can delete it once
  # the PR closes. Empty outside a pull request, so main keys are
  # unchanged. Enforced by .github/scripts/check_pr_cache_keys.py.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

jobs:
  cross-build:
    name: cross-build ${{ inputs.target }} (linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # zstd-sys' build.rs probes pkg-config; pkg-config-rs refuses
      # cross-compile probes by default. Setting this 1 lets the probe
      # run (and fall back to vendored compile if it fails). Required
      # after PR #1111 expanded the transitive *-sys dep tree.
      PKG_CONFIG_ALLOW_CROSS: "1"
      # soldr#1319 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
      # for authenticated GitHub Releases lookups (5,000/hr) instead of
      # unauthenticated (60/hr per runner IP). Without this a busy CI
      # window can push a lane into the `cargo install zccache` fallback
      # (~700 s of source compile) — observed in run 28731872479.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      # soldr#3138: the job-wide `CARGO_BUILD_JOBS: "1"` / `SOLDR_JOBS: "1"`
      # that used to live here has moved to the two true-bootstrap steps that
      # actually need it (the `RUSTC_WRAPPER: ""` steps below).
      #
      # The original reasoning (soldr#2453/#2781) was sound for its time: these
      # lanes disable every build-cache layer, so an all-miss Stage C can have
      # several memory-heavy rustc/clang children resident at once on a 4-vCPU
      # runner, and the published zccache crate is a single enormous
      # compilation unit. But these two variables size the *shared* ceiling
      # that Cargo's producer queue and the embedded zccache admission gate
      # both draw from, so pinning them at one serialized every small unit as
      # well -- roughly 560 s of wrapped compile work in this lane (catalogue
      # lifecycle 200 s, target clippy 185 s, nextest archive 115 s, cross-build
      # 60 s) running one child at a time.
      #
      # What replaced it: since zccache 1.13.11 the embedded service grants
      # amalgamation crates and measured heavy links *exclusive* admission
      # (`crates/soldr-daemon/src/amalgamation.rs`), so the one huge unit still
      # compiles alone while ordinary units run N-wide. That is strictly better
      # than a global cap -- it protects the same unit without serializing the
      # rest. The swap headroom below is the other half, and this workflow's
      # own history already recorded which of the two actually closed the
      # signal-kill: "Bounding CARGO_BUILD_JOBS/SOLDR_JOBS (above) narrowed but
      # did not close the signal-kill; the swap headroom is the safety valve
      # that does."
      #
      # Exclusive admission requires the wrapper. The two `RUSTC_WRAPPER: ""`
      # bootstrap steps below run with no zccache at all, so the gate cannot
      # engage there and they keep the cap explicitly.
      # Keep the developer-facing profile default responsive while reducing
      # LLVM worker fan-out for this memory-constrained CI-only build.
      CARGO_PROFILE_CI_NEXTEST_CODEGEN_UNITS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      # soldr#2453: give the all-miss cross-build room to spill transient
      # LLVM/LTO peaks instead of tripping the OOM killer. Bounding
      # CARGO_BUILD_JOBS/SOLDR_JOBS (above) narrowed but did not close the
      # signal-kill; the swap headroom is the safety valve that does.
      - name: Enlarge swap (OOM headroom)
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#2883: windows-gnu is the one target that cannot put debug info
      # anywhere except inside the executable.
      #
      #   $ rustc --print split-debuginfo --target x86_64-pc-windows-gnu
      #   off
      #   $ rustc --print split-debuginfo --target x86_64-pc-windows-msvc
      #   packed
      #
      # MSVC writes a `.pdb` sidecar, which the nextest archive does not
      # carry, so its target-run binaries ship with no debug info at all.
      # GNU has no sidecar to write, so `debug = "line-tables-only"` lands
      # DWARF in every PE. Measured on one CI run of the same commit:
      #
      #   msvc test archive   248,561,683 B     gnu   3,491,930,139 B  (14x)
      #   msvc per-test floor       0.020 s     gnu           0.421 s  (21x)
      #
      # Windows pays that size twice over -- the broker copies the daemon
      # image per route and the OS loads it per process -- which is what put
      # `daemon start` past its 60s route budget while the msvc lane ran the
      # same test in 20.6s.
      #
      # Dropping it here makes windows-gnu match what windows-msvc already
      # ships rather than being uniquely burdened. Every other target keeps
      # soldr#1168's line tables, and this override touches only this lane.
      - name: Keep DWARF out of windows-gnu images (soldr#2883)
        if: contains(inputs.target, 'pc-windows-gnu')
        shell: bash
        run: |
          echo "CARGO_PROFILE_CI_NEXTEST_DEBUG=false" >> "$GITHUB_ENV"

      # soldr#1698: use an empty job-local cache so Stage B/C's first Windows
      # invocation is provably cold and the forced repeat is provably warm.
      # This keeps the embedded zccache wrapper active; it is not a bypass.
      # The roundtrip probes below clean first-party outputs between calls and
      # require zccache to materialize the missing PE files from its own cache.
      - name: Isolate Windows cache roundtrip
        if: contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          echo "ZCCACHE_CACHE_DIR=$RUNNER_TEMP/soldr-windows-cross-zccache-${{ inputs.target }}" >> "$GITHUB_ENV"

      # soldr#1061 phase A: replaced the bare dtolnay/rust-toolchain
      # + Swatinem cargo-cache pair with setup-soldr's integrated
      # `prebuild-deps: soldr-cook` flow. setup-soldr handles:
      #   1. Rust toolchain install (1.98.1 per rust-toolchain.toml)
      #   2. cargo registry + target cache (actions/cache@v4 keyed on
      #      Cargo.lock + rustc + target)
      #   3. `soldr cook` hydration — restores prebuilt
      #      target/<triple>/release/build/*/out/ artifacts (the cc-rs
      #      outputs from zstd-sys, libsqlite3-sys, tikv-jemalloc-sys,
      #      ring, etc.) so cargo build doesn't recompile C source on
      #      every PR.
      # Without this, every cross-build lane spent 45-70s/lane on
      # cc-rs invocations that produced bit-identical outputs to
      # the previous PR. soldr#1061 gap analysis: ~2h/day of CI
      # wallclock burned across the 8-lane matrix.
      # soldr#1248/#2: setup-soldr's early cook remains disabled here.
      # The deferred setup-soldr/cook subaction runs below after each
      # lane's target-specific compiler/SDK setup and passes the real
      # target/profile shape.
      - name: Setup soldr build cache (Rust toolchain only)
        uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          toolchain: 1.98.1
          # soldr#2451: `cache: false` alone does NOT stop setup-soldr's
          # soldr-mini / solo-toolchain / build-cache layers (each is gated on
          # its own input, not the umbrella), so the failing lanes still logged
          # `Using cached soldr 0.8.29` + `setup-soldr-buildcache-v2` hits. This
          # repo IS soldr; its self-build lanes must never restore a cached
          # soldr binary. The `soldr build` driver here is the fresh HEAD
          # bootstrap (downloaded/rebuilt above), so setup-soldr only provisions
          # the Rust toolchain — turn every reuse layer off.
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          zccache-seed-strict: true

      # Every cross tool is resolved by soldr. The blessed MSVC/Darwin
      # paths fetch LLVM, SDKs, CMake, Ninja, and syslibs from the
      # soldr-toolchain catalogue. GNU targets use the catalogue-backed
      # GCC/binutils/glibc bundle; only musl retains the temporary managed
      # Zig + cargo-zigbuild fallback. cargo-xwin remains
      # an on-demand soldr-managed fallback, and `soldr cargo nextest`
      # fetches cargo-nextest when the archive step runs.

      # soldr#1172 + soldr#1174 + soldr#1248 — cache the MSVC CRT+SDK
      # directory shared by the blessed `soldr build` path and the
      # cargo-xwin fallback. On x86_64, `soldr build` now consumes the
      # prepared xwin-cache directly via clang/lld env instead of asking
      # cargo-xwin to re-download the CRT+SDK during Stage B.
      #
      # Cache key embeds MANAGED_XWIN_CACHE_VERSION (2026-06-22 today —
      # bump when crates/soldr-cli/src/fetch/xwin_cache.rs changes).
      - name: Restore MSVC CRT+SDK (via XWIN_CACHE_DIR)
        id: xwin_cache
        if: contains(inputs.target, 'pc-windows-msvc')
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/sdk/${{ inputs.target }}/xwin/2026-06-22
          key: soldr-xwin-cache-${{ inputs.target }}-v2026-06-22

      # soldr#1425 - cache the target-shaped Apple SDK v14.5 fetched by
      # blessed_build::prepare on darwin targets. Cache path + key both
      # include the catalogue version and shape so x86_64 and aarch64
      # lanes never reuse the wrong SDK slice.
      - name: Restore Apple SDK (x86_64)
        id: apple_sdk_x86_64_cache
        if: inputs.target == 'x86_64-apple-darwin'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/bin/apple-sdk/14.5/darwin-x86_64
          key: soldr-apple-sdk-14.5-darwin-x86_64-v1

      - name: Restore Apple SDK (aarch64)
        id: apple_sdk_aarch64_cache
        if: inputs.target == 'aarch64-apple-darwin'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/bin/apple-sdk/14.5/darwin-aarch64
          key: soldr-apple-sdk-14.5-darwin-aarch64-v1

      # soldr#3047 — removed the Swatinem/rust-cache step that used to live
      # here (`Restore cargo + target caches`, shared-key
      # cross-build-${{ inputs.target }}-v7). ci/cache-ownership.json already
      # declared Tier 1 `cook` the surviving implementation of the dependency-
      # graph cache, and this lane is the one soldr#2996 measured cook on
      # (387.7s -> 9.3s). Running both meant two implementations of one tier,
      # with the deprecated one carrying 23.79 GiB of a 10 GB repo cache
      # budget for no wall-time benefit cook doesn't already provide. The
      # surviving durable layer for this lane is the `Restore cooked
      # dependency cache` step below.
      #
      # The one thing rust-cache covered that cook does not: the
      # ~/.cargo/{registry,git} source tarballs, so the first `cargo fetch`
      # of a run is now cold. If that shows up in lane wall time, the
      # sanctioned fix is setup-soldr's `cargo-registry-cache` layer (tier
      # `pinned-immutable-download`), NOT reinstating rust-cache. It is
      # deliberately left `false` above for now because soldr#2451 turns
      # every setup-soldr reuse layer off in self-build lanes, and flipping
      # one of them back on is its own reviewed change.

      # Bootstrap soldr from the current checkout. Linux cross lanes need
      # the current front door's target-linker reconstruction and preflight;
      # Darwin/MSVC need its blessed SDK preparation. The version installed
      # by setup-soldr is intentionally only the bootstrap seed and may
      # predate behavior under test in this checkout.
      # soldr#1162 — cache the host-side bootstrap soldr.
      # Same story as #1160 / #1161 for baseline-zero-deps: three CI lanes
      # (apple-darwin x2 + windows-msvc x1) rebuild the identical host binaries
      # (~295 s each) with RUSTC_WRAPPER="", so there is no zccache to catch it.
      # When crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml are unchanged
      # a lane hits the cache and skips the 5-minute compile.
      # soldr#1248/#1604: main CI builds or restores this host bootstrap once
      # and fans it out to every cross lane. Manual callers that omit
      # `bootstrap_artifact_name` retain the older blessed-lane fallback.
      - name: Download shared bootstrap soldr artifact
        if: inputs.bootstrap_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.bootstrap_artifact_name }}
          path: ${{ runner.temp }}/soldr-bin

      - name: Restore cached bootstrap soldr binaries
        id: bootstrap_cache
        if: (contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')) && inputs.bootstrap_artifact_name == ''
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin
          # soldr#2451: key on the commit SHA, not hashFiles('crates/**', ...),
          # which excludes `_vender/**` submodules. This binary is the broker-
          # spawning `soldr build` driver; a submodule-only broker bump must
          # rebuild it. (Only used by manual callers that omit
          # bootstrap_artifact_name; main CI downloads the shared artifact,
          # whose producer job is fixed the same way.)
          key: bootstrap-soldr-blessed-linux-gnu${{ env.PR_CACHE_TAG }}-${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      - name: Bootstrap soldr for SDK / blessed-build prep
        if: (contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')) && inputs.bootstrap_artifact_name == '' && steps.bootstrap_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          # Keep the throwaway bootstrap uncached while still routing the
          # Rust toolchain through soldr.
          RUSTC_WRAPPER: ""
          # soldr#3138: with no wrapper there is no embedded service, so the
          # exclusive-admission gate that protects the amalgamated zccache
          # unit everywhere else cannot engage here. Per-crate
          # `codegen-units = 1` (see `[profile.ci-bootstrap.package.zccache]`,
          # whose comment states this same reason) plus this cap are the only
          # protection on this step. Scoped to the step rather than the job so
          # the wrapped compiles in this lane are not serialized with it.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          set -euo pipefail
          # soldr#1282 — --profile ci-bootstrap drops LTO + codegen-units=1
          # from the throwaway host-side soldr build. The shipped release
          # binary keeps profile.release; this only affects the bootstrap
          # binary that lives inside the same lane and is deleted at
          # post-step cleanup.
          soldr --no-cache cargo build --profile ci-bootstrap --package soldr-cli \
            --bin soldr \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/ci-bootstrap/soldr "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Expose bootstrap soldr on PATH
        if: inputs.bootstrap_artifact_name != '' || contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/soldr-bin/soldr" || chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          echo "$RUNNER_TEMP/soldr-bin" >> "$GITHUB_PATH"
          echo "SOLDR_BINARY=$RUNNER_TEMP/soldr-bin/soldr" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/soldr-bin/soldr" --version

      # Persistent Zig wrapper scripts are retained only for the legacy musl
      # targets. Darwin is intentionally
      # excluded: it goes through `soldr build` which handles SDK +
      # CC injection internally via blessed_build.rs. Setting
      # CC_<triple>=zig-wrapper on darwin overrode the clang-with-
      # -isysroot env that blessed_build.rs sets and broke
      # libmimalloc-sys' CommonCrypto include resolution.
      # Darwin used to need:
      #   - Prepare Apple SDK  (soldr prepare --github-env)
      #   - Inject SDKROOT into CFLAGS_<t>
      # Both are gone now. `soldr build` does the SDK fetch + sets
      # CC_<t>=clang + CFLAGS_<t>=-isysroot+--target+-fuse-ld=lld
      # internally via blessed_build::prepare. Workflow-level env
      # injection of the old zigbuild path would override those and
      # re-break the build.

      # For musl: suppress
      # rustc's self-contained crt files. Zig already supplies its own
      # crt1.o via `-target X`; without this, the linker sees BOTH and
      # fails with "duplicate symbol: _start". soldr#1068.
      # soldr#3008: cook compiles the dependency graph *for the target*
      # (`soldr cook --target <triple>`), so the target's std has to exist
      # before it runs. The cross-build below prepares the target itself, but
      # that is ~70 lines later -- cook is the one step that sees a toolchain
      # with only the host installed.
      #
      # The result was a hard failure that never went red: `soldr cook` died
      # with `error[E0463]: can't find crate for 'core'` inside
      # `chef::recipe::Recipe::cook`, the action logged "continuing without
      # cooked deps", and the post step logged "cook did not run successfully
      # - skipping save". So the repo's only cook-enabled lane wrote no cache
      # at all, which is why `gh cache list` shows zero cook entries against
      # 9.76 GiB of Swatinem/rust-cache (soldr#2996).
      #
      # The condition now covers every target that reaches cook, not just the
      # aarch64 MSVC case it was written for. This clause is the allowlist
      # used by the cook step's `cache:` input below and must stay in sync
      # with it. soldr#3121: both now name the same five targets explicitly.
      - name: Prepare blessed target env for cook
        if: >-
          inputs.target == 'aarch64-pc-windows-msvc'
          || inputs.target == 'x86_64-pc-windows-msvc'
          || inputs.target == 'x86_64-pc-windows-gnu'
          || inputs.target == 'x86_64-unknown-linux-gnu'
          || inputs.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          soldr prepare --target "${{ inputs.target }}" --github-env "$GITHUB_ENV"

      # Every target-run lane builds with ci-nextest so the archive step
      # reuses the same target profile instead of compiling a second tree.
      # Cook runs for the targets named in the allowlist below. It was an
      # exclusion list until soldr#2996, which meant a target got cook by
      # falling through rather than by decision.
      #
      # The evidence that disabled cook has been measured and does not hold.
      # The comment here used to cite run 32852360808 as "526 s restoring +
      # 478 s saving around a 278 s compile", and soldr#1248 as "~9-12 min"
      # for restore/save. All three numbers were artifacts of three separate
      # defects, now fixed:
      #
      #   * The 526 s "restore" restored ZERO bytes -- both keys missed and
      #     the action fell through to a cold `soldr cook`.
      #   * The 478 s "save" was 472.8 s of `zstd -9` over a 1.62 GB payload,
      #     because the post step archived the whole `target/` after the
      #     cross-build had written into it (zackees/setup-soldr#499). The
      #     `cook` save profile (soldr#3003) now scopes it.
      #   * `soldr cook` was crashing outright on the one enabled lane,
      #     silently, because it ran before the target's std was installed
      #     (soldr#3008).
      #
      # Measured on x86_64-pc-windows-gnu after all three fixes:
      #
      #   cold: cook 387.7 s, base archive 497.4 MiB
      #   warm: restore 10.4 s (6,614 files), cook 9.3 s, delta 22.2 MiB
      #
      # 378.4 s saved per run, for a 10.4 s restore, against a 635.0 MiB
      # Swatinem/rust-cache entry for the same lane. Cook is both smaller and
      # faster than the layer it replaces.
      #
      # x86_64-unknown-linux-gnu joins the allowlist here: it is the lane run
      # 32852360808 measured, so it is the one whose disabling rested most
      # directly on the disproven numbers.
      #
      # soldr#3121: aarch64-pc-windows-msvc, x86_64-pc-windows-msvc and
      # aarch64-unknown-linux-gnu join too. Measured cold at 810 s of compile
      # (386 s build + 230 s clippy + 194 s archive) against 301 s warm on
      # win-gnu -- the same shape as the original evidence above. x64 MSVC's
      # exclusion was a #1248-era leftover from when Swatinem/rust-cache made
      # it fast enough not to matter; that path was retired in soldr#3047.
      - name: Restore cooked dependency cache
        id: cook
        # soldr#2996: the cook layer's post step archives `target/` at job end,
        # by which point the cross-build and nextest-archive steps have written
        # into the same tree -- on run 32852360808 that turned an 83.0 MiB cook
        # slice into a 1.62 GB entry carrying linked test products, which
        # ci/cache-ownership.json classifies tier 3 (zackees/setup-soldr#499).
        #
        # `cook` is the save profile added for exactly this shape: it keeps the
        # dependency graph (deps/ libraries, .fingerprint/, and all of build/
        # including the extensionless build-script executables Cargo needs) and
        # drops what the build layered on top. It fixes the payload without
        # moving when the archive is written, so the action's caching contract
        # is untouched.
        #
        # Gated on the bootstrap artifact because that is what guarantees
        # SOLDR_BINARY points at the source-built soldr from this SHA -- the
        # one that has the profile. Without the artifact the cook step falls
        # back to the released soldr on PATH, which would reject the value; an
        # empty string is a valid spelling of `full`, so that path is unchanged.
        env:
          SOLDR_SAVE_PROFILE: ${{ inputs.bootstrap_artifact_name != '' && 'cook' || '' }}
        uses: zackees/setup-soldr/cook@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cache: ${{ (inputs.target == 'x86_64-pc-windows-gnu' || inputs.target == 'x86_64-unknown-linux-gnu' || inputs.target == 'aarch64-pc-windows-msvc' || inputs.target == 'x86_64-pc-windows-msvc' || inputs.target == 'aarch64-unknown-linux-gnu') && 'true' || 'false' }}
          # soldr#3019: fatal on `main`, a warning on pull requests.
          #
          # soldr#3013 made a cook that produced nothing visible; this is the
          # step that makes it actionable. The reason it is not simply on
          # everywhere is ci.yml:70-88, which records a 10-minute lint bound
          # cancelling 6 of 7 healthy runs and concludes "an always-red gate
          # teaches people to ignore it". Red-gating every contributor on a
          # transient cache failure would repeat that.
          #
          # `main` is where a persistent regression actually lives, and where
          # the cook entry every feature branch restores from is written -- a
          # silent failure there starves the whole repo, which is precisely
          # what soldr#3008 did for an unknown period. PRs keep the warning,
          # so a contributor sees the signal without being blocked by it.
          fail-on-error: ${{ github.ref_name == 'main' }}
          target-dir: target
          flags: --profile ci-nextest --target ${{ inputs.target }} --workspace

      # soldr#3008: cook failing is not a lane failure -- the action degrades
      # to "continuing without cooked deps" by design, so the build still
      # succeeds without the cache. That fallback is right, but it made cook
      # broken-and-silent: it crashed on every run of the only enabled lane
      # for an unknown period, and nothing said so. `gh cache list` showing
      # zero cook entries was the only symptom, and only when someone looked.
      #
      # Under soldr#2996's directive cook is the ONLY durable cache, so
      # "never saved" and "working" must stop looking identical. This reports;
      # it deliberately does not fail. Turning a silent degrade into a red
      # lane is a separate decision, and ci.yml:70-88 records what happens
      # when a gate is made red before it is made trustworthy.
      - name: Report cook outcome
        if: always()
        continue-on-error: true
        shell: bash
        env:
          COOK_RAN: ${{ steps.cook.outputs.ran }}
          COOK_HIT: ${{ steps.cook.outputs.cache-hit }}
          COOK_LAYER: ${{ steps.cook.outputs.save-layer }}
        run: |
          set -euo pipefail
          python3 .github/scripts/report_cook_outcome.py \
            --target '${{ inputs.target }}'

      - name: Clean cooked first-party stubs
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          profile="ci-nextest"
          git restore -- Cargo.toml Cargo.lock crates/soldr-cli/Cargo.toml
          # rust-cache intentionally omits executables but can restore their
          # Cargo fingerprints. Since the workspace split (#1490), cleaning
          # only soldr-cli can therefore leave a "fresh" internal-crate test
          # executable that is absent when nextest starts archiving. Rebuild
          # all first-party outputs while retaining cached dependencies.
          soldr cargo clean \
            -p soldr-cli \
            -p soldr-core \
            -p soldr-fetch \
            -p soldr-cache \
            -p soldr-daemon \
            --target "$target" --profile "$profile"

      # Stage A — lint intentionally NOT run here. `cargo fmt --check` and
      # `cargo clippy --workspace --all-targets` are both covered by the
      # required top-level Lint job in ci.yml, which is a stricter blocker
      # (Lint denies warnings via `-D warnings` where the old per-lane
      # clippy did not). Duplicating them per lane cost ~1-2 s of fmt +
      # ~90 s of clippy per lane for no additional safety. See soldr#1180
      # (fmt) + soldr#1164 (clippy).
      # `-p soldr-cli` scope filter documented in soldr#1066.
      # In the historical note above, "lint" means host-wide lint only;
      # the target-scoped lifecycle check remains intentionally enabled.

      # Host clippy is not duplicated here. It is covered by
      # the top-level `Lint` job in ci.yml (`soldr cargo clippy --workspace
      # --all-targets -- -D warnings` — a strict superset of what
      # this file used to run). Duplicating clippy on every cross-build
      # lane cost ~90 s × 6 lanes for no additional safety. soldr#1164.
      # The target-scoped lifecycle probe below is narrower and verifies
      # compiler/SDK preparation for this specific matrix target.

      # Stage B — soldr binary build (ci-nextest profile), tool dispatched per target.
      # Windows MSVC + Apple Darwin: `soldr build` (the blessed cross-
      # compile surface per CLAUDE.md "Two build paths" — handles
      # xwin-cache + clang shim + lld-link for win, and Apple SDK +
      # clang + lld for darwin, via blessed_build.rs). Darwin needs
      # `soldr build` after #1112: mimalloc joined the dep tree via
      # zccache, and libmimalloc-sys' build script #include's
      # `CommonCrypto/CommonCryptoError.h` which lives in the real
      # Apple SDK but NOT in zig's bundled minimal darwin sysroot.
      # `cargo zigbuild` fails to compile mimalloc; `soldr build`
      # exports SDKROOT + CC_<triple>=clang and finds the header.
      - name: Cross-build soldr (ci-nextest profile)
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          ci_profile="ci-nextest"
          # soldr#1248/#1524 — every target-run lane consumes a nextest
          # archive, so Stage C reuses this same target profile.
          soldr build --profile "$ci_profile" --target "$target" \
            --package soldr-cli --bin soldr
          suffix=""
          case "$target" in *-pc-windows-*) suffix=".exe" ;; esac
          binary="target/$target/$ci_profile/soldr$suffix"
          # Cargo normally places cross-target binaries under the
          # target-qualified profile directory.  Keep the producer strict,
          # but recover the alternate target-root layout used by older cargo
          # wrappers (and print the complete candidate list) so a valid
          # cross-built binary is not lost merely because the wrapper chose a
          # different target-root shape.
          if [[ ! -f "$binary" ]]; then
            echo "expected binary missing: $binary; searching target tree" >&2
            find target -type f \( -name "soldr" -o -name "soldr.exe" \) -print >&2 || true
            candidate=$(find target -type f \( \
              -path "*/$ci_profile/soldr$suffix" -o \
              -path "*/$ci_profile/deps/soldr$suffix" -o \
              -path "*/$ci_profile/deps/soldr" \
            \) -print -quit)
            if [[ -n "$candidate" ]]; then
              mkdir -p "$(dirname "$binary")"
              cp "$candidate" "$binary"
              echo "normalized binary layout: $candidate -> $binary"
            fi
          fi
          ls -la "$binary"
          file "$binary"
          if [[ "$target" == *-pc-windows-msvc ]]; then
            test "$(dd if="$binary" bs=1 count=2 2>/dev/null)" = "MZ"
          fi

      # soldr#2996: main CI already builds a ci-bootstrap soldr from this same
      # SHA in `e2e-cross-bootstrap-soldr`, fans it out as an artifact, and
      # exports SOLDR_BINARY pointing at it -- so rebuilding it here produced a
      # byte-equivalent binary at ~87 s per GNU lane. ci.yml:606-610 added that
      # fan-out precisely so a cache miss would not become several identical
      # ~5 minute compiles; both GNU lanes were reintroducing the cost they
      # were meant to avoid.
      #
      # Manual callers that omit `bootstrap_artifact_name` receive no artifact
      # and never reach the "Expose bootstrap soldr on PATH" step, so they
      # still build the proof driver locally.
      - name: Build current Soldr GNU proof driver
        if: contains(inputs.target, 'unknown-linux-gnu') && inputs.bootstrap_artifact_name == ''
        shell: bash
        env:
          RUSTC_WRAPPER: ""
          # soldr#3138: same reason as the bootstrap step above -- this one
          # additionally sets ZCCACHE_DISABLE=1, so there is definitively no
          # admission gate to rely on. Keep the cap here, not job-wide.
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          set -euo pipefail
          ZCCACHE_DISABLE=1 soldr cargo build --profile ci-bootstrap \
            --package soldr-cli --bin soldr --target x86_64-unknown-linux-gnu

      # soldr#2236: prove the GNU lifecycle with a separate consumer, not
      # only Soldr's own dependency graph.  The script prepares the target,
      # checks the plan/env for a catalogue root and no Zig, then builds a
      # temporary Rust + cc-rs C/C++ + CMake + pkg-config fixture and inspects
      # its ELF machine and GLIBC ceiling.
      - name: Prove catalogue GNU lifecycle without Zig
        if: contains(inputs.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          # The fanned-out bootstrap artifact is this SHA's ci-bootstrap soldr.
          # Manual callers without that artifact fall back to the copy the
          # step above builds in-tree.
          proof_driver="${SOLDR_BINARY:-target/x86_64-unknown-linux-gnu/ci-bootstrap/soldr}"
          test -x "$proof_driver"
          python3 .github/scripts/gnu_linux_toolchain_e2e.py \
            --soldr "$proof_driver" \
            --target '${{ inputs.target }}' \
            --repo "$GITHUB_WORKSPACE"

      # soldr#1060: a glibc-floor ratchet for the -gnu binaries, at PR time
      # rather than only during a release (#2080).
      #
      # These artifacts are the fallback for OLD distros, so the floor is the
      # whole point, and nothing on a PR looked at it -- which is how the
      # published binaries came to require GLIBC_2.39, excluding RHEL 9,
      # Debian 12 and Ubuntu 22.04.
      #
      # The ceiling here is 2.28, NOT the 2.39 auto-release.yml uses, because
      # this lane does better and the ratchet should hold it to that.
      #
      # The difference is the builder, not the profile. Per this file's own
      # header, `*-unknown-linux-gnu (aarch64 cross)` goes through
      # `cargo zigbuild`, and zig links against its bundled glibc headers
      # rather than the runner's -- landing on GLIBC_2.28 (measured in CI on
      # #2083). auto-release.yml builds the same target NATIVELY on
      # ubuntu-24.04-arm and inherits that runner's 2.39.
      #
      # So the floor is low exactly when zig links it, and that is the whole
      # mechanism -- there is no separate zig-free "blessed cross path" that
      # achieves this, as an earlier version of this comment claimed. Two
      # consequences for soldr#1060 item 3:
      #
      #   * x86_64-unknown-linux-gnu is built natively BOTH here and at
      #     release, so it sees no benefit from this lane's arrangement. It is
      #     also the most-downloaded Linux artifact.
      #   * 2.28 is zig's default for this target, not a target anyone chose.
      #     `cargo zigbuild --target <triple>.2.17` pins it explicitly and
      #     reaches 2.16.
      - name: Check glibc baseline of the gnu binary (soldr#1060 ratchet)
        if: contains(inputs.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_glibc_baseline.py \
            --max-glibc 2.17 \
            "target/${{ inputs.target }}/ci-nextest/soldr"

      # soldr#1060 item 3: `verify_glibc_baseline.py` above proves the
      # binary's *declared* symbol floor statically, via `readelf -V`. That
      # is necessary but not the RFC's actual acceptance bar -- "the -gnu
      # artifact launches on a glibc-2.17-era environment". This step is the
      # real thing: it runs the freshly built binary's `--version` inside
      # `quay.io/pypa/manylinux2014_x86_64` (CentOS 7 based, glibc 2.17 --
      # the same baseline `manylinux_2_17` names) and asserts it actually
      # starts. x86_64 only: it is the runner's native arch, so no emulation
      # is needed to execute the container; aarch64's glibc floor is proven
      # by the readelf check above and by the identical toolchain/sysroot
      # this lane's x86_64 leg already exercises end-to-end.
      - name: Prove the gnu binary launches on glibc 2.17 (soldr#1060 item 3)
        if: inputs.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/glibc_container_smoke.py \
            "target/${{ inputs.target }}/ci-nextest/soldr"

      # The macOS and Windows equivalents of the ratchet above. Both targets
      # are cross-built through this lane on every PR, so the drift they guard
      # against is catchable here rather than only during a release.
      #
      # Ceilings start at the values measured on published v0.8.29 and are
      # tightened to whatever these lanes actually achieve -- the glibc step
      # above turned out to reach 2.28 where the release reaches 2.39, and a
      # ratchet set above what a lane achieves does not bind. The macOS one is
      # per-arch as of soldr#2146 for exactly that reason: a single 11.0 ceiling
      # was above what x86_64 should achieve, so it never bound there.
      - name: Ratchet the macOS minimum version (soldr#1060)
        if: contains(inputs.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_macos_min_version.py \
            --target "${{ inputs.target }}" \
            "target/${{ inputs.target }}/ci-nextest/soldr"

      - name: Ratchet the Windows DLL imports (soldr#1060)
        if: contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_windows_imports.py \
            "target/${{ inputs.target }}/ci-nextest/soldr.exe"

      # The musl equivalent of the three ratchets above, and the gap they
      # left: `verify_static_link.py` ran only in auto-release.yml, so a musl
      # binary that silently picked up an interpreter or a NEEDED entry built
      # clean, printed a valid ELF from `file`, and was first caught at
      # release -- or by a user on a non-Alpine host getting
      # "No such file or directory" on exec.
      #
      # soldr#1978 item 3 made this the right place for it. x86_64-musl no
      # longer has a `target-run`, whose `soldr toolchain ensure` was the only
      # thing that implicitly proved the binary could exec at all. This check
      # is strictly stronger than that accident -- it asserts the static-link
      # invariant soldr#1060 actually cares about -- and being pure `readelf`
      # inspection it is arch-independent, so the aarch64-musl lane gets the
      # same PR-time guard rather than waiting for release.
      - name: Verify the musl binary is statically linked (soldr#1060)
        if: contains(inputs.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_static_link.py \
            "target/${{ inputs.target }}/ci-nextest/soldr"

      - name: Target clippy uses the blessed lifecycle
        shell: bash
        run: |
          soldr cargo clippy \
            --target '${{ inputs.target }}' \
            --package soldr-cli \
            --lib \
            --no-deps \
            \
            -- -D warnings

      - name: Validate warm Windows cache restoration (ci-nextest binary)
        if: contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          python3 .github/scripts/windows_msvc_cache_roundtrip.py \
            --phase build \
            --target '${{ inputs.target }}' \
            --profile ci-nextest

      # Stage C — test binary archive (consumed by _ci-target-run.yml).
      # Every archive routes through soldr. Darwin and Windows MSVC inherit
      # the blessed SDK + clang/lld env; Linux targets retain their
      # CARGO_TARGET_*_LINKER wrappers through the cargo front door.
      # soldr#3148 step 2: the archive used to be capped at jobs=1 by
      # `cross_build_resources.py` writing CARGO_BUILD_JOBS/SOLDR_JOBS into
      # $GITHUB_ENV. Measured on run 34774906903, that cap was only half
      # applied: the daemon had already resolved its limit when an earlier
      # step started it, so every archive logged "this build will use 3
      # concurrent compiles (from default), not the 1 you asked for (from
      # SOLDR_JOBS)" -- only Cargo's producer queue was serialized. The heavy
      # links it existed to protect are the consolidated integration-test
      # binaries, which get measured exclusive admission since soldr#3154,
      # and swap is enabled above. Unset both knobs, including setup-soldr's
      # inherited ones, as the Linux gate does; the job log's
      # `soldr: daemon compile concurrency =` line (soldr#3206) records the
      # limit that applied.
      - name: Build nextest archive
        shell: bash
        env:
          # `soldr cargo nextest archive` does not treat nextest's
          # `--cargo-profile` as Cargo's `--profile`, so keep this no-op
          # test-profile override to suppress soldr's default debug=false
          # warning on the darwin lanes. The actual archive profile is
          # ci-nextest below.
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          mkdir -p dist
          target='${{ inputs.target }}'
          archive="dist/${{ inputs.artifact_name }}-tests.tar.zst"
          ci_profile="ci-nextest"
          # soldr#1248 — Stage B already built target/<triple>/ci-nextest.
          # Keep the nextest archive on the same Cargo profile so stable
          # dependencies are reused instead of compiling a second
          # target/<triple>/debug tree just for target-run smoke tests.
          # ci-nextest preserves soldr#1168's line-table-only debug info
          # so archived-test failures still have file:line backtraces.
          # soldr#1703 established that coverage is never deleted; soldr#2931
          # bounds how it ships. The archive must preserve the complete test
          # inventory; target-native runners positively select the reviewed
          # host-sensitive subset and their replay partitions must cover every
          # selected test. Size regressions are handled by cutting
          # duplicate static links (test-target consolidation, soldr#2934) and
          # pruning image contents, NOT by compression/sharding alone: sharding
          # multiplies transport (every shard downloads the full archive), and
          # compression already failed to contain the 3.3 GB windows-gnu
          # payload that exhausted a hosted runner.
          soldr cargo nextest archive \
            --cargo-profile "$ci_profile" \
            --target "$target" \
            --workspace \
            --archive-file "$archive" \
            --archive-format tar-zst
          ls -la "$archive"

      # soldr#3121: this archive-phase probe costs ~127 s and exercises the
      # same soldr logic on both MSVC targets. aarch64 is the critical-path
      # lane, so it keeps only the cheaper binary-phase probe above; x64
      # keeps this one.
      - name: Validate warm Windows cache restoration (nextest archive)
        if: inputs.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          python3 .github/scripts/windows_msvc_cache_roundtrip.py \
            --phase archive \
            --target '${{ inputs.target }}' \
            --profile ci-nextest \
            --archive 'dist/${{ inputs.artifact_name }}-tests.tar.zst'

      # Stage C also packages the native runner's cargo-nextest. The Linux
      # producer must never execute this target binary; it only verifies the
      # catalogued digest and archive shape. Target-run invokes this exact
      # file directly, so it cannot fall back to live release/crates.io lookup.
      - name: Fetch verified target-native cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          version=$(sed -n 's/.*CARGO_NEXTEST_PINNED_VERSION: &str = "\(.*\)";/\1/p' \
            crates/soldr-fetch/src/fetch/known_tools.rs | head -n1)
          test -n "$version"
          python3 .github/scripts/fetch_catalogued_nextest.py \
            --target "$target" \
            --version "$version" \
            --output-dir dist/package/tools
          test -s dist/package/tools/cargo-nextest.json

      # Stage D — stage + upload artifact bundle
      # zackees/ci.yml#6: the SDKs are immutable downloads shared with main;
      # a PR restores main's entries above but never saves its own copies.
      - name: Save MSVC CRT+SDK (via XWIN_CACHE_DIR)
        if: contains(inputs.target, 'pc-windows-msvc') && github.event_name != 'pull_request' && steps.xwin_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/sdk/${{ inputs.target }}/xwin/2026-06-22
          key: soldr-xwin-cache-${{ inputs.target }}-v2026-06-22

      - name: Save Apple SDK (x86_64)
        if: inputs.target == 'x86_64-apple-darwin' && github.event_name != 'pull_request' && steps.apple_sdk_x86_64_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/bin/apple-sdk/14.5/darwin-x86_64
          key: soldr-apple-sdk-14.5-darwin-x86_64-v1

      - name: Save Apple SDK (aarch64)
        if: inputs.target == 'aarch64-apple-darwin' && github.event_name != 'pull_request' && steps.apple_sdk_aarch64_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/bin/apple-sdk/14.5/darwin-aarch64
          key: soldr-apple-sdk-14.5-darwin-aarch64-v1

      - name: Stage artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          ci_profile="ci-nextest"
          suffix=""
          case "$target" in *-pc-windows-*) suffix=".exe" ;; esac
          mkdir -p dist/package
          cp "target/$target/$ci_profile/soldr$suffix" "dist/package/soldr$suffix"
          # soldr#3539: soldr-daemon is byte-identical to soldr; the target
          # run derives it locally instead of uploading 130-160 MB again.
          chmod +x "dist/package/soldr$suffix" 2>/dev/null || true
          # Fixtures go alongside the binary so the target-run job can
          # set SOLDR_TEST_FIXTURES_DIR via the helper from #1040.
          if [ -d crates/soldr-cli/tests/fixtures ]; then
            cp -R crates/soldr-cli/tests/fixtures dist/package/fixtures
          fi
          ls -la dist/

      - name: Upload artifact
        if: inputs.upload_test_archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            dist/package/
            dist/${{ inputs.artifact_name }}-tests.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # soldr#1799 — surface build XML logs + JSONL compile journals so
      # toolchain-home leakage and warm-run recompile storms are
      # diagnosable. Indexed in the console, downloadable as an artifact:
      # printing the contents buried real failures under megabytes of
      # compile-journal scrollback (soldr#2493 follow-up).
      - name: Index build logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 .github/scripts/index_build_logs.py \
            --root "$HOME/.soldr" \
            --root "$HOME/.soldr-dev" \
            --root "$RUNNER_TEMP" \
            --artifact-name "build-logs-cross-${{ inputs.artifact_name }}"

      - name: Upload build log artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs-cross-${{ inputs.artifact_name }}
          if-no-files-found: ignore
          # Keep in sync with `.github/scripts/index_build_logs.py`. The
          # non-`logs/` entries carry the archived compile journals and the
          # broker/daemon spawn + bringup logs.
          # soldr#3152: `cache/soldr-daemon/logs/` carries the daemon's
          # shadow-mode `admission-estimate.jsonl`, which
          # `.github/scripts/fit_memory_estimate.py` joins to the compile
          # journals in this same artifact.
          path: |
            ~/.soldr/logs/
            ~/.soldr-dev/logs/
            ~/.soldr/cache/zccache/logs/
            ~/.soldr-dev/cache/zccache/logs/
            ~/.soldr/cache/zccache/history/**/*.json
            ~/.soldr/cache/zccache/history/**/*.jsonl
            ~/.soldr-dev/cache/zccache/history/**/*.json
            ~/.soldr-dev/cache/zccache/history/**/*.jsonl
            ~/.soldr/*-spawn.log
            ~/.soldr-dev/*-spawn.log
            ~/.soldr/broker/*.log
            ~/.soldr-dev/broker/*.log
            ~/.soldr/broker/*.jsonl
            ~/.soldr-dev/broker/*.jsonl
            ~/.soldr/cache/soldr-daemon/logs/
            ~/.soldr-dev/cache/soldr-daemon/logs/
            ${{ runner.temp }}/soldr-windows-cross-zccache-${{ inputs.target }}/logs/
