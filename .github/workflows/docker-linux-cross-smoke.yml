name: Windows Docker Linux cross smoke

on:
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  smoke:
    # GitHub-hosted Windows runners have only the Windows-container engine.
    # This HIL lane needs Docker Desktop configured for Linux containers.
    runs-on: [self-hosted, Windows, docker-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - name: Install published Soldr bootstrapper
        shell: pwsh
        run: python -m pip install soldr
      - name: Select Linux Docker containers
        shell: pwsh
        run: python .github/scripts/ensure_linux_docker.py --timeout-seconds 120
      - name: Build soldr from this checkout
        shell: pwsh
        run: soldr cargo build -p soldr-cli --bin soldr --target x86_64-pc-windows-msvc
      - name: Build C/C++ fixture through Docker Linux
        shell: pwsh
        run: >-
          python .github/scripts/docker_linux_cross_smoke.py
          --soldr target/x86_64-pc-windows-msvc/debug/soldr.exe
          --fixture ci/fixtures/docker-cross-c
          --summary $env:GITHUB_STEP_SUMMARY
