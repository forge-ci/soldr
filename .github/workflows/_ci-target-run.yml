# soldr#1042 / #1038 phase 4: target run-only job.
#
# Companion to `_ci-cross-build-linux.yml`. Downloads the artifact produced by
# the Linux cross-builder, provisions the pinned repository toolchain through
# the target-native soldr binary, and runs the positively owned host-sensitive
# subset of the pre-built test archive. The complete archive remains available
# to the ownership guard so a stale selector fails instead of dropping native
# coverage silently. The checkout supplies source-tree context while SOLDR_BIN
# and SOLDR_TEST_FIXTURES_DIR point tests at target-native packaged artifacts.

name: CI target run (download + nextest run)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: Target triple used to identify the worker and diagnostics.
      runs_on:
        type: string
        required: true
        description: GitHub Actions runner label.
      artifact_name:
        type: string
        required: true
        description: Name of the artifact produced by _ci-cross-build-linux.yml.
      source_ref:
        type: string
        required: false
        default: ""
        description: Exact source commit SHA of the cross-build archive.
      run_pep517_smoke:
        type: boolean
        required: false
        default: false
        description: >-
          After the archive replay, build the native soldr wheel and run the
          downstream PEP 517 daemon smoke on this same runner. soldr#2615:
          reuses the one macOS allocation instead of allocating a second VM of
          the identical image for the standalone smoke job.
      extended_replay:
        type: boolean
        required: false
        default: false
        description: >-
          Give a slow native archive replay a 55-minute job budget instead of
          the 30-minute default. The PEP 517 smoke keeps its larger combined
          budget below.
      assert_native_gnu_prepare:
        type: boolean
        required: false
        default: false
        description: >-
          soldr#2874: run the target's own lifecycle preparation on this
          native runner and execute whatever compiler it selects. Only
          meaningful when the runner's architecture matches the target --
          the bug it guards is a bundle chosen by target shape and run on a
          host of a different shape.
      target_execution:
        type: string
        required: false
        default: native
        description: >-
          Execution contract for packaged target tools: native, x86_64-rosetta,
          or x86_64-recovery (soldr#3076: a zackees/docker-mac-x64 Recovery
          guest hosted on an ubuntu-24.04 runner). Hosted macOS runners are
          reserved for explicit ci-test/ci-full and release validation.
          x86_64-recovery
          skips the general nextest archive replay steps below (they assume
          per-command exec and a pre-provisioned toolchain; Recovery boots
          fresh per script and provisions its own toolchain from scratch) and
          instead replays the same positively-owned partition inside one
          guest script via ci/macos_recovery_run.py (soldr#3078); see the
          dedicated step group near the end of this job.
      require_wasm32_wasip1_threads_materialization:
        type: boolean
        required: false
        default: false
        description: >-
          Provision wasm32-wasip1-threads through the packaged Soldr binary
          and make the #2919 managed materialization regression fail if it is
          unavailable. Native Linux and Windows archive replays opt in;
          ordinary local runs may safely skip without mutating rustup state.
      replay_partitions:
        type: string
        required: false
        default: '[{"label":"all","value":"hash:1/1","run_followup":true}]'
        description: >-
          JSON matrix of nextest partition labels and values. Multiple shards
          run on fresh workers so fixture-local caches stay disk-bounded while
          the union still replays the complete archive.

permissions:
  contents: read

jobs:
  target-run:
    name: target-run ${{ inputs.target }} (${{ matrix.replay.label }})
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        replay: ${{ fromJSON(inputs.replay_partitions) }}
    # The PEP 517 smoke adds native wheel compilation plus 3m/15m inner smoke
    # limits on top of its replay budget (soldr#2615). A target may request a
    # larger bounded replay budget when native archive execution proves
    # slower. x86_64-recovery now replays the same owned nextest partition
    # every other target-run lane replays, just packed into one guest script
    # (soldr#3078): Recovery boot+drive (README.md of zackees/docker-mac-x64:
    # ~6 min with one retry, ~10 min worst case) plus toolchain provisioning
    # plus the archive replay itself, bounded by the action's own
    # run-timeout (3600s) below. 90 gives that headroom on top of the job's
    # own setup/teardown steps.
    timeout-minutes: ${{ inputs.target_execution == 'x86_64-recovery' && 90 || inputs.run_pep517_smoke && 65 || inputs.extended_replay && 55 || 30 }}
    env:
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      # The extracted full-suite archive legitimately leaves hosted Windows
      # below Soldr's 5 GiB workstation floor (soldr#2699). Equal 1 GiB
      # warn/block thresholds retain the emergency backstop without entering
      # the warn-tier auto-prune path during normal archive replay.
      SOLDR_TARGET_WARN_FREE_GB: "1"
      SOLDR_TARGET_BLOCK_FREE_GB: "1"
      # Archive tests deliberately isolate SOLDR_CACHE_DIR. Reusing the
      # runner-provided CMake/Ninja avoids downloading identical managed host
      # tools into hundreds of fixture roots (soldr#2704). Dedicated managed-
      # tooling tests remove this escape hatch before asserting injection.
      SOLDR_USE_SYSTEM_CMAKE: "1"
      SOLDR_REQUIRE_WASM32_WASIP1_THREADS_MATERIALIZATION: ${{ inputs.require_wasm32_wasip1_threads_materialization && '1' || '0' }}
      REPLAY_PARTITION: ${{ matrix.replay.value }}
      REPLAY_PARTITION_LABEL: ${{ matrix.replay.label }}
    steps:
      # Nextest archive replay needs the workspace manifest. Several contract
      # tests also inspect vendored sources, so preserve complete source context.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify archive source checkout
        if: inputs.source_ref != ''
        shell: bash
        env:
          EXPECTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REF"

      - name: Set up diagnostics interpreter
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download cross-build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact

      - name: List artifact contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifact/ || true
          # soldr#2883: sizes, not just names. Image size is what put the
          # windows-gnu lane past its route-start budget -- the broker copies
          # the daemon image per route and the OS loads it per process -- and
          # the old listing printed paths only, so the one number that
          # explained the lane was invisible in its own log.
          find artifact/ -maxdepth 3 -type f -printf '%10s  %p\n' 2>/dev/null \
            | sort -rn | head -30 \
            || find artifact/ -maxdepth 3 -type f | head -30 \
            || true

      # Artifact download uses zip and strips executable bits on POSIX workers.
      - name: Restore executable bit on artifact binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for bin in artifact/package/soldr artifact/package/tools/cargo-nextest; do
            if [ -f "$bin" ]; then
              chmod +x "$bin"
              echo "chmod +x $bin"
            fi
          done

      # x86_64-rosetta is the only remaining non-native mode this preflight
      # covers: it confirms `arch -x86_64` actually works on this host before
      # anything downstream depends on it. x86_64-recovery has no comparable
      # host-side preflight -- the guest does not exist until the
      # zackees/docker-mac-x64 action step below boots it -- so it is
      # excluded here and handled entirely by its own step group.
      - name: Require declared target execution
        if: ${{ inputs.target_execution != 'native' && inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' --preflight; then
            if [ '${{ inputs.target_execution }}' = x86_64-rosetta ]; then
              echo "x86_64 archive replay requires Rosetta on this macos-15 ARM runner." >&2
              echo "host architecture: $(uname -m)" >&2
              sysctl -n sysctl.proc_translated 2>/dev/null || true
            else
              echo "target execution preflight failed for '${{ inputs.target_execution }}'" >&2
            fi
            exit 1
          fi
          echo "Preflight passed: packaged target commands will execute under '${{ inputs.target_execution }}'"

      - name: Resolve packaged target tools
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          case '${{ inputs.target }}' in *-pc-windows-*) suffix=".exe" ;; esac
          soldr_bin="$GITHUB_WORKSPACE/artifact/package/soldr$suffix"
          daemon_bin="$GITHUB_WORKSPACE/artifact/package/soldr-daemon$suffix"
          nextest_bin="$GITHUB_WORKSPACE/artifact/package/tools/cargo-nextest$suffix"
          fixtures="$GITHUB_WORKSPACE/artifact/package/fixtures"
          test -f "$soldr_bin"
          # soldr#3539: the artifact ships soldr once; soldr-daemon is the
          # same bytes under the multicall name, derived here.
          cp "$soldr_bin" "$daemon_bin"
          test -f "$nextest_bin"
          test -d "$fixtures"
          {
            echo "SOLDR_BIN=$soldr_bin"
            echo "SOLDR_INTERNAL_DAEMON_EXE=$daemon_bin"
            echo "NEXTEST_BIN=$nextest_bin"
            echo "SOLDR_TEST_WORKSPACE_ROOT=$GITHUB_WORKSPACE"
            echo "SOLDR_TEST_FIXTURES_DIR=$fixtures"
            echo "TOOLCHAIN_ENSURE_JSON=$RUNNER_TEMP/soldr-toolchain-ensure.json"
            echo "TOOLCHAIN_LINK_JSON=$RUNNER_TEMP/soldr-toolchain-link.json"
            echo "TOOLCHAIN_SHIM_DIR=$RUNNER_TEMP/soldr-toolchain-shims"
            echo "NEXTEST_ALL_LIST_JSON=$RUNNER_TEMP/nextest-all-list.json"
            echo "NEXTEST_LIST_JSON=$RUNNER_TEMP/nextest-list.json"
            echo "TARGET_RUN_FILTER_FILE=$RUNNER_TEMP/target-run-filter.txt"
            echo "TARGET_RUN_SUMMARY=$RUNNER_TEMP/target-run-summary.json"
          } >> "$GITHUB_ENV"
          python .github/scripts/target_run_summary.py \
            --target '${{ inputs.target }}' \
            --output "$RUNNER_TEMP/target-run-summary.json"

      - name: Provision pinned Rust toolchain through soldr
        if: ${{ inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" toolchain ensure --json > "$TOOLCHAIN_ENSURE_JSON"
          ensure_status=$?
          set -e
          if [ "$ensure_status" -ne 0 ]; then
            cat "$TOOLCHAIN_ENSURE_JSON" || true
            echo "soldr toolchain ensure failed with status $ensure_status" >&2
            exit "$ensure_status"
          fi
          set +e
          python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" toolchain link \
            --shim-dir "$TOOLCHAIN_SHIM_DIR" \
            --json > "$TOOLCHAIN_LINK_JSON"
          link_status=$?
          set -e
          if [ "$link_status" -ne 0 ]; then
            cat "$TOOLCHAIN_LINK_JSON" || true
            echo "soldr toolchain link failed with status $link_status" >&2
            exit "$link_status"
          fi
          cargo_bin=$(python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" rustup which cargo)
          rustc_bin=$(python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" rustup which rustc)
          test -f "$cargo_bin"
          test -f "$rustc_bin"
          # soldr#2879: also export the CHANNEL, not just the two absolute
          # paths.
          #
          # `CARGO`/`RUSTC` pin what this job runs directly. They do not pin
          # what the soldr children spawned by fixtures resolve: those walk
          # ancestors for a `rust-toolchain.toml`, find none under the OS temp
          # dir, and fall back to whatever `rustup` calls default -- the
          # image's `stable`. The whole test tree sets `SOLDR_ALLOW_UNPINNED`
          # (soldr#1766) so nothing complains about it.
          #
          # That is how three darwin tests came to strip with `stable`'s
          # `rust-objcopy`, whose `@rpath/libLLVM.dylib` is absent on the
          # image, while this job had installed and verified 1.98.1.
          # `probe_direct_toolchain_binary` bails out when RUSTUP_TOOLCHAIN is
          # set, so exporting it routes every child through rustup on the
          # channel this job actually provisioned.
          channel=$(python .github/scripts/toolchain_ensure_channel.py "$TOOLCHAIN_ENSURE_JSON")
          test -n "$channel"
          # soldr#3195: and the HOME the channel was provisioned into. Fixtures
          # that isolate HOME otherwise send rustup to an empty temp home, where
          # it silently reinstalled the toolchain inside each test.
          rustup_home=$(python .github/scripts/rustup_home_from_toolchain_binary.py "$cargo_bin")
          test -n "$rustup_home"
          {
            echo "CARGO=$cargo_bin"
            echo "RUSTC=$rustc_bin"
            echo "RUSTUP_TOOLCHAIN=$channel"
            echo "RUSTUP_HOME=$rustup_home"
          } >> "$GITHUB_ENV"

      # soldr#2919: this is deliberately lane-local rather than a global
      # rust-toolchain.toml target. The source-only Wasm regression compiles
      # under the native packaged Soldr while replaying this complete archive,
      # so its standard library must be installed in the exact channel the
      # preceding `toolchain ensure` just verified. Keep the command in a
      # tested helper: workflow YAML only provides orchestration.
      - name: Provision Wasm target for materialization regression (soldr#2919)
        if: ${{ inputs.require_wasm32_wasip1_threads_materialization }}
        shell: bash
        run: >-
          python .github/scripts/target_run_add_target.py
          --soldr "$SOLDR_BIN"
          --channel "$RUSTUP_TOOLCHAIN"
          --target wasm32-wasip1-threads

      - name: Verify pinned Rust toolchain
        if: ${{ inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          compiler_version=$(python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" rustc -vV)
          package_manager_version=$(python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$SOLDR_BIN" cargo -V)
          test -n "$compiler_version"
          test -n "$package_manager_version"
          {
            echo "### Target-run toolchain"
            echo
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Compiler: \`$(printf '%s\n' "$compiler_version" | sed -n '1p')\`"
            echo "- Package manager: \`$package_manager_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # soldr#3344: native Apple Silicon replay runs nested Cargo fixtures.
      # Run 35912103617 found that this host's pinned rust-objcopy existed but
      # aborted because its matching libLLVM.dylib was absent. llvm-tools-preview
      # supplies that runtime. Verify the executable now so the expensive test
      # replay cannot fail several minutes later with an opaque strip warning.
      - name: Provision native ARM rust-objcopy runtime
        if: ${{ inputs.target == 'aarch64-apple-darwin' && inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: >-
          python .github/scripts/provision_macos_objcopy.py
          --soldr "$SOLDR_BIN" --channel "$RUSTUP_TOOLCHAIN" --rustc "$RUSTC"

      # soldr#2933 (phase 1 of soldr#2931): name the volume, before anything
      # writes to it.
      #
      # Run 33065541438 killed `target-run x86_64-pc-windows-gnu (1-of-3)`
      # with a raw `os error 112`. The lane did not run out of disk; it ran
      # out of the *wrong* disk. `cargo-nextest` decompressed the 3.3 GiB
      # archive into `C:\Users\runneradmin\AppData\Local\Temp\nextest-archive-*`
      # because nothing had ever told it where to put it, `C:` began the job
      # with 31.03 GiB free, and `D:` sat at 143.61 GiB free from the first
      # step to the last without being touched once.
      #
      # This step makes the choice explicit and states it in the log: probe
      # every volume, take the roomiest writable one, create the extraction
      # root there, and export it. `--redirect-temp` moves TMP/TEMP/TMPDIR
      # onto the same volume when they are not already there, because the
      # isolated-home tests build their sandboxes in temp (soldr#2734) and
      # that is the allocation that actually exhausted C:.
      #
      # POSIX runners are unaffected in substance -- their candidates all
      # resolve to one volume, so the "largest" volume is the one they were
      # already using and the temp redirect is skipped -- but they still get
      # the path printed rather than inferred.
      - name: Select the archive extraction volume (soldr#2933)
        if: ${{ inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: >-
          python .github/scripts/select_extract_volume.py
          --workspace "$GITHUB_WORKSPACE"
          --runner-temp "$RUNNER_TEMP"
          --name "nextest-archive-${{ matrix.replay.label }}"
          --redirect-temp
          --github-env "$GITHUB_ENV"

      # soldr#2734: the only reading of runner disk anywhere in this lane.
      # soldr#2699 pinned the warn/block thresholds together at 1 GiB so the
      # watchdog never prunes mid-run, which also means soldr says nothing
      # until the disk is effectively gone -- a shard exhausted it and three
      # tests died on a raw `os error 112` with no clue where it went.
      #
      # Runs after the volume selection above so the temp reading reflects the
      # volume the shard will actually use, not the one it was handed.
      - name: Report free disk space (before)
        if: always()
        shell: bash
        run: python .github/scripts/report_free_space.py --label before

      # soldr#2874: the lane that would have caught the bug.
      #
      # This job already runs on a runner native to the target, and the
      # cross-build lane that feeds it runs on x86_64 -- so nothing anywhere
      # ran the target's own *preparation* on a native ARM64 host. Preparation
      # succeeded there; it just chose an x86_64 compiler, and the failure
      # surfaced hundreds of megabytes later inside a `-sys` crate as
      # `Exec format error (os error 8)`.
      #
      # Before the replay, so a wrong toolchain decision is reported as
      # itself rather than as a pile of unrelated test failures.
      - name: Native GNU preparation selects an executable compiler (soldr#2874)
        if: ${{ inputs.assert_native_gnu_prepare }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/assert_native_gnu_prepare.py \
            --soldr "$SOLDR_BIN" \
            --target '${{ inputs.target }}'

      # soldr#3076/#3078: x86_64-recovery skips this multi-step form of the
      # replay entirely -- Recovery boots fresh per script with no per-command
      # exec, so it replays the same owned partition packed into one guest
      # script instead. See the dedicated "macOS Recovery guest replay" step
      # group below.
      - name: Run owned pre-built native tests
        if: ${{ inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOLDR_BIN"
          test -f "$NEXTEST_BIN"
          echo "SOLDR_BIN=$SOLDR_BIN"
          echo "SOLDR_TEST_FIXTURES_DIR=$SOLDR_TEST_FIXTURES_DIR"

          metadata="${NEXTEST_BIN%/*}/cargo-nextest.json"
          test -f "$metadata"
          expected_version=$(jq -r '.version' "$metadata" | sed 's/^v//')
          actual_version=$(python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$NEXTEST_BIN" nextest --version \
            | sed -n 's/.* \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' \
            | head -n1)
          test -n "$actual_version"
          test "$actual_version" = "$expected_version" || {
            echo "cargo-nextest version mismatch: expected=$expected_version actual=$actual_version" >&2
            exit 1
          }
          echo "cargo-nextest version=$actual_version metadata=$metadata network=not-used"

          archive="artifact/${{ inputs.artifact_name }}-tests.tar.zst"
          test -f "$archive"

          # soldr#2933: fail on the disk, at the disk. `report_free_space.py`
          # is deliberately incapable of failing (soldr#2734), which is why
          # run 33065541438's exhaustion surfaced as three unrelated-looking
          # test failures carrying `Os { code: 112, kind: StorageFull }`
          # instead of as itself. This guard states a floor and refuses to
          # start below it, naming the path, the volume, the free bytes and
          # the archive size. The floor tracks the archive (4x compressed)
          # because debug test binaries decompress several times over, so a
          # constant would silently stop being enough as the archive grows.
          #
          python .github/scripts/assert_free_space.py \
            --label pre-extract \
            --path "$NEXTEST_EXTRACT_DIR" \
            --archive "$archive" \
            --archive-multiple 4 \
            --min-free-gib 20

          # soldr#2933: this is the *only* extraction in the shard.
          #
          # `--archive-file` decompresses the whole archive into a fresh
          # directory on every invocation, and this step used it twice -- once
          # to list, once to run -- so a 3.3 GiB archive was inflated twice per
          # shard across three shards. `--extract-to` names a destination on
          # the volume chosen above and leaves it in place afterwards, so the
          # inventory pass doubles as the extraction and the execution pass
          # below consumes what it produced. This first inventory is complete:
          # ownership is validated before partitioning so every declaration
          # must match somewhere in the archive, including on sharded lanes.
          python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$NEXTEST_BIN" nextest list \
            --archive-file "$archive" \
            --extract-to "$NEXTEST_EXTRACT_DIR" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile target-run \
            --message-format json-pretty > "$NEXTEST_ALL_LIST_JSON"

          # The reading that the original failure needed and did not have:
          # what the extraction actually cost, measured immediately after it
          # landed and before a single test starts allocating.
          python .github/scripts/assert_free_space.py \
            --label post-extract \
            --path "$NEXTEST_EXTRACT_DIR" \
            --min-free-gib 10

          # soldr#2999: native tests opt in through a reviewed declaration.
          # The helper also checks every owner against the complete inventory
          # and scans source for unowned host-sensitive integration modules.
          python .github/scripts/target_run_ownership.py \
            --manifest ci/target-run-ownership.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --list-json "$NEXTEST_ALL_LIST_JSON" \
            --target '${{ inputs.target }}' \
            --filter-output "$TARGET_RUN_FILTER_FILE" \
            --github-summary "$GITHUB_STEP_SUMMARY"
          IFS= read -r TARGET_RUN_FILTER < "$TARGET_RUN_FILTER_FILE"
          test -n "$TARGET_RUN_FILTER" || {
            echo "target-run ownership emitted an empty filter" >&2
            exit 1
          }

          # soldr#2933: the execution pass consumes the extraction instead of
          # decompressing the archive a second time. The helper emits nextest's
          # documented reuse-build flags (`--binaries-metadata`,
          # `--cargo-metadata`, `--target-dir-remap`) when it finds the
          # metadata inside the extraction, and otherwise falls back to
          # `--archive-file` + `--extract-to` + `--extract-overwrite` aimed at
          # the same directory -- degraded to one re-extraction, but still on
          # the volume that was chosen on purpose. One argument per line so
          # values with spaces need no quoting convention; a `while read`
          # loop rather than `mapfile` because macOS runners ship bash 3.2.
          reuse_args=()
          # Strip a trailing CR defensively. `read` removes the \n and leaves
          # the \r, so one CRLF writer upstream turns every flag into
          # `--binaries-metadata\r` and nextest rejects it with a
          # "a similar argument exists" tip that does not name the real cause.
          # The producer now emits LF explicitly; this keeps a future one from
          # reintroducing the failure on Windows only.
          while IFS= read -r reuse_arg; do
            reuse_args+=("${reuse_arg%$'\r'}")
          done < <(python .github/scripts/nextest_reuse_extraction.py \
            --extract-dir "$NEXTEST_EXTRACT_DIR" \
            --archive "$archive")
          if [ "${#reuse_args[@]}" -eq 0 ]; then
            echo "nextest_reuse_extraction.py emitted no flags" >&2
            exit 1
          fi

          # List the positively owned partition separately. This filtered
          # inventory is the denominator for execution coverage below, while
          # NEXTEST_ALL_LIST_JSON remains proof that declarations are live.
          python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$NEXTEST_BIN" nextest list \
            "${reuse_args[@]}" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile target-run \
            --partition "$REPLAY_PARTITION" \
            -E "$TARGET_RUN_FILTER" \
            --message-format json-pretty > "$NEXTEST_LIST_JSON"

          python .github/scripts/target_run_summary.py \
            --target '${{ inputs.target }} (${{ matrix.replay.label }})' \
            --partition "$REPLAY_PARTITION" \
            --output "$TARGET_RUN_SUMMARY" \
            --list-json "$NEXTEST_LIST_JSON"

          set +e
          python .github/scripts/run_target_command.py --execution '${{ inputs.target_execution }}' -- "$NEXTEST_BIN" nextest run \
            "${reuse_args[@]}" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile target-run \
            --partition "$REPLAY_PARTITION" \
            -E "$TARGET_RUN_FILTER" \
            --max-fail 3:immediate
          run_status=$?
          set -e

          summary_status=0
          python .github/scripts/target_run_summary.py \
            --target '${{ inputs.target }} (${{ matrix.replay.label }})' \
            --partition "$REPLAY_PARTITION" \
            --output "$TARGET_RUN_SUMMARY" \
            --list-json "$NEXTEST_LIST_JSON" \
            --junit "$GITHUB_WORKSPACE/target/nextest/target-run/junit.xml" \
            --require-junit \
            --github-summary "$GITHUB_STEP_SUMMARY" || summary_status=$?
          if [ "$run_status" -ne 0 ]; then
            exit "$run_status"
          fi
          exit "$summary_status"

      # soldr#2931 wants the RED evidence for why this archive reached 3.3 GiB
      # compressed, and soldr#2933 is where it gets collected. The tarball
      # size alone is compatible with every explanation -- a few enormous
      # binaries, hundreds of medium ones, duplicated static linking across
      # every integration test, or debug info that compresses well and
      # extracts enormously -- and those call for completely different fixes.
      # This prints the actual distribution to the step summary.
      #
      # Non-fatal by construction: the helper returns 0 for every failure
      # mode. `assert_free_space.py` above is the step that is allowed to turn
      # this lane red; a byte census is not.
      - name: Attribute nextest archive bytes (soldr#2931)
        if: always()
        continue-on-error: true
        shell: bash
        run: >-
          python .github/scripts/nextest_archive_bytes.py
          --extract-dir "${NEXTEST_EXTRACT_DIR:-}"
          --archive "artifact/${{ inputs.artifact_name }}-tests.tar.zst"
          --top 30
          --json "$RUNNER_TEMP/nextest-archive-bytes.json"
          --summary "$GITHUB_STEP_SUMMARY"

      # soldr#3128: the daemon/broker evidence for a test that stalled exists
      # ONLY inside the fixture's private temp roots -- the artifact below
      # otherwise carries toolchain JSON, nextest inventories and JUnit, none
      # of which can say why a build inside a fixture stopped making progress.
      # The helper copies a fixed whitelist of logs, JSONL and breach-dump
      # summaries (capped per file and in total, heap profiles and compiler
      # caches excluded), so this stays kilobytes, not gigabytes.
      #
      # Non-fatal by construction, like the byte census above: the helper
      # returns 0 for every outcome. Collecting diagnostics must never be the
      # thing that turns a lane red.
      - name: Collect fixture diagnostics (soldr#3128)
        if: always()
        continue-on-error: true
        shell: bash
        run: >-
          python .github/scripts/collect_fixture_diagnostics.py
          --output "$RUNNER_TEMP/fixture-diagnostics"

      # Taken with `always()` on purpose: the reading that matters most is
      # the one after a run that just failed (soldr#2734).
      - name: Report free disk space (after)
        if: always()
        shell: bash
        run: python .github/scripts/report_free_space.py --label after

      # ---------------------------------------------------------------
      # soldr#3076/#3078: macOS Recovery guest replay (x86_64-recovery only).
      #
      # Replaces soldr#3071's dockur/macos ssh replay, which needed a
      # hand-baked guest image and an ssh secret that were never produced --
      # every run failed at preflight. zackees/docker-mac-x64 boots a real
      # x86_64 macOS Recovery guest under KVM with neither. Recovery has no
      # toolchain of its own and no per-command exec (one boot runs exactly
      # one script), so soldr#3078 packs the same positively-owned nextest
      # partition every other target-run lane replays -- toolchain
      # provisioning included -- into that one guest script instead of the
      # dozen workflow steps above. See ci/macos_recovery_run.py for exactly
      # what runs where.
      - name: Prepare the Recovery guest share directory
        if: ${{ inputs.target_execution == 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p share
          cp "$SOLDR_BIN" share/soldr
          chmod +x share/soldr
          cp "$SOLDR_INTERNAL_DAEMON_EXE" share/soldr-daemon
          chmod +x share/soldr-daemon
          cp "$NEXTEST_BIN" share/cargo-nextest
          chmod +x share/cargo-nextest
          # Untouched: the guest's cargo-nextest decodes .tar.zst itself.
          cp "artifact/${{ inputs.artifact_name }}-tests.tar.zst" share/tests.tar.zst
          # Plain, uncompressed tar: bsdtar in the guest is not asked to
          # decompress zstd.
          tar -cf share/fixtures.tar -C "$SOLDR_TEST_FIXTURES_DIR" .
          git archive HEAD -o share/workspace.tar
          metadata="${NEXTEST_BIN%/*}/cargo-nextest.json"
          test -f "$metadata"
          jq -r '.version' "$metadata" | sed 's/^v//' > share/nextest-version.txt
          # soldr#3078: the guest has no inventory to validate this filter
          # against before it boots -- that validation runs after
          # collection, against the inventory the guest's own
          # nextest_list_all stage produces (see the verify-collected step
          # below).
          python .github/scripts/target_run_ownership.py \
            --manifest ci/target-run-ownership.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --filter-only \
            --target '${{ inputs.target }}' \
            --filter-output share/filter.txt

      # --github-output hands the generated script straight to this step's
      # own `script` output -- no separate heredoc step needed.
      - name: Generate the Recovery guest script
        id: recovery_guest_script
        if: ${{ inputs.target_execution == 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/macos_recovery_run.py emit-guest-script \
            --output "$RUNNER_TEMP/recovery-run.sh" \
            --partition "$REPLAY_PARTITION" \
            --github-output "$GITHUB_OUTPUT"
          python ci/macos_recovery_run.py describe-executor \
            --output "$RUNNER_TEMP/recovery-executor-contract.json"

      # ram/boot-timeout/run-timeout/no-progress-timeout raised from the
      # action's smoke-only defaults: this guest now formats+mounts a work
      # volume, provisions a managed rustup toolchain, and replays a real
      # nextest partition, not just `soldr --version`/`--help`.
      - name: Run the replay inside a macOS Recovery guest
        id: macos
        if: ${{ inputs.target_execution == 'x86_64-recovery' }}
        uses: zackees/docker-mac-x64@0769c0bcc9367c6516da39c0a3aa4cb55988ec79 # main
        with:
          share-dir: share
          collect: /tmp/results
          ram: "10"
          cores: "2"
          threads: "4"
          boot-timeout: "1200"
          run-timeout: "3600"
          no-progress-timeout: "1200"
          run: ${{ steps.recovery_guest_script.outputs.script }}

      - name: Verify the collected Recovery guest results
        if: ${{ inputs.target_execution == 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/macos_recovery_run.py verify-collected \
            --collected '${{ steps.macos.outputs.workdir }}/collected' \
            --guest-exit-code '${{ steps.macos.outputs.exit-code }}' \
            --manifest ci/target-run-ownership.json \
            --repo-root "$GITHUB_WORKSPACE" \
            --target '${{ inputs.target }}' \
            --partition "$REPLAY_PARTITION" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload Recovery guest diagnostics
        if: ${{ always() && inputs.target_execution == 'x86_64-recovery' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: target-run-${{ inputs.target }}-${{ matrix.replay.label }}-recovery-diagnostics
          path: |
            ${{ steps.macos.outputs.workdir }}/collected/
            ${{ steps.macos.outputs.workdir }}/results/
            ${{ runner.temp }}/recovery-executor-contract.json
          if-no-files-found: warn
          retention-days: 7

      # soldr#2615: the PEP 517 wheel smoke rides this allocation instead of a
      # second VM of the identical image. Wheel compilation routes through the
      # packaged target-native soldr via the toolchain shims written above, so
      # the self-build policy (no prebuilt soldr builds this repo) still holds.
      # soldr#3047 retired this cache: the pep517 family was 3.98 GiB / 10
      # entries on 2026-09-01 and is the lever that keeps the repository
      # inside the 9.0 GiB allocation with Tier-2 (soldr#3041) held at its
      # reserved 2.0 GiB. This lane remains cook-unreachable by design (no
      # setup-soldr step — it runs the packaged target-native soldr under
      # test) but it is now simply uncached rather than exception-listed, so
      # `ci/cache-ownership.json` no longer names it under
      # `cook-unreachable-lane`.
      - name: Build soldr wheel under test
        if: ${{ inputs.run_pep517_smoke && matrix.replay.run_followup && inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        run: |
          set -euo pipefail
          # The provisioning step exported CARGO/RUSTC as absolute toolchain
          # paths for the replay. maturin honors $CARGO, which would bypass
          # the soldr shims — clear both so the shim dir on PATH routes the
          # wheel build through the packaged soldr under test.
          unset CARGO RUSTC
          export PATH="$TOOLCHAIN_SHIM_DIR:$PATH"
          # No setup-soldr in this lane puts a `soldr` on PATH; hand the
          # installer the packaged target-native binary explicitly (its
          # designed release-lane override).
          export SOLDR_RELEASE_DRIVER="$SOLDR_BIN"
          python -m pip install --upgrade pip
          python .github/scripts/install_soldr_maturin.py
          maturin build --profile ci-release --out dist  # ci-lint: allow RUST-001 the soldr-wrapped maturin from install_soldr_maturin.py, driven by the packaged soldr under test

      - name: Run downstream PEP 517 daemon smoke
        if: ${{ inputs.run_pep517_smoke && matrix.replay.run_followup && inputs.target_execution != 'x86_64-recovery' }}
        shell: bash
        env:
          SOLDR_DAEMON_REQUIRED: "1"
          SOLDR_DAEMON_SPAWN_RETRY_BUDGET_MS: "5000"
        run: >-
          python .github/scripts/pep517_daemon_smoke.py
          --wheel "dist/*.whl"
          --timeout 900
          --log-dir "${{ runner.temp }}/pep517-soldr-logs"

      - name: Upload PEP 517 Soldr logs
        if: ${{ always() && inputs.run_pep517_smoke && matrix.replay.run_followup && inputs.target_execution != 'x86_64-recovery' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pep517-soldr-logs-${{ inputs.target }}
          path: ${{ runner.temp }}/pep517-soldr-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload target-run diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: target-run-${{ inputs.target }}-${{ matrix.replay.label }}-diagnostics
          path: |
            ${{ runner.temp }}/soldr-toolchain-ensure.json
            ${{ runner.temp }}/soldr-toolchain-link.json
            ${{ runner.temp }}/nextest-all-list.json
            ${{ runner.temp }}/nextest-list.json
            ${{ runner.temp }}/target-run-filter.txt
            ${{ runner.temp }}/target-run-summary.json
            ${{ runner.temp }}/nextest-archive-bytes.json
            ${{ runner.temp }}/fixture-diagnostics/**
            target/nextest/target-run/junit.xml
          if-no-files-found: ignore
          retention-days: 7
