name: win-gnu link smoke (scheduled)

# soldr#2336's final checklist item — a scheduled-only win-gnu CI lane, with a
# Windows-host and a Linux-host lane.
#
# TRIGGER DISCIPLINE: `schedule` + `workflow_dispatch` ONLY, never push /
# pull_request. The old `windows-gnu-mingw-validation.yml` lane was deleted in
# soldr#1982 for path-triggering on nearly every PR; this is the regression
# canary that runs weekly (or on demand) instead. It is distinct from the
# dispatch-only cross-compile *stress matrix* (soldr#2337): that surfaces gaps
# across the whole host×target grid on demand; this is a focused, hard-green
# win-gnu link check on a cron.
#
# Each lane builds soldr FROM THE CHECKOUT (a pinned release can predate the
# win-gnu behaviour), then cross-builds a fixture to x86_64-pc-windows-gnu and
# asserts the emitted binary is a PE32+ x86-64 image (via `--no-cache`, to
# dodge the win-gnu embedded-cache `.pdb` defect soldr#2347). The build + PE parse live
# in .github/scripts/win_gnu_link_smoke.py (pytest-covered) — this YAML stays
# orchestration-only, per CLAUDE.md.
#
#   * Windows host → WinLibs mingw-w64-gcc bundle.
#   * Linux x64 host → conda-forge mingw-w64 *cross* gcc toolchain (soldr#2341 /
#     soldr-toolchain#114 Phase 2). Other non-Windows hosts have no cross bundle
#     yet, so only these two lanes exist.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 07:31 UTC. Off-peak minute to dodge cron congestion.
    - cron: "31 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Authenticated GitHub Releases lookups (5,000/hr) for soldr's asset fetches.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  link-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # A from-source soldr build plus a cross toolchain fetch + fixture link.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-host → win-gnu (conda cross gcc)
            runner: ubuntu-24.04
          - name: windows-host → win-gnu (WinLibs gcc)
            runner: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain + cross target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-gnu

      # soldr#2763: uv must exist before the first step that uses it. This lane
      # runs on both a linux and a windows host, and `python3` means something
      # different on each; the pin makes the smoke's interpreter the same one
      # in both matrix legs. The script is stdlib-only, so this is about
      # reproducibility rather than dependencies.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      # Pinned soldr as the build DRIVER only; the freshly built binary is what
      # exercises the win-gnu behaviour. cache:false — this is a rare lane.
      - name: Setup soldr
        uses: zackees/setup-soldr@10a58e5c892077586794cca1086c4a8162206bef
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          cook-delta: false
          toolchain: 1.98.1
          cache: false

      # soldr#2822 — `dtolnay/rust-toolchain` adds the cross target to the
      # runner's own rustup home, but setup-soldr switches the build to a
      # managed one:
      #
      #   Runner rustup home /home/runner/.rustup is missing requested
      #   components for 1.98.1: rustfmt, clippy; using managed RUSTUP_HOME
      #
      # so the target is installed in one home and looked for in another. The
      # lane passed only when the managed home happened to already carry
      # `rust-std` for the target, and failed with
      #
      #   error[E0463]: can't find crate for `std`
      #   note: the `x86_64-pc-windows-gnu` target may not be installed
      #
      # when it did not. Routing through soldr puts it where the build looks.
      - name: Add the cross target to the toolchain soldr will use
        shell: bash
        run: |
          set -euo pipefail
          soldr rustup target add x86_64-pc-windows-gnu

      # soldr#2813 follow-up: read the output path from cargo instead of
      # assuming `target/debug/`. `soldr cargo build` injects
      # CARGO_BUILD_TARGET on Windows and nowhere else, so cargo writes
      # `target/<triple>/debug/soldr.exe` there and `target/debug/soldr` on
      # Linux -- which is exactly why the windows-host lane never found the
      # binary it had just built while the linux-host lane did.
      - name: Build soldr from this checkout
        shell: bash
        run: |
          set -euo pipefail
          soldr cargo build -p soldr-cli --bin soldr \
            --message-format=json-render-diagnostics | tee build-artifacts.json

      - name: Locate the built soldr
        shell: bash
        run: |
          set -euo pipefail
          SOLDR_BIN="$(uv run --no-project --python 3.13 python .github/scripts/win_gnu_link_smoke.py locate \
            --build-log build-artifacts.json --name soldr)"
          echo "smoke_soldr_bin=${SOLDR_BIN}" >> "$GITHUB_ENV"
          echo "built soldr: ${SOLDR_BIN}"

      - name: win-gnu link smoke
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/win_gnu_link_smoke.py smoke \
            --soldr "${{ env.smoke_soldr_bin }}" \
            --target x86_64-pc-windows-gnu \
            --summary "$GITHUB_STEP_SUMMARY"
