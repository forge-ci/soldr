name: Cache delta experiment

# Exercises `.github/actions/cache-delta-experiment` (and its cleanup
# sibling) against soldr's own dogfood build, side-by-side with a
# `baseline` job that runs the same cook + build under a single
# `actions/cache` step. The third job (`compare`) gathers the two
# jobs' outputs into a markdown table so we can read the "upload bytes
# saved" number directly from the workflow summary.
#
# This is the slice where the experiment starts emitting actionable
# numbers — every measurement run prints both:
#   * delta-job total upload bytes   = cook + delta layer uploads
#   * baseline-job upload bytes      = single zccache dir tarball
#   * ratio                          = delta / baseline (lower is better)
#
# On a cold run the two should be similar (both upload the full cook
# output). On a warm run with unchanged Cargo.lock the delta job
# should upload ~the delta-bytes only, while the baseline re-uploads
# the entire zccache dir.
#
# Trigger surface kept small: workflow_dispatch for manual measurement
# runs, plus path-filtered push so iterating on the action itself
# round-trips through CI without paying for full PR-event coverage.

on:
  workflow_dispatch: {}
  push:
    # soldr#1985 — was missing `branches:`, so this fired on pushes to every
    # feature branch, not just main.
    branches:
      - main
    paths:
      - ".github/actions/cache-delta-experiment/**"
      - ".github/actions/cache-delta-experiment-cleanup/**"
      - ".github/workflows/cache-delta-experiment.yml"

permissions:
  contents: read

env:
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326 / #1328 / #1329 / #1330 / #1332.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  delta:
    name: Linux x64 (delta-cache)
    runs-on: ubuntu-24.04
    # soldr#1978 item 8 burn-down. The workload is fixed -- workflow_dispatch
    # takes no inputs, so this always cooks + builds soldr itself. Ten observed
    # runs land at 10-23 min, so 90 min is ~4x headroom and still a quarter of
    # the 360-minute default it replaces.
    timeout-minutes: 90
    outputs:
      cook-cache-hit: ${{ steps.delta-cache.outputs.cook-cache-hit }}
      delta-cache-hit: ${{ steps.delta-cache.outputs.delta-cache-hit }}
      cook-bytes: ${{ steps.measure.outputs.cook-bytes }}
      delta-bytes: ${{ steps.delta-cache.outputs.delta-bytes }}
      total-bytes: ${{ steps.measure.outputs.total-bytes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - id: setup-soldr
        # zackees/setup-soldr@v0.9.82 pinned to a full SHA per the repo
        # ruleset. Disable setup-soldr's own caching — the
        # cache-delta-experiment action owns caching for this
        # workflow. Build-cache + target-cache off for the same
        # reason; we want exactly one cache mechanism active so the
        # measurements are clean.
        #
        # version: 0.7.28 because this historical baseline is intentionally
        # pinned independently from the current Soldr release.
        # which predates `soldr cook` (the cook subcommand was added
        # in PR #409, first released in 0.7.25). Without this pin
        # the cook-cmd step falls through to External tool fetch
        # and dies with `tool not found: cook`.
        #
        # Pinned at 0.7.28 specifically — that's the latest
        # **published** GitHub Release. Cargo.toml/package.json on
        # main may be bumped to a higher version (e.g. 0.7.29)
        # before the auto-release workflow has built and published
        # the matching tarball; setup-soldr fetches by tag, so an
        # unpublished version 404s here.
        uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          version: "0.7.28"
          cache: false
          zccache-seed-strict: true
          linker: platform-default
          cache-dir: ${{ runner.temp }}/cache-delta-exp-setup
          build-cache: false
          target-cache: false

      - name: Show soldr environment
        shell: bash
        # SOLDR_CACHE_DIR is set at step level because the `runner`
        # context isn't available in job-level `env:` — GitHub
        # rejects the workflow at parse time. Each step that depends
        # on the path repeats the same `${{ runner.temp }}/...`
        # expression. The trade for the duplication is that the
        # workflow actually parses.
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-soldr
        run: |
          soldr version --json
          echo "SOLDR_CACHE_DIR=${SOLDR_CACHE_DIR}"
          echo "soldr path: $(which soldr)"

      - id: delta-cache
        name: Run cook + build with layered cache
        # The composite action restores both layers, runs cook,
        # touches the mark, runs build, and packages the post-build
        # delta. Cleanup happens in the dedicated step below.
        uses: ./.github/actions/cache-delta-experiment
        with:
          cache-dir: ${{ runner.temp }}/cache-delta-exp-soldr
          # soldr#1978 item 6 — was the bare triple `x86_64-unknown-linux-gnu`,
          # one string collision away from poisoning a real lane. Namespaced
          # to this experiment, and deliberately NOT on the `ws-` scheme: this
          # workflow compares cache strategies, so its namespace must stay
          # private to it.
          shared-key: cache-delta-exp-x86_64-unknown-linux-gnu
          # Cook + build commands. Both go through soldr so the
          # zccache RUSTC_WRAPPER picks up the layered cache dir
          # naturally. soldr cook with no flags prepares the
          # default (release) dep tree, which is what `cargo build`
          # below needs. (Earlier revisions passed `--tests` here
          # but soldr cook rejects unknown flags pre-`--`; not
          # worth threading through for the experiment.)
          cook-cmd: soldr cook
          build-cmd: soldr cargo build --package soldr-cli

      - name: Save layers (cleanup)
        # Runs regardless of build outcome so a failed build still
        # saves whatever the cook step produced — the next run
        # benefits even if this one tripped on a regression.
        if: always()
        uses: ./.github/actions/cache-delta-experiment-cleanup

      - id: measure
        name: Measure upload bytes
        if: always()
        # The cook archive is only PACKED-FOR-UPLOAD when the cook
        # cache key missed on restore. Otherwise it was just the
        # restored file on disk and represented zero "new" upload
        # bytes for this run. Splitting cook-upload-bytes vs.
        # cook-archive-bytes-on-disk is what lets the warm-run
        # comparison story land: steady-state runs upload only the
        # tiny delta, not the full cook layer every time.
        shell: bash
        run: |
          set -euo pipefail
          cook_archive="${RUNNER_TEMP}/soldr-cook-layer.tar.zst"

          cook_hit="${{ steps.delta-cache.outputs.cook-cache-hit }}"
          delta_bytes="${{ steps.delta-cache.outputs.delta-bytes }}"
          if [ -z "${delta_bytes}" ]; then delta_bytes=0; fi

          cook_bytes=0
          if [ "${cook_hit}" != "true" ] && [ -f "${cook_archive}" ]; then
            cook_bytes=$(wc -c < "${cook_archive}" | awk '{print $1}')
          fi

          total=$((cook_bytes + delta_bytes))
          {
            echo "cook-bytes=${cook_bytes}"
            echo "total-bytes=${total}"
          } >> "$GITHUB_OUTPUT"
          echo "delta job upload bytes: cook=${cook_bytes} delta=${delta_bytes} total=${total}"

  baseline:
    name: Linux x64 (single-cache baseline)
    runs-on: ubuntu-24.04
    # Same fixed workload and headroom as `delta` above (soldr#1978 item 8).
    timeout-minutes: 90
    outputs:
      cache-hit: ${{ steps.restore.outputs.cache-hit }}
      upload-bytes: ${{ steps.measure.outputs.upload-bytes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          # 0.7.29 brings `soldr cook` — see delta job above for why.
          version: "0.7.28"
          cache: false
          zccache-seed-strict: true
          linker: platform-default
          cache-dir: ${{ runner.temp }}/cache-delta-exp-baseline-setup
          build-cache: false
          target-cache: false

      - id: keys
        name: Compute baseline key
        shell: bash
        # SOLDR_CACHE_DIR at step level (see delta job above for why
        # the `runner.temp` context can't live in job-level env).
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-baseline
        run: |
          set -euo pipefail
          OS="${{ runner.os }}"
          ARCH="${{ runner.arch }}"
          if [ -f Cargo.lock ]; then
            LOCK_HASH=$(sha256sum Cargo.lock | cut -c1-16)
          else
            LOCK_HASH="no-lock"
          fi
          if [ -f rust-toolchain.toml ]; then
            TC_HASH=$(sha256sum rust-toolchain.toml | cut -c1-16)
          else
            TC_HASH="no-tc"
          fi
          PREFIX="soldr-baseline-${OS}-${ARCH}-${LOCK_HASH}-${TC_HASH}"
          {
            echo "key=${PREFIX}-${{ github.sha }}"
            echo "restore=${PREFIX}-"
            echo "zccache-dir=${SOLDR_CACHE_DIR}/cache/zccache"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "${SOLDR_CACHE_DIR}/cache/zccache"

      - id: restore
        name: Restore baseline cache (single layer)
        # Same `actions/cache` pattern the existing dogfood uses
        # (setup-soldr-action.yml:129-137). One key, the whole
        # zccache dir under it. No layering. This is what soldr
        # users get today; the delta-job is what they could get
        # if we ship the layered approach.
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.keys.outputs.zccache-dir }}
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.restore }}

      - name: Run cook + build (baseline)
        shell: bash
        # Same step-level SOLDR_CACHE_DIR pattern as the delta job —
        # otherwise soldr falls back to $HOME/.soldr and the cache
        # restored via actions/cache above lives in the wrong place.
        # ZCCACHE_CACHE_DIR must stay coordinated with SOLDR_CACHE_DIR
        # or managed-zccache mode refuses to run.
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-baseline
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-baseline/cache/zccache
        run: |
          set -euo pipefail
          soldr cook
          soldr cargo build --package soldr-cli

      - name: Flush + shutdown baseline cache
        if: always()
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-baseline
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/cache-delta-exp-baseline/cache/zccache
        run: |
          set +e
          soldr cache flush --json || true
          # soldr#3386: both attempts print their own stderr; say so when
          # both fail. Still non-fatal (exit 0 below).
          if ! soldr cache shutdown --shutdown-timeout-seconds 60 --json; then
            echo "::warning::soldr cache shutdown failed (exit $?); trying soldr zccache stop"
            soldr zccache stop || echo "::warning::soldr zccache stop also failed (exit $?); see the stderr above"
          fi
          rm -f "${ZCCACHE_CACHE_DIR}/daemon.sock"
          exit 0

      - id: measure
        name: Measure baseline upload size
        if: always()
        shell: bash
        # actions/cache@v4 saves the whole `path:` value on every
        # exact-key miss, which is every commit (because the key
        # embeds github.sha). We approximate the upload bytes by
        # tarring the same dir under matching compression. Slightly
        # tighter than actions/cache's internal compression, so the
        # baseline number is a LOWER BOUND on what actions/cache
        # actually uploads — making the comparison favor the
        # baseline a little. Acceptable for the experiment.
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/baseline-upload-estimate.tar.zst"
          zccache_dir="${{ steps.keys.outputs.zccache-dir }}"
          if [ -d "$zccache_dir" ]; then
            list="${RUNNER_TEMP}/baseline-upload-files.lst"
            ( cd "$zccache_dir" && find . -type f -print0 > "$list" )
            if [ -s "$list" ] && tr -d '\0' < "$list" | grep -q .; then
              ( cd "$zccache_dir" && tar --null -T "$list" --use-compress-program='zstd -19 -T0' -cf "$archive" )
              bytes=$(wc -c < "$archive" | awk '{print $1}')
            else
              bytes=0
            fi
          else
            bytes=0
          fi
          echo "upload-bytes=${bytes}" >> "$GITHUB_OUTPUT"
          echo "baseline upload (estimated): ${bytes} bytes"

  compare:
    name: Side-by-side comparison
    needs: [delta, baseline]
    if: always()
    runs-on: ubuntu-24.04
    # A single step that formats the two jobs' outputs into a markdown table
    # -- seconds of work (soldr#1978 item 8).
    timeout-minutes: 15
    steps:
      - name: Emit comparison summary
        shell: bash
        env:
          DELTA_COOK_HIT: ${{ needs.delta.outputs.cook-cache-hit }}
          DELTA_DELTA_HIT: ${{ needs.delta.outputs.delta-cache-hit }}
          DELTA_COOK_BYTES: ${{ needs.delta.outputs.cook-bytes }}
          DELTA_DELTA_BYTES: ${{ needs.delta.outputs.delta-bytes }}
          DELTA_TOTAL_BYTES: ${{ needs.delta.outputs.total-bytes }}
          BASELINE_HIT: ${{ needs.baseline.outputs.cache-hit }}
          BASELINE_BYTES: ${{ needs.baseline.outputs.upload-bytes }}
        run: |
          set -euo pipefail
          fmt_bytes() {
            local b="${1:-0}"
            # Print as MiB with one decimal place when ≥1 MiB, else bytes.
            awk -v b="$b" 'BEGIN {
              if (b == 0) { print "0 B"; exit }
              if (b >= 1048576) { printf "%.1f MiB (%d B)\n", b/1048576, b; exit }
              if (b >= 1024)    { printf "%.1f KiB (%d B)\n", b/1024, b;    exit }
              printf "%d B\n", b
            }'
          }
          ratio() {
            local d="${1:-0}"; local b="${2:-0}"
            awk -v d="$d" -v b="$b" 'BEGIN {
              if (b == 0) { print "n/a"; exit }
              printf "%.2fx (%.1f%%)\n", d/b, (d*100)/b
            }'
          }

          delta_total_fmt=$(fmt_bytes "${DELTA_TOTAL_BYTES:-0}")
          delta_cook_fmt=$(fmt_bytes "${DELTA_COOK_BYTES:-0}")
          delta_delta_fmt=$(fmt_bytes "${DELTA_DELTA_BYTES:-0}")
          baseline_fmt=$(fmt_bytes "${BASELINE_BYTES:-0}")
          ratio_fmt=$(ratio "${DELTA_TOTAL_BYTES:-0}" "${BASELINE_BYTES:-0}")

          {
            echo "## Cache delta vs single-cache baseline"
            echo ""
            echo "| metric | delta job | baseline job |"
            echo "|---|---|---|"
            echo "| cache-hit (cook / single) | \`${DELTA_COOK_HIT}\` | \`${BASELINE_HIT}\` |"
            echo "| cache-hit (delta) | \`${DELTA_DELTA_HIT}\` | n/a |"
            echo "| upload bytes — cook layer | ${delta_cook_fmt} | included in baseline single layer |"
            echo "| upload bytes — delta layer | ${delta_delta_fmt} | n/a |"
            echo "| **upload bytes — total** | **${delta_total_fmt}** | **${baseline_fmt}** |"
            echo "| ratio (delta / baseline) | ${ratio_fmt} | _lower is better_ |"
            echo ""
            echo "_Cold runs: ratio ~1.0 expected (both upload the full cook output)._"
            echo "_Warm runs (same Cargo.lock + rust-toolchain.toml): delta should drop to per-PR-only writes, baseline re-uploads everything._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- comparison ---"
          echo "delta-total=${DELTA_TOTAL_BYTES:-0} bytes (cook=${DELTA_COOK_BYTES:-0} delta=${DELTA_DELTA_BYTES:-0})"
          echo "baseline=${BASELINE_BYTES:-0} bytes"
          echo "ratio (delta/baseline)=${ratio_fmt}"
