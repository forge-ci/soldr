name: Autonomous Release

# canonical Windows GNU target uses the shipped Windows x64 host artifact;
# it is a supported cross-build ABI, not a ninth host-distribution archive.

run-name: "Release ${{ inputs.dry_run && 'dry run ' || '' }}${{ inputs.candidate_sha }}"

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact merged main commit to release (full 40-character SHA).
        type: string
        default: ""
      full_ci_run_id:
        description: Successful explicit CI full run ID for candidate_sha.
        type: string
        default: ""
      force_pypi_publish:
        description: Force the PyPI wheel build/publish path for the current Cargo version, even if PyPI already lists files for it.
        required: false
        type: boolean
        default: false
      npm_release_ref:
        description: Recover npm for an immutable tag; candidate_sha and full_ci_run_id are required.
        type: string
        default: ""
      dry_run:
        description: Build, smoke and verify the full production matrix on candidate_sha, publishing nothing (soldr#2469 3.1).
        type: boolean
        default: false
      promote_run_id:
        description: Promote the exact artifacts of this earlier auto-release run for candidate_sha instead of rebuilding (soldr#2469 4.1).
        type: string
        default: ""
permissions:
  actions: read
  contents: write
  attestations: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: auto-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect explicit release candidate
    if: inputs.npm_release_ref == ''
    runs-on: ubuntu-24.04
    # Version/tag lookups only; observed max 0.2 min over 10 runs.
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      should_publish_github_release: ${{ steps.validate.outputs.should_publish_github_release }}
      should_publish_pypi: ${{ steps.validate.outputs.should_publish_pypi }}
      should_publish_npm: ${{ steps.validate.outputs.should_publish_npm }}
      dry_run: ${{ steps.validate.outputs.dry_run }}
      tag_exists: ${{ steps.validate.outputs.tag_exists }}
      github_release_complete: ${{ steps.validate.outputs.github_release_complete }}
      github_release_immutable: ${{ steps.validate.outputs.github_release_immutable }}
      pypi_has_version: ${{ steps.validate.outputs.pypi_has_version }}
      pypi_file_count: ${{ steps.validate.outputs.pypi_file_count }}
      npm_has_version: ${{ steps.validate.outputs.npm_has_version }}
      version: ${{ steps.validate.outputs.version }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Require merged candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: uv run --no-project --python 3.13 python .github/scripts/release_full_ci_gate.py --verify-candidate --candidate-sha "$CANDIDATE_SHA"

      # Contract-generated (soldr#2469 step 2.1): the build job's matrix
      # comes from ci/canonical-targets.json, so the matrix and the
      # completeness contract cannot drift apart separately again.
      - name: Generate release build matrix from the target contract
        id: build_matrix
        run: echo "matrix=$(uv run --no-project --python 3.13 .github/scripts/release_completeness.py --build-matrix)" >> "$GITHUB_OUTPUT"

      - name: Compare candidate version against PyPI
        id: validate
        env:
          FORCE_PYPI_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_pypi_publish || false }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 .github/scripts/release_detect.py --commit-sha "${{ inputs.candidate_sha }}"

  full_ci_gate:
    name: Verify exact-SHA full CI
    needs: prepare
    if: always() && (needs.prepare.outputs.should_release == 'true' || inputs.npm_release_ref != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha || inputs.candidate_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - name: Verify completed full CI run and required jobs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.commit_sha || inputs.candidate_sha }}
          CI_RUN_ID: ${{ inputs.full_ci_run_id }}
        run: uv run --no-project --python 3.13 python .github/scripts/release_full_ci_gate.py --candidate-sha "$CANDIDATE_SHA" --ci-run-id "$CI_RUN_ID" --repository "$GITHUB_REPOSITORY"

      # soldr#2469 4.1: a promotion publishes another run's artifacts, so that
      # run must be this candidate's, with every build and smoke green.
      - name: Verify promotion source run
        if: inputs.promote_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_promotion_gate.py
          --run-id '${{ inputs.promote_run_id }}' --candidate-sha '${{ inputs.candidate_sha }}'
          --build-matrix '${{ needs.prepare.outputs.build_matrix }}'
  build:
    name: ${{ matrix.name }}
    needs:
      - prepare
      - full_ci_gate
    if: needs.prepare.outputs.should_release == 'true' && needs.full_ci_gate.result == 'success' && inputs.promote_run_id == ''
    runs-on: ${{ matrix.runner }}
    # Windows x64's Linux cross-wheel takes roughly 37 minutes cold in the
    # Docker reproduction. Ninety minutes leaves room for runner variance.
    timeout-minutes: 90
    # Every release lane is required. Registry publishes are gated on a
    # verified GitHub Release asset set, so a missing target must stop the
    # release instead of silently shipping PyPI/npm only.
    continue-on-error: false
    strategy:
      fail-fast: false
      # Contract-generated (soldr#2469 step 2.1): per-target release build
      # metadata (runner, setup_target, binary — including the ARM64-musl
      # native-runner exception and the Linux-cross Windows lanes) lives in
      # ci/canonical-targets.json under `release.build`. The prepare job
      # emits the include list via release_completeness.py --build-matrix.
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.commit_sha }}

      # soldr#3148 step 1: the compile caps below are rung 4 of CLAUDE.md's
      # ladder; swap is rung 3 and must be in place before any cap is lifted.
      # The script degrades to a warning where swap cannot be enabled.
      - name: Enlarge swap (OOM headroom)
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#2763: these jobs run .github/scripts/*.py and ci/*.py through
      # bare `python3`. Without pinning they inherit the runner image's
      # interpreter, which on macOS is old enough to lack Python 3.10+ APIs
      # -- that broke the v0.9.3 macOS ARM64 release lane. Pin the same 3.13
      # the scripts are developed and unit-tested against.
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Install native musl build tools
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools mold cmake perl
          musl-gcc --version

      # ── Linux (soldr-driven) toolchain setup ──
      # soldr#1061 phase A: replaced dtolnay/rust-toolchain +
      # Swatinem/rust-cache with setup-soldr's integrated
      # `prebuild-deps: soldr-cook` flow so the release build benefits
      # from the same `target/<triple>/release/build/*/out/` cc-rs-
      # artifact restore that every-commit CI now uses.
      - name: Install pinned Soldr and prepare target environment
        id: setup_soldr
        continue-on-error: ${{ matrix.setup_target != '' }}
        uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          enable: true
          toolchain: 1.98.1
          cross-targets: ${{ matrix.setup_target }}
          linker: platform-default
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          prebuild-deps: none
          zccache-seed-strict: false

      - name: Retry target preparation after setup transport failure
        if: steps.setup_soldr.outcome == 'failure' && matrix.setup_target != ''
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/prepare_release_target.py --target "${{ matrix.setup_target }}" --github-env "$GITHUB_ENV"

      - name: Add cross-compile target
        shell: bash
        run: soldr rustup target add ${{ matrix.target }}

      # ── Build driver download (Linux only) ──
      # soldr#2294: the driver is built once in the bootstrap job and
      # shared. Download it to the exact path the per-lane `cargo build`
      # used to produce, so every later `driver="target/release/soldr"`
      # reference (archive packaging, support-binary extraction, smoke
      # steps) is unchanged.
      - name: Materialize installed Soldr as release build driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          $source = (Get-Command soldr -ErrorAction Stop).Source
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item -LiteralPath $source -Destination target/release/soldr.exe -Force
          } else {
            Copy-Item -LiteralPath $source -Destination target/release/soldr -Force
          }

      - name: Restore executable bit on bootstrap driver
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) driver="target/release/soldr.exe" ;;
            *) driver="target/release/soldr"; chmod +x "$driver" ;;
          esac
          "$driver" --version

      # ── Build release binary ──
      # soldr#3071: apple-darwin joined this blessed-build path (the same
      # Linux cross path Windows uses) once native macOS runners were
      # removed from CI. Only ARM64 musl remains native (its catalogue
      # compiler is i386-hosted and cannot execute on the native ARM64
      # runner it builds on).
      - name: Build release binary (soldr-driven)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        env:
          SOLDR_RELEASE_CI: "1"
          # soldr#786 linux+macOS follow-up: debug info generation is now
          # controlled by `[profile.release] debug` in the workspace
          # Cargo.toml (`line-tables-only`). This step used to force it back
          # off with CARGO_PROFILE_RELEASE_DEBUG=0 -- a profile env var
          # outranks the Cargo.toml setting, so leaving that override in
          # place would have silently made the Cargo.toml change a no-op for
          # every release binary built through this step (all of Windows and
          # every Linux target except aarch64-unknown-linux-musl).
          CARGO_PROFILE_RELEASE_LTO: ${{ contains(matrix.target, 'pc-windows-msvc') && 'false' || 'thin' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ contains(matrix.target, 'pc-windows-msvc') && '16' || '1' }}
          # soldr#2453: bound Cargo's producer queue and zccache's admission
          # gate so the swap headroom above is a safety valve, not the primary
          # defense. These lanes previously ran unbounded on a 4-vCPU runner.
          CARGO_BUILD_JOBS: "2"
          SOLDR_JOBS: "2"
          # GNU build-id (soldr#786 linux+macOS follow-up): a separately
          # shipped `.debug` symbol file (soldr#3038: a post-link objcopy
          # carve-out, not rustc's split-debuginfo) is useless without a
          # stable id to match it back to the exact binary that produced it,
          # and Rust does not emit a GNU build-id on Linux by default.
          # `--strip-debug` (stage_release_binaries.py::stage_debug_symbols)
          # removes `.debug_*` sections only, so this note survives the
          # strip untouched -- a symbolizer can cross-check binary and
          # `.debug` file by build-id, not only by the `.gnu_debuglink` CRC
          # the carve-out also embeds. Scoped to the Linux release triples via
          # CARGO_TARGET_<TRIPLE>_RUSTFLAGS (inert for the Windows targets
          # this same step also builds) rather than repo-wide
          # `.cargo/config.toml`, because a `.cargo/config.toml` rustflags
          # change invalidates every contributor's zccache/Cargo fingerprint
          # on every Linux build, not just the release lane. `--cfg
          # tokio_unstable` is repeated here (not just relied on from
          # `.cargo/config.toml`'s `[build] rustflags`) because
          # CARGO_TARGET_*_RUSTFLAGS does not merge with `[build] rustflags`
          # -- the same non-merge hazard the macOS cross lane already works
          # around in `build-soldr-for-darwin.sh`.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "--cfg tokio_unstable -C link-arg=-Wl,--build-id"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "--cfg tokio_unstable -C link-arg=-Wl,--build-id"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "--cfg tokio_unstable -C link-arg=-Wl,--build-id"
        run: >-
          uv run --no-project --python 3.13 .github/scripts/native_release_build.py matrix-binary
          --target '${{ matrix.target }}'

      - name: Build ARM64 musl release binary natively
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CXX_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
          RANLIB_aarch64_unknown_linux_musl: ranlib
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          # GNU build-id (soldr#786 linux+macOS follow-up), same rationale as
          # the "Build release binary (soldr-driven)" step above: this is a
          # plain `cargo build` invocation (not soldr's blessed rustflags
          # merge), so CARGO_TARGET_*_RUSTFLAGS fully replaces
          # `.cargo/config.toml`'s `[build] rustflags` for this target and
          # must repeat `--cfg tokio_unstable` itself.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "--cfg tokio_unstable -C link-arg=-Wl,--build-id"
        run: |
          set -euo pipefail
          # The catalogue ARM64-musl compiler is an
          # i386-hosted cross compiler. It cannot execute on the native ARM64
          # runner, so bypass target preparation while still routing Cargo
          # through the pinned Soldr and rustup toolchain.
          uv run --no-project --python 3.13 .github/scripts/native_release_build.py binary \
            --driver target/release/soldr --target aarch64-unknown-linux-musl

      # soldr#1060 acceptance: the musl artifacts are the "runs anywhere"
      # build precisely because they carry no dynamic dependencies. A musl
      # target that silently picked up a dynamic link still builds and still
      # passes tests on this modern image -- it only fails on the old distro
      # the artifact exists to serve. Verify before staging, so a bad binary
      # is never published.
      - name: Verify musl binary is statically linked (soldr#1060)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/verify_static_link.py \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      # soldr#1060 names glibc 2.17 as the baseline for the -gnu artifacts,
      # and warns "do not build on modern Ubuntu and call it portable". Both
      # -gnu legs now build through the blessed `soldr build` surface
      # (`native_release_build.py::build_matrix_binary`), the same code path
      # `target_lifecycle::prepare_target` routes through the managed
      # gcc-13.3.0-glibc-2.17 sysroot for (soldr#2145/#2609). The per-PR
      # lanes that exercise the identical mechanism
      # (`cross-compile-all-targets.yml`, `_ci-cross-build-linux.yml`)
      # already ratchet at 2.17 and pass, so this is now a real gate rather
      # than a "current measured floor" ratchet.
      #
      # This step covers ONLY soldr's own build output
      # (`target/<triple>/release/<binary>`), not the staged archive. The
      # bundled-archive check below stays at a looser ceiling: it also
      # covers `crgx`/`cargo-chef`, fetched prebuilt from soldr-toolchain,
      # whose glibc floor soldr does not control (soldr#2170, closed as
      # out of scope for this issue -- fixing it needs an upstream rebuild).
      #
      # If a runner image bump raises the floor, this step failing IS the
      # intended signal -- raise the ceiling deliberately, with a note, rather
      # than by reflex.
      - name: Check glibc baseline of gnu binary (soldr#1060 gate)
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/verify_glibc_baseline.py \
            --max-glibc 2.17 \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      # soldr#3085: every lane below cross-builds on an x86_64 Linux runner
      # (macOS since soldr#3073, aarch64-gnu since long before), and the
      # symbol carve-out in the next step has to read the artifact it just
      # built. The runner's own GNU binutils cannot: it rejects a foreign-arch
      # ELF ("Unable to recognise the format of the input file") and cannot
      # read Mach-O at any architecture ("file format not recognized"). Both
      # took down release run 33820395040 (v0.9.12).
      #
      # `llvm-objcopy`/`llvm-strip` are target-agnostic and GNU-option
      # compatible, so they handle every triple this matrix produces. The
      # darwin lanes already carry them via soldr's managed LLVM on PATH; the
      # aarch64-gnu lane carries only its conda cross GCC, so install rustup's
      # llvm-tools component to give stage_release_binaries.py a deterministic
      # source instead of relying on what a runner image happens to ship.
      # Best-effort: if this fails, the script still falls back to the managed
      # cross toolchain's target-prefixed binutils, and fails loudly naming
      # every location it searched rather than shipping an uncarved binary.
      - name: Provision cross-capable binutils for symbol staging (soldr#3085)
        if: ${{ !contains(matrix.target, 'pc-windows-msvc') }}
        continue-on-error: true
        shell: bash
        run: soldr rustup component add llvm-tools-preview

      - name: Stage soldr release binaries
        # soldr#3038: --symbols-dir carves Linux debug info out of the
        # staged binaries (objcopy --only-keep-debug / strip --strip-debug /
        # objcopy --add-gnu-debuglink -- NOT rustc's split-debuginfo, which
        # cannot see std/C-dependency DWARF and only duplicated it) into
        # soldr.debug, and stages the macOS .dSYM, SEPARATELY from
        # --package-dir. They must never share a directory: --package-dir
        # feeds both the main archive and manifest.json's soldr.debug_info,
        # and every setup-soldr consumer hard-rejects a debug_info entry
        # whose format isn't "pdb" (zccache_contract.py::validate_release_manifest).
        # See docs/DEBUG_SIDECARS.md.
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/stage_release_binaries.py --target "${{ matrix.target }}" --package-dir dist/package --symbols-dir dist/symbols

      - name: Fetch support binaries from soldr-toolchain
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          SUPPORT_ISSUE_URL: https://github.com/zackees/soldr-toolchain/issues/47
          SOLD_DRIVER_PATH: target/release/soldr
        run: uv run --no-project --python 3.13 .github/scripts/fetch_release_support_binaries.py --target "$TARGET_TRIPLE" --driver "$SOLD_DRIVER_PATH" --issue-url "$SUPPORT_ISSUE_URL" --package-dir dist/package

      # soldr#1060: the musl bundle is the "runs anywhere" artifact, but only
      # `soldr` was ever verified -- and the bundle ships four binaries. crgx
      # and cargo-chef are fetched here, after the earlier check has already
      # run, so nothing looked at them.
      #
      # They are fine today (checked against published v0.8.29: both are
      # static-PIE and run on Debian 12 and Alpine alike). The point is that
      # if one ever came back dynamically linked, the artifact would keep its
      # "static" promise for soldr and quietly break for the tools soldr
      # shells out to.
      #
      # This could not be added before the static-PIE fix in this same change:
      # the old "no dynamic section" test called both of them dynamic, so
      # extending the check here would have failed the release on correct
      # binaries.
      # soldr#1060, Windows side -- the last release surface with no
      # portability guard. A PE that imports a DLL the machine lacks does not
      # degrade gracefully; it fails to start.
      #
      # Measured on published v0.8.29: soldr.exe and soldr-daemon.exe import
      # 22 DLLs, of which exactly one is not part of Windows --
      # VCRUNTIME140.dll, from the Visual C++ Redistributable. The
      # api-ms-win-crt-* entries beside it are UCRT forwarders that DO ship
      # with Windows 10+, so they are not a dependency in the same sense.
      #
      # Nothing sets `-C target-feature=+crt-static`, so that is Rust's MSVC
      # default rather than a decision; a static CRT would remove it outright.
      # This step does not make that build change -- it pins the current
      # import set so a NEW non-system dependency cannot appear unnoticed, and
      # names the redistributable one on every pass so the cost stays visible.
      - name: Ratchet the Windows DLL imports (soldr#1060)
        if: contains(matrix.target, 'pc-windows-msvc')
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/verify_release_bundle.py --target "${{ matrix.target }}" --check windows-imports

      # soldr#1060, macOS side. A Mach-O records the oldest OS it will start
      # on, and nothing watched that value: it is whatever the toolchain and
      # the pinned Apple SDK produce, since no lane sets
      # MACOSX_DEPLOYMENT_TARGET. Drift upward has the same shape as the
      # GLIBC_2.39 problem -- builds fine, tests fine, refuses to launch on
      # older Macs, and you find out from a user.
      #
      # Measured on published v0.8.29: aarch64 was 11.0 throughout (correct and
      # unavoidable for Apple Silicon), and on x86_64 soldr was *also* 11.0
      # while crgx beside it was 10.12 -- so the bundle was not internally
      # consistent and x86_64 asked for more than Rust's 10.12 default for that
      # target. soldr#2146 fixed the cause (five hardcoded 11.0 literals in the
      # Darwin arm of blessed build, applied to both arches) and this ceiling is
      # now per-arch to match, so an x86_64 binary that drifts back up to 11.0
      # fails here instead of passing against a ceiling set too loose to bind.
      #
      # The ceilings live in verify_macos_min_version.py beside the parsing,
      # not inline here -- they must stay in step with
      # crates/soldr-cli/src/blessed_build/darwin_arch.rs.
      - name: Ratchet the macOS minimum version (soldr#1060)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/verify_release_bundle.py --target "${{ matrix.target }}" --check macos-min-version

      - name: Verify every bundled musl binary is static (soldr#1060)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/verify_release_bundle.py --target "${{ matrix.target }}" --check static

      # The gnu counterpart of the musl check above, and for the same reason
      # #2084 extended that one: the bundle ships FOUR binaries, and the
      # earlier glibc ratchet reads only `soldr` out of target/, before
      # staging. crgx and cargo-chef are never looked at.
      #
      # They are the ones that most need watching. Both are fetched prebuilt
      # from soldr-toolchain rather than built here, so their floor can move
      # without a single line of soldr changing -- exactly the external drift
      # a ratchet exists to catch. A user whose glibc is too old for a bundled
      # tool gets a soldr that starts and then fails the moment it shells out.
      #
      # Measured on published v0.8.29, all eight binaries across both gnu
      # bundles sit at or below this ceiling (aarch64 cargo-chef is 2.18), so
      # this reports today rather than blocking.
      - name: Check glibc baseline of every bundled gnu binary (soldr#1060)
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/verify_release_bundle.py --target "${{ matrix.target }}" --check glibc-baseline --max-glibc 2.39

      - name: Write manifest.json
        # The archive's self-description: versions, target triples,
        # per-binary sha256s, provenance. setup-soldr, the npm install
        # wrapper and ad-hoc tooling all read it, and the verify step
        # below re-derives every declared digest from the staged bytes.
        env:
          CRGX_SOURCE_COMMIT: ${{ env.CRGX_SOURCE_COMMIT }}
          CARGO_CHEF_SOURCE_COMMIT: ${{ env.CARGO_CHEF_SOURCE_COMMIT }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/release_manifest.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit-sha "${{ needs.prepare.outputs.commit_sha }}" \
            --target "${{ matrix.target }}" \
            --package-dir dist/package \
            --crgx-source-commit "${CRGX_SOURCE_COMMIT:-unknown}" \
            --cargo-chef-source-commit "${CARGO_CHEF_SOURCE_COMMIT:-unknown}"

      # manifest.json is the release describing itself, and setup-soldr, the
      # npm wrapper and ad-hoc tooling all read it. Nothing checked it, and it
      # was wrong: published v0.8.29 has crgx.source_commit holding
      # "soldr-toolchain:v0.1.0\nCARGO_CHEF_SOURCE_COMMIT=soldr-toolchain:v0.1.73"
      # with cargo_chef.source_commit reading "unknown", because the step
      # writing $GITHUB_ENV terminated lines with a literal backslash-n (fixed
      # in this change). The digests were all correct -- this was provenance,
      # not integrity -- but provenance that silently says "unknown" is worse
      # than absent, because it looks answered.
      #
      # --package-dir re-derives every declared sha256 from the staged bytes,
      # so the manifest cannot describe an archive it does not match.
      - name: Verify manifest.json describes what is staged (soldr#1060)
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/verify_release_manifest.py \
            dist/package/manifest.json \
            --package-dir dist/package

      - name: Package combined archive (tar.zst level 19)
        # Use soldr's in-process Rust zstd encoder rather than depending
        # on a runner-local `zstd` executable. The command uses level 19
        # and all available cores.
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/package_release_archive.py --version "${{ needs.prepare.outputs.version }}" --target "${{ matrix.target }}" --runner-os "$RUNNER_OS"

      # soldr#3038: the debug-symbols asset. --allow-empty because most
      # targets legitimately have nothing in dist/symbols (Windows always --
      # its PDB already ships inline in the main archive). When something
      # was staged, this produces soldr-<version>-<target>-symbols.tar.zst,
      # which lands in dist/ beside the main archive and rides along through
      # the existing `dist/soldr-*.tar.zst` upload-artifact glob below and
      # the publish job's `dist/*` release-asset upload -- no separate upload
      # step needed. Never referenced by manifest.json; setup-soldr never
      # downloads or parses it. See docs/DEBUG_SIDECARS.md.
      - name: Package debug-symbols archive (tar.zst level 19)
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/package_release_archive.py --version "${{ needs.prepare.outputs.version }}" --target "${{ matrix.target }}" --runner-os "$RUNNER_OS" --package-dir dist/symbols --label symbols --allow-empty

      # ── Wheel build (soldr-driven, Linux) ──
      # GNU wheels use the bootstrap driver's blessed wheel surface (#3436).
      # Darwin/Windows retain the existing release helper; native ARM64 musl
      # remains below until the catalogue host support in #3435 is available.
      - name: Build wheel through Soldr
        if: ${{ !contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          SOLDR_RELEASE_CI: "1"
          # Release/LTO wheel builds were signal-terminated under concurrent
          # resource pressure when Cargo and Soldr admitted multiple compiler
          # processes (run 32823371747).
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
          CC_aarch64_unknown_linux_musl: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          CXX_aarch64_unknown_linux_musl: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
          AR_aarch64_unknown_linux_musl: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'ar' || '' }}
          RANLIB_aarch64_unknown_linux_musl: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'ranlib' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'musl-gcc' || '' }}
        run: uv run --no-project --python 3.13 .github/scripts/prepare_release_wheel.py --target "${{ matrix.target }}" --runner-os "$RUNNER_OS" --expected-version "$EXPECTED_VERSION" --wheel-hook '${{ steps.setup_soldr.outputs.target-wheel-hook }}'

      - name: Build musl wheel in an explicit uv venv
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          SOLDR_RELEASE_CI: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
          CC_aarch64_unknown_linux_musl: musl-gcc
          CXX_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
          RANLIB_aarch64_unknown_linux_musl: ranlib
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/native_release_build.py musl-wheel \
            --driver target/release/soldr \
            --target "${{ matrix.target }}" \
            --expected-version "${EXPECTED_VERSION#v}"

      # soldr#2469 2.2: logic lives in the unit-tested script.
      - name: Lint wheel filenames against workspace version
        run: >-
          uv run --no-project --python 3.13 .github/scripts/wheel_filename_lints.py version
          --expected-version "${{ needs.prepare.outputs.version }}"

      - name: Assert linux-gnu wheels are tagged manylinux_2_17
        if: contains(matrix.target, 'unknown-linux-gnu')
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/wheel_filename_lints.py manylinux

      - name: Assert linux-gnu wheel binary honours the 2.17 floor (soldr#1060)
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 .github/scripts/verify_wheel_glibc.py --max-glibc 2.17 dist/*.whl

      - name: Assert linux-musl wheels are tagged musllinux_1_2
        if: contains(matrix.target, 'unknown-linux-musl')
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/wheel_filename_lints.py musllinux

      # soldr#2469 2.2: logic lives in the unit-tested script.
      - name: Verify wheel ships the bin script at the spec path
        run: >-
          uv run --no-project --python 3.13 .github/scripts/wheel_bin_script_verify.py
          --binary "${{ matrix.binary }}"

      - name: Smoke test wheel
        # GNU ARM64, Windows, and (soldr#3071) both apple-darwin targets are
        # cross-built on Linux and cannot `pip install` their own wheel here
        # (wrong platform). Musl wheels run under Alpine; Windows wheels run
        # in the smoke_windows job below; apple-darwin wheels run in the
        # smoke_macos_x64 and smoke_macos_arm64 jobs below.
        if: |
          !contains(matrix.target, 'musl') &&
          !contains(matrix.target, 'pc-windows-msvc') &&
          !contains(matrix.target, 'apple-darwin') &&
          matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/smoke_release_wheel.py --expected-version "$EXPECTED_VERSION"

      - name: Smoke test musllinux wheel on Alpine
        # Both musl lanes run on matching native-architecture Linux hosts.
        if: contains(matrix.target, 'musl')
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/smoke_musllinux_wheel.py --expected-version "$EXPECTED_VERSION"

      - name: Smoke test standalone musl binary
        # The Alpine wheel smoke above verifies pip compatibility for
        # musllinux. Keep this direct binary smoke too: the standalone
        # musl binary is statically linked so it CAN run on glibc, and
        # it catches broken tarball artifacts before release upload.
        if: contains(matrix.target, 'musl')
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/smoke_musl_binary.py --target "${{ matrix.target }}" --binary "${{ matrix.binary }}" --expected-version "$EXPECTED_VERSION"

      - name: Smoke test combined tar.zst archive
        # The last gate before an archive reaches the GitHub release.
        # Catches tar layout / file mode / bundled-binary mistakes, the
        # soldr#1140 stub-binary regression via a 2 MiB floor on every
        # lane, and the soldr#1202 `version --json` path. Cross-arch
        # archives skip only the checks that must execute the binary.
        shell: bash
        # soldr#2469 2.2: logic lives in the unit-tested script.
        run: uv run --no-project --python 3.13 .github/scripts/release_archive_smoke.py --version "${{ needs.prepare.outputs.version }}" --target "${{ matrix.target }}" --binary "${{ matrix.binary }}" --runner-os "$RUNNER_OS"


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-soldr-${{ matrix.target }}
          path: dist/soldr-*.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-soldr-${{ matrix.target }}
          path: dist/*.whl

  # Release smoke downloads the exact shipped archive and wheel artifacts on
  # fresh hosted macOS runners, then executes both on matching architectures.
  smoke_macos_x64:
    name: Smoke Intel macOS release artifacts
    needs:
      - prepare
      - full_ci_gate
      - build
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.full_ci_gate.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.promote_run_id != ''))
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      # Checkout only for ci/smoke_release_artifacts.py — the smoke logic
      # lives in a testable Python file, not inline YAML.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: release-soldr-x86_64-apple-darwin
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: pypi-soldr-x86_64-apple-darwin
          path: dist

      - name: Smoke shipped archive and install/import shipped wheel
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 ci/smoke_release_artifacts.py \
            --target x86_64-apple-darwin --expected-version '${{ needs.prepare.outputs.version }}' \
            --require-wheel-import --require-daemon-cache-smoke


  smoke_macos_arm64:
    name: Smoke ARM64 macOS release artifacts
    needs:
      - prepare
      - full_ci_gate
      - build
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.full_ci_gate.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.promote_run_id != ''))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: release-soldr-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: pypi-soldr-aarch64-apple-darwin
          path: dist
      - name: Smoke shipped archive and install/import shipped wheel
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 ci/smoke_release_artifacts.py \
            --target aarch64-apple-darwin --expected-version '${{ needs.prepare.outputs.version }}' \
            --require-wheel-import --require-daemon-cache-smoke

  # Windows artifacts are cross-built on Linux; execution still needs native
  # Windows on both architectures. Each smoke consumes uploaded artifacts.
  smoke_windows:
    name: Smoke Windows release artifacts (${{ matrix.arch }})
    needs:
      - prepare
      - full_ci_gate
      - build
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.full_ci_gate.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.promote_run_id != ''))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      # Checkout only for ci/smoke_release_artifacts.py — the smoke
      # logic lives in a testable Python file, not inline YAML.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: release-soldr-${{ matrix.target }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: pypi-soldr-${{ matrix.target }}
          path: dist

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Smoke archive and wheel (incl. required PDB sidecar)
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 ci/smoke_release_artifacts.py \
            --target '${{ matrix.target }}' \
            --expected-version '${{ needs.prepare.outputs.version }}'

  # Advisory Recovery-guest replay of the positively-owned Intel macOS nextest
  # partition, pinned to the release commit. The shipped archive/wheel are
  # independently tested by the hosted native macOS smoke jobs above.
  e2e_macos_x64_build:
    name: cross-build x86_64-apple-darwin for replay (linux host)
    needs: [prepare, full_ci_gate]
    if: needs.prepare.outputs.should_release == 'true' && needs.full_ci_gate.result == 'success'
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-apple-darwin
      artifact_name: soldr-release-e2e-macos-x64
      source_ref: ${{ needs.prepare.outputs.commit_sha }}
      # bootstrap_artifact_name omitted (optional, default ""): ci.yml's
      # value names an artifact produced by its own e2e-cross-bootstrap-soldr
      # job earlier in the *same* workflow run. auto-release.yml has no such
      # job, and artifacts do not cross workflow runs, so this falls back to
      # `_ci-cross-build-linux.yml`'s own actions/cache-or-bootstrap path.

  e2e_macos_x64_replay:
    name: target-run x86_64-apple-darwin (release gate)
    needs:
      - prepare
      - e2e_macos_x64_build
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04
      target: x86_64-apple-darwin
      artifact_name: soldr-release-e2e-macos-x64
      source_ref: ${{ needs.prepare.outputs.commit_sha }}
      target_execution: x86_64-recovery
      # Same complete owned replay proven by the dispatch canary (#3333).
      # This lane remains advisory until the independent #3088 criteria pass.
      replay_partitions: '[{"label":"all","value":"hash:1/1","run_followup":true}]'
      extended_replay: false
      run_pep517_smoke: false

  # Reject publication if any release-blocking target lacks a declared
  # execution route. Hosted Apple Silicon is available in opt-in full/release.
  release_execution_contract:
    name: Require execution for release-blocking targets
    needs: prepare
    if: >-
      always() && (
        needs.prepare.outputs.dry_run == 'true' ||
        needs.prepare.outputs.should_publish_github_release == 'true' ||
        needs.prepare.outputs.should_publish_pypi == 'true' ||
        needs.prepare.outputs.should_publish_npm == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - name: Verify canonical release execution contract
        run: uv run --no-project --python 3.13 .github/scripts/release_completeness.py --verify-execution-contract

  publish:
    name: Attest and publish release assets
    needs:
      - prepare
      - build
      - smoke_macos_x64
      - smoke_macos_arm64
      - smoke_windows
      - release_execution_contract
    # The separate Recovery replay remains advisory (soldr#3088). Both native
    # macOS release smoke jobs above gate publication of shipped artifacts.
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.promote_run_id != '')) && needs.prepare.outputs.should_publish_github_release == 'true' && needs.smoke_macos_x64.result == 'success' && needs.smoke_macos_arm64.result == 'success' && needs.smoke_windows.result == 'success' && needs.release_execution_contract.result == 'success'
    runs-on: ubuntu-24.04
    # Artifact download + attestation; observed max 0.6 min.
    timeout-minutes: 30

    steps:
      # soldr#2763: this job runs a script out of .github/scripts, so it needs
      # the repo on disk. It previously made inline `gh` API calls and needed
      # no checkout; the extraction to a script (soldr#2469) introduced the
      # dependency without adding one, and the v0.9.3 release died here with
      # "can't open file .../release_publish.py".
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: release-soldr-*
          merge-multiple: true

      # Wheels ship as GH-release assets alongside the .tar.zst archives.
      # This is parity with what `publish-pypi` uploads to PyPI: the same
      # 8 platform wheels become offline-installable via
      # `pip install <release-asset-url>`, and the assets are attestation-
      # covered via the same SHA256SUMS file below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: pypi-soldr-*
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Glob expansion happens before the `>` redirect creates the
          # output file, so SHA256SUMS.txt is never present in the set
          # it's writing.
          sha256sum soldr-* > "soldr-${{ needs.prepare.outputs.version }}-SHA256SUMS.txt"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/soldr-${{ needs.prepare.outputs.version }}-SHA256SUMS.txt

      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      # soldr#3343: the release-level record (version, SHA, tag, target
      # contract revision, every file's size and SHA-256), written after
      # SHA256SUMS so it covers it, and published as a release asset.
      - name: Write release info.json
        shell: bash
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_publish.py write-info
          --tag '${{ needs.prepare.outputs.version }}'
          --sha '${{ needs.prepare.outputs.commit_sha }}'

      # Pre-create the tag via the git refs API instead of letting
      # `gh release create --target <sha>` create it implicitly.
      # Rationale: on workflow_dispatch runs (vs push) the GITHUB_TOKEN
      # cannot create-via-release at a protected branch's HEAD — `gh
      # release create` returns "HTTP 403: Resource not accessible by
      # integration" even though the job log shows `Contents: write`.
      # The /git/refs endpoint accepts the same token at this repo, so
      # creating the tag first lets the subsequent release-create see an
      # existing tag and skip the implicit-tag-creation that was the
      # source of the 403.
      #
      # soldr#1252: both endpoints started returning 403 for v0.7.95 even
      # on push runs. Owner may need to pre-populate the tag out-of-band
      # with a PAT. Make the step idempotent: check if the tag already
      # exists first (owner may have pre-populated it), skip if so, else
      # attempt the create. The check-first flow also makes reruns after
      # a partial success safe.
      - name: Pre-create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_publish.py ensure-tag
          --tag '${{ needs.prepare.outputs.version }}'
          --sha '${{ needs.prepare.outputs.commit_sha }}'

      - name: Create draft GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_publish.py create-draft
          --tag '${{ needs.prepare.outputs.version }}'
          --sha '${{ needs.prepare.outputs.commit_sha }}'

      # soldr#2469 4.2: `publish` checks the full asset set on the draft and
      # only then makes it public -- an immutable release cannot gain assets.
      - name: Publish GitHub Release
        if: steps.create_release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_publish.py publish
          --tag '${{ needs.prepare.outputs.version }}'
          --sha '${{ needs.prepare.outputs.commit_sha }}'

  verify_github_release:
    name: Verify GitHub Release assets
    needs:
      - prepare
      - build
      - publish
    if: always() && needs.prepare.outputs.should_release == 'true' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.promote_run_id != '')) && needs.prepare.outputs.github_release_immutable != 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    # Asset-set assertion against the GitHub API; observed max 0.1 min.
    timeout-minutes: 15

    steps:
      # Needed since soldr#2469 step 2.2: the expected-asset list is
      # generated from ci/canonical-targets.json by a repo script.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Verify expected release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: uv run --no-project --python 3.13 .github/scripts/verify_github_release_assets.py --version "${{ needs.prepare.outputs.version }}"

  publish-pypi:
    name: Publish hardened PyPI wheels
    needs:
      - prepare
      - build
      - verify_github_release
      - smoke_macos_arm64
      - release_execution_contract
    # Explicit recovery can add missing PyPI files when an earlier partial
    # publish made the corresponding GitHub Release immutable.
    if: always() && needs.release_execution_contract.result == 'success' && needs.smoke_macos_arm64.result == 'success' && needs.prepare.outputs.should_publish_pypi == 'true' && (needs.verify_github_release.result == 'success' || (needs.prepare.outputs.github_release_immutable == 'true' && github.event_name == 'workflow_dispatch' && inputs.force_pypi_publish))
    runs-on: ubuntu-24.04
    # Wheel download + twine upload; observed max 1.9 min.
    timeout-minutes: 30

    steps:
      # soldr#2763: this job runs a script out of .github/scripts, so it needs
      # the repo on disk. It previously made inline `gh` API calls and needed
      # no checkout; the extraction to a script (soldr#2469) introduced the
      # dependency without adding one, and the v0.9.3 release died here with
      # "can't open file .../release_publish.py".
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.promote_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: pypi-soldr-*
          merge-multiple: true

      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      # soldr#3343: per-file and project-quota preflight; fails before upload.
      - name: Preflight wheel sizes against PyPI limits
        run: uv run --no-project --python 3.13 .github/scripts/pypi_preflight.py --dist dist

      - name: Publish wheel set to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Verify all wheels visible on PyPI
        # Poll until all sequential uploads are visible so downstream
        # resolvers cannot cache a transient "no compatible wheel" result.
        shell: bash
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          uv run --no-project --python 3.13 .github/scripts/verify_pypi_wheels.py
          --version "$PYPI_VERSION"

  # soldr#2972: source CI cannot prove that the public PyPI wheel resolves the
  # lint-library nightly. Run the same fresh-home smoke after PyPI visibility
  # has settled, before the terminal release result can turn green.
  smoke-published-dylint:
    name: Smoke published Dylint on Windows x64
    needs:
      - prepare
      - publish-pypi
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - name: Install and exercise the published Dylint surface
        shell: bash
        run: uv run --no-project --python 3.13 ci/smoke_published_dylint.py --expected-version "${{ needs.prepare.outputs.version }}"

  publish-npm:
    name: Publish npm package
    needs:
      - prepare
      - full_ci_gate
      - build
      - verify_github_release
      - publish-pypi
      - smoke_macos_arm64
      - release_execution_contract
    if: always() && needs.full_ci_gate.result == 'success' && ((inputs.npm_release_ref != '' && needs.prepare.result == 'skipped') || (needs.release_execution_contract.result == 'success' && needs.smoke_macos_arm64.result == 'success' && needs.prepare.outputs.should_publish_npm == 'true' && needs.verify_github_release.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Checkout release controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: release-control
      - name: Checkout npm package source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ inputs.npm_release_ref != '' && format('refs/tags/{0}', inputs.npm_release_ref) || needs.prepare.outputs.commit_sha }}
          path: release-source
      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      # Partial recovery still requires the tested SHA. The tag checkout
      # must resolve to that candidate before any package code is executed.
      - name: Verify npm recovery candidate source
        if: inputs.npm_release_ref != ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: uv run --no-project --python 3.13 python ../release-control/.github/scripts/release_full_ci_gate.py --verify-candidate --candidate-sha "$CANDIDATE_SHA"
      - name: Validate immutable npm recovery release
        if: github.event_name == 'workflow_dispatch' && inputs.npm_release_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 ../release-control/.github/scripts/validate_npm_release_recovery.py
          --repository "$GITHUB_REPOSITORY"
          --release-ref "${{ inputs.npm_release_ref }}"
          --source-dir .
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI with trusted publishing support
        shell: bash
        run: npm install --global npm@11.12.1
      - name: Validate npm package
        run: node scripts/test-npm-package.js && npm pack --dry-run
      - name: Publish package to npm
        run: uv run --no-project --python 3.13 ../release-control/.github/scripts/publish_npm_package.py --source-dir .

  # soldr#2469 step 1.1: terminal truth check. Green must mean the whole
  # public surface (17 GitHub assets from the canonical-targets contract,
  # the PyPI wheel set, the npm version) is verified complete for this
  # release ref. always() so upstream skips (the 0.9.0 false-green path:
  # verify_github_release skipped on an already-immutable release) cannot
  # exempt the run from the check. Recovery-only npm dispatches carry no
  # should_release and are reported as recovery by their own job, never
  # as a normal release result.
  release-completeness:
    name: Release surface completeness gate
    needs:
      - prepare
      - publish
      - verify_github_release
      - publish-pypi
      - smoke-published-dylint
      - publish-npm
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require published Dylint smoke
        if: needs.smoke-published-dylint.result != 'success'
        shell: bash
        run: exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # soldr#2763: pin the interpreter this job's scripts run under. The
      # runner image's `python3` drifts per platform -- v0.9.3 died on macOS
      # ARM64, whose python3 predates `Path.hardlink_to` (3.10+).
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Setup uv for pinned release scripts
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Verify every public release surface is complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 .github/scripts/release_completeness.py
          --version "${{ needs.prepare.outputs.version }}"
