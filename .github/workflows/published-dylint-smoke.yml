name: Published Dylint smoke

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact PyPI soldr version; leave empty to monitor latest.
        required: false
        type: string
        default: ''

# Never cancelled and never coalesced: every publish runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Published Dylint x86_64 Windows smoke
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false
      - name: Install and exercise published Dylint
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PYTHONUNBUFFERED: '1'
        run: >-
          uv run --no-project --python 3.13 ci/smoke_published_dylint.py
          --expected-version "$EXPECTED_VERSION"
