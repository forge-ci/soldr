name: CI
run-name: ${{ inputs.candidate_sha && format('CI full {0}', inputs.candidate_sha) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  push:
    # soldr#1985 — only main. Previously `branches-ignore: [perf/**,
    # evaluate/**]`, which matches every PR branch, so each push to an
    # open PR fired this workflow TWICE: once for `push` and once for
    # `pull_request`, with byte-identical content. Five branches were
    # observed running two concurrent 21-job sweeps each. Feature
    # branches keep full coverage through the `pull_request` trigger
    # below; perf/** and evaluate/** remain excluded by construction.
    branches:
      - main
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # This is deliberately unfiltered: a Markdown-only PR must report the
  # protected `Lint` context. `path-selection` keeps that path cheap and
  # suppresses the compiler/platform fan-out. Labels still re-run CI so the
  # fast-build and macOS Recovery gates receive their event payload.
  #
  # NOTE: pushes to main always run the full sweep. Label gates evaluate
  # open when `github.event.pull_request` is null,
  # and windows_e2e_policy.py explicitly requires the Windows pairs on
  # every non-PR event.
  # Label changes recompute the mode against the same PR head SHA.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

# soldr#1985 — superseded PR runs used to keep holding runner slots while a
# fresh 21-job sweep queued behind them; five concurrent CI runs were observed
# stacked on main alone. That self-inflicted load is what pushed ubuntu-24.04
# queues to 20-30 min, which in turn delayed the cross-builds that gate the
# macOS target-runs (one waited 83m40s to do 117s of work).
#
# Pushes to main are never cancelled: auto-release.yml triggers on push-to-main
# (Cargo.toml / package.json), so every commit that lands must stay fully tested.
concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # zackees/ci.yml#6: every cache this workflow can save in PR context
  # carries `pr-<N>` in its key, so the ci-pre janitor can delete it once
  # the PR closes. Empty outside a pull request, so main keys are
  # unchanged. Enforced by .github/scripts/check_pr_cache_keys.py.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  RUST_BACKTRACE: "1"
  # Direct CI jobs may resolve managed zccache from zackees/zccache.
  # Use soldr's explicit opt-in token env for authenticated release
  # metadata requests without weakening generic cross-repo GITHUB_TOKEN use.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  # CI Pre (zackees/ci.yml#6): the cache janitor and the Actions-cache
  # budget verdict. Deliberately first and deliberately NOT in any job's
  # `needs:`, so a janitor queued behind another sweep never delays a build.
  ci-pre:
    name: CI Pre
    uses: ./.github/workflows/ci-pre.yml
    permissions:
      contents: read
      actions: write
      pull-requests: read

  ci-mode:
    name: CI mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      checkout_sha: ${{ steps.mode.outputs.checkout_sha }}
      author_permission: ${{ steps.mode.outputs.author_permission }}
      # zackees/ci.yml#190 (GATE-008): 'true' only for an attested PR head
      # inside local-gate.toml's [gate.trust] policy. Never 'true' on
      # push/dispatch.
      trusted: ${{ steps.gate.outputs.trusted }}
      # zackees/ci.yml#198 (GATE-010): per job, 'true' only when the head is
      # trusted AND every gate ci-attestations.yml maps to the job carries a
      # stamp-valid `Ci-Attestation:` trailer. Omitted gates run remotely.
      skip_lint: ${{ steps.gate.outputs.skip_lint }}
      skip_build-linux-x64: ${{ steps.gate.outputs.skip_build-linux-x64 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: GATE-008 reads the base commit's local-gate.toml
          # and diffs the PR from its merge base; GATE-003 accepts a GitHub
          # "Update branch" merge head through its attested first parent.
          fetch-depth: 0
      # The selector executes base-repository code, never the PR helper.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .ci-selector
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      # zackees/ci.yml#166 (GATE-002/003): every other job needs this one, so
      # a PR head that never passed the local gate (`ci-lint local-gate run`,
      # which stamps a tree-bound `Local-Gate:` trailer) fails here in
      # seconds instead of spending the platform fan-out to learn what a
      # local run would have said. The ref is ci/local_gate.py's CI_LINT_REF
      # (tests/test_local_gate_wiring.py keeps the two in step).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/ci.yml
          ref: 29087cb90ddebb84cd5f4b2e0f85380e76c743e5
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Local gate attestation
        id: gate
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output
      - name: Select mode and verify checkout
        id: mode
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci-selector/.github/scripts/ci_mode.py --candidate-sha "$CANDIDATE_SHA" --checked-out-sha "$(git rev-parse HEAD)"

  path-selection:
    name: CI path selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .ci-policy
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - name: Select path-scoped CI jobs
        id: select
        run: uv run --no-project --python 3.13 python .ci-policy/.github/scripts/ci_path_policy.py

  # A Markdown-only PR must still report a lint verdict. Keep this no-op
  # separate from the real Lint job so docs do not allocate the toolchain and
  # platform fan-out that they cannot affect (soldr#3318).
  #
  # The display name must stay distinct from the real job's `Lint`. Two jobs
  # sharing a display name makes `ci-lint reuse-check` fail closed on every
  # run: it requires *every* job carrying a required name to conclude success,
  # so this sibling's by-design skip read as `required-job-not-success` and
  # soldr measured 0% reuse and was written off as a non-adopter
  # (zackees/ci.yml#320). The old comment said this name existed to satisfy
  # "the protected `Lint` context", but main carries no branch protection and
  # no ruleset, so nothing requires that name any more. Every consumer here
  # (`needs.lint.*`) refers to the job id, not this display name.
  lint-docs:
    name: Lint (docs no-op)
    needs: [ci-mode, path-selection]
    if: ${{ needs.ci-mode.outputs.mode != 'full' && (needs.path-selection.outputs.docs_only == 'true' || needs.ci-mode.outputs.skip_lint == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "documentation-only change or attested head (GATE-008, see CI mode) — canonical CI Lint satisfied"

  lint:
    name: Lint
    needs: [ci-mode, path-selection]
    if: ${{ (needs.ci-mode.outputs.mode == 'full' || needs.path-selection.outputs.docs_only != 'true') && needs.ci-mode.outputs.skip_lint != 'true' }}
    # Run on every push to main AND on every PR — without this PRs slip
    # in unformatted code that breaks main's Lint job on merge. Repeated
    # 4 times in late 2026-06 (#1111/#1114/#1115/#1120 fallout), each
    # requiring a chase-PR to unbreak main. PR-side Lint failure is the
    # cheap fix; required-status branch protection is the structural
    # fix and lives in repo settings.
    runs-on: ubuntu-24.04
    # soldr#1978: bounded, but it had no headroom and was cancelling healthy
    # runs. Measured over the last 20 ci.yml runs:
    #
    #   succeeded  5m00s .. 9m51s
    #   cancelled  6 of the last 7, all at ~10m -- the timeout itself
    #
    # A 10-minute bound against a 9m51s observed max is 1.02x. Every slow run
    # died on whichever step held the clock (always the last Dylint one), so
    # the gate read as a Dylint flake rather than as its own timeout, and it
    # got merged past repeatedly -- which is the real cost: an always-red gate
    # teaches people to ignore it.
    #
    # The job grew into this: the Dylint boundary steps, and the five Python
    # lint gates added in #2103/#2105/#2108/#2109/#2119, each cost 30-60s.
    #
    # 30 is ~3x the observed non-Rust maximum. `verify_ci_job_timeouts.py`
    # states the rule this restores: "a too-low timeout that kills a healthy
    # long build is worse than the 360-minute default".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
          submodules: recursive
          # soldr#1966: the line-ceiling ratchet below needs `git merge-base`,
          # which the default depth-1 checkout cannot compute.
          fetch-depth: 0

      - name: Enlarge swap (OOM headroom)
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#1248/#2 follow-up: cache + soldr-cook stay disabled on
      # Lint while target/profile-shaped cook restore is reintroduced in
      # the cross/release lanes first. Restore-from-git workaround that
      # paired with the old cook flow is no longer needed because the
      # manifest is never overwritten.
      # soldr#1340 — pre-cache the 1.98.1 toolchain in ~/.rustup so
      # setup-soldr uses it (Setup soldr build cache drops from ~22 s
      # to ~2 s). Same pattern as #1341/#1342/#1343. Shared cache key
      # across all soldr workflows.
      # soldr#1966 — the 1,500-line ceiling was enforced only by a
      # PostToolUse hook, which fires for agent edits and nothing else, so
      # files drifted past it by every other route and the cost landed on
      # whichever agent next had to touch one. A ratchet rather than a
      # threshold: 13 files are already over, and blocking every PR that
      # touches them would be worse than the drift. Runs before the
      # expensive toolchain setup so an oversized diff fails in seconds.
      # soldr#2763: uv must exist before the first step that uses it. The
      # guard steps below run through `uv run --python 3.13` so the Lint job
      # has one pinned interpreter rather than whatever `python3` the runner
      # image ships; installing uv here is what makes that possible.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}

      # soldr#3024: check_nextest_bare_cargo.py (in the gate below) needs rg.
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep

      # zackees/ci.yml#166 (GATE-001): every Lint check lives in
      # ci/local_gate.py, and this job runs exactly its `lint` lane and
      # nothing else, so the remote Lint job is a subset of the local gate an
      # author ran before pushing (`ci-lint local-gate run`). Add a new check
      # to ci/local_gate.py, never as a step here -- `ci-lint local-gate lint`
      # (itself one of the gate's checks) fails a step that is not the gate.
      # The checks' history and rationale (soldr#1966, #2013, #2102, #2763,
      # #2945, #3024, #3284, ...) moved with them into ci/local_gate.py.
      - name: Local gate (lint lane)
        run: uv run --no-project --python 3.13 python ci/local_gate.py --lane lint

      # Rustfmt, Clippy, doctests, dependency policy, and all Dylint
      # domains run once in build-linux-x64 through `soldr ci-test`
      # (soldr#2868), preventing duplicate parallel compiler domains.

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    # Stage 2 of the serial gate (owner directive, 2026-09-04): Lint ->
    # this job -> everything else. `soldr ci-test` runs here and its DAG
    # already contains the Dylint stage (stable Clippy -> Dylint libraries
    # -> workspace analysis / nextest / doctests), so a Dylint or test
    # failure stops the run before a single cross-build lane starts.
    # soldr#1258 once removed `needs: lint` to save ~130 s of wallclock;
    # that trade was reversed because a red Lint left ten cross-build lanes
    # burning runner minutes on a run that was already dead.
    # soldr#1676/#1703: x86_64 GNU is the canonical native exception: run the
    # complete workspace suite directly on its native runner. The other seven
    # canonical targets independently replay their complete archives.
    # No `if:` guard: every downstream job hangs off this one, so it must
    # run on workflow_dispatch as well as on main pushes and PRs.
    needs: [ci-mode, path-selection, lint]
    if: ${{ always() && (needs.ci-mode.outputs.mode == 'full' || needs.path-selection.outputs.docs_only != 'true') && (needs.lint.result == 'success' || needs.ci-mode.outputs.skip_lint == 'true') && needs.ci-mode.outputs.skip_build-linux-x64 != 'true' }}
    # zackees/ci.yml#198 phase 4: the called workflow lists cache keys
    # (GET only) to restore the nearest attested Tier-2 store.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      # No `source_driver_artifact_name`: under the serial gate the bootstrap
      # producer (e2e-cross-bootstrap-soldr) runs AFTER this job, so its
      # artifact can never exist yet and the opportunistic download only
      # ever logged "Artifact not found". The host builds its driver from
      # source, which is what the fallback did anyway.

  pep517-daemon-smoke:
    name: PEP 517 daemon smoke (${{ matrix.name }})
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    runs-on: ${{ matrix.runner }}
    # Includes native wheel compilation plus 3m and 15m inner smoke limits.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # PEP 517 is a public wheel boundary. This job currently has one
      # Windows x64 leg; the macOS full-mode jobs below replay test archives
      # but do not run this wheel smoke.
      matrix:
        include: ${{ fromJSON('[{"name":"windows-x64","runner":"windows-2025","python":"3.13t"}]') }}
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
          submodules: recursive

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install rustup 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          toolchain: 1.98.1
          # soldr#2451: `cache: false` does not gate setup-soldr's soldr-mini /
          # solo-toolchain / build-cache layers, so these lanes still restored a
          # cached soldr 0.8.29 + buildcache-v2. This repo IS soldr — no self-
          # build lane may reuse a prebuilt soldr binary. Turn every layer off.
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          zccache-seed-strict: true

      # soldr#3047 retired this cache. Measured 2026-09-01, the pep517 family
      # held 3.98 GiB across 10 entries (0.82 GiB live on `main` alone across
      # the two shared keys), which is the single largest remaining consumer
      # after the cross-build retirement, and holding it would have forced
      # Phase 0's Tier-2 object store (soldr#3041) below the 2.0 GiB reserved
      # for it in soldr#3039. This is a leaf smoke job on no other lane's
      # critical path, so the cost is a cold `maturin build` here rather than
      # a re-litigated Tier-2 allocation. Note the sibling deletion in
      # `_ci-target-run.yml`, which shares the same key shape.

      # soldr#3123: build the wheel under test through the checked-out PEP 517
      # backend (`PYTHONPATH=src`, no build isolation) with the profile and
      # target dir pinned. The shim smoke at the end of this job builds the
      # same checkout through the same backend, profile and target dir, so
      # cargo finds the graph fresh there instead of recompiling it (~12 min
      # when the profiles or linker env differed). `--no-deps` keeps `dist/`
      # to the one wheel `pep517_daemon_smoke.py` expects.
      - name: Build soldr wheel under test
        shell: pwsh
        env:
          PYTHONPATH: src
          SOLDR_PEP517_PROFILE: ci-release
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/install_soldr_maturin.py
          python -m pip wheel . --no-deps --no-build-isolation --no-cache-dir --wheel-dir dist

      - name: Run downstream PEP 517 daemon smoke
        shell: pwsh
        env:
          SOLDR_DAEMON_REQUIRED: "1"
          SOLDR_DAEMON_SPAWN_RETRY_BUDGET_MS: "5000"
        run: >-
          python .github/scripts/pep517_daemon_smoke.py
          --wheel "dist/*.whl"
          --timeout 900
          --log-dir "${{ runner.temp }}/pep517-soldr-logs"

      - name: Upload PEP 517 Soldr logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pep517-soldr-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/pep517-soldr-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Build source wheel with installed shims first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python .github/scripts/source_wheel_shim_smoke.py
          --wheel "dist/*.whl"
          --source .
          --timeout 900
          --require-free-threaded

  # Linux builds the macOS target archives. Explicit ci-test/ci-full and
  # exact-SHA release validation replay them on hosted native macOS runners.

  # build-windows-{x64,arm64} removed. The unit-test sweep for
  # windows runs on linux x86 via `build-linux-x64` (target-
  # independent logic); the `e2e-windows-{x64,arm64}` lanes below
  # cover windows-runtime behavior via the cross-built binary
  # downloaded onto the windows runner. ONE windows runner per
  # arch — goal of the consolidation pass.

  # Platform work runs in full mode only. The Linux x64 prescribed host gate
  # above remains on every ordinary PR and main push. `ci-full` overrides the
  # older path policies, which cannot silently skip a full-mode target.
  e2e-linux-x64:
    name: build
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' }}
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}

  # Keep the platform policy output for the target fan-out; full mode forces
  # both outputs true, including on a PR with the older fast-build label.
  windows-e2e-policy:
    name: Windows E2E policy
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_windows_e2e: ${{ steps.policy.outputs.run_windows_e2e }}
      run_platform_e2e: ${{ steps.policy.outputs.run_platform_e2e }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
          fetch-depth: 0
      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - name: Classify Windows E2E requirement
        id: policy
        run: uv run --no-project --python 3.13 python .github/scripts/windows_e2e_policy.py --full

  # soldr#1248: darwin/MSVC cross-build lanes need a current in-tree
  # host soldr to drive the blessed `soldr build --target ...` surface.
  # Building that binary inside each lane turns a cache miss into three
  # identical ~5 minute compiles. Restore/build it once, then fan out the
  # resulting artifact to those lanes.
  e2e-cross-bootstrap-soldr:
    name: bootstrap soldr for darwin/msvc cross-builds
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' }}
    runs-on: ubuntu-24.04
    # Bounds the shared prerequisite; cold-cache successes are normally under 3m.
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}

      - name: Restore rustup 1.98.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-1.98.1-linux-x64-v1

      - name: Install rustup 1.98.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)

      # zackees/ci.yml#6: an immutable download shared with main -- a PR
      # restores main's entry but never saves its own copy.
      - name: Save rustup 1.98.1 cache
        if: github.event_name != 'pull_request' && steps.rustup_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu
          key: rustup-1.98.1-linux-x64-v1

      - name: Restore cached bootstrap soldr binary
        id: bootstrap_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin
          # soldr#2451: key on the commit SHA, NOT hashFiles('crates/**', ...).
          # The bootstrap binary IS the `soldr build` driver that spawns the
          # broker on every cross lane, so it must always be built from HEAD.
          # hashFiles() over crates/ + the manifests EXCLUDES `_vender/**`
          # submodule content, so a submodule-only broker bump (running-process
          # #947's XDG_RUNTIME_DIR fix arrived as submodule bump #2449;
          # zccache #1363 as #2447) left this key UNCHANGED and served a
          # pre-fix driver from cache. Run 31449864708 got a cache HIT on the
          # #2448 binary and drove every cross lane with a pre-#947 broker →
          # "broker is unreachable (os error 2)". `github.sha` changes on every
          # commit (including submodule-only bumps), so the driver can never be
          # stale; same-SHA re-runs still hit. This dev-profile binary is also
          # the exact build shape used by prescribed host validation, so the
          # same-run artifact can replace that lane's local source build.
          key: bootstrap-soldr-blessed-linux-gnu-dev-v1${{ env.PR_CACHE_TAG }}-${{ needs.ci-mode.outputs.checkout_sha }}

      # No dependency cache for this build. soldr#3016/#3047 kept a
      # Swatinem/rust-cache here as the last `cook-unreachable-lane`
      # exception; zackees/ci.yml CACHE-025 bans it with no exceptions
      # (maintainer decision 2026-10-02), so the bootstrap driver now builds
      # uncached on a binary-cache miss. Cook still cannot reach it: the build
      # runs bare `cargo build` with RUSTC_WRAPPER emptied and the job has no
      # setup-soldr step (soldr#2451).
      - name: Build bootstrap soldr
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo build --profile dev --package soldr-cli \
            --bin soldr \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/debug/soldr "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Verify bootstrap soldr
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          "$RUNNER_TEMP/soldr-bin/soldr" --version
          printf '%s\n' "${{ needs.ci-mode.outputs.checkout_sha }}" > "$RUNNER_TEMP/soldr-bin/source-sha"

      - name: Upload bootstrap soldr artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-ci-bootstrap-linux-gnu
          path: ${{ runner.temp }}/soldr-bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # soldr#1051 / #1038: all cross-builds go through the consolidated
  # _ci-cross-build-linux.yml workflow on ubuntu-24.04. Each pair
  # below is "cross-build on linux + target-run on native runner".
  # The windows-host cross-compile regression that lived here previously
  # was dropped per the #1051 acceptance — saves a scarce-runner job
  # and the same path is exercised locally via `ci/docker-*` harnesses.

  # ---------- Linux x64 (gnu) — glibc floor only ----------
  # soldr#2145 / soldr#1060 item 3. x86_64-unknown-linux-gnu is host-native
  # both here and at release, so until now nothing on a PR exercised it
  # through the blessed `soldr build --target` surface -- and it inherited
  # the runner's glibc (2.39) while the cross-built aarch64 artifact got
  # 2.28. This lane covers that gap and, because the reusable workflow
  # already runs the glibc ratchet for `unknown-linux-gnu`, it is what
  # proves the managed-zig detour actually lowers the floor: without it
  # the binary links at 2.39 and the 2.28 ceiling fails.
  #
  # No paired `target-run`: this lane exists for the ABI floor, and the
  # complete workspace suite already runs natively on this exact image in
  # `build-linux-x64`. Adding a replay would be the degenerate same-image
  # build/run split soldr#1978 item 3 is about.
  e2e-linux-x64-gnu-build:
    name: native-build x86_64-unknown-linux-gnu (glibc floor)
    needs: [ci-mode, e2e-cross-bootstrap-soldr]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-x64-gnu
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  # ---------- Linux ARM64 (gnu) ----------
  e2e-linux-arm64-build:
    name: cross-build aarch64-unknown-linux-gnu (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64:
    name: target-run aarch64-unknown-linux-gnu
    needs: [ci-mode, e2e-linux-arm64-build, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      # soldr#2874: this is the only native-ARM64 runner in the matrix, so it
      # is the only place the GNU lifecycle can be prepared on the host shape
      # it targets.
      assert_native_gnu_prepare: true
      require_wasm32_wasip1_threads_materialization: true

  # ---------- Linux x64 (musl) ----------
  # soldr#3316: release inclusion requires runtime evidence for the target,
  # even when the statically linked artifact can execute on the same runner
  # image that cross-built it. The native glibc suite cannot prove that the
  # musl archive selects and executes a non-empty target-specific partition.
  e2e-linux-x64-musl-build:
    name: cross-build x86_64-unknown-linux-musl (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-x64-musl:
    name: target-run x86_64-unknown-linux-musl
    needs: [ci-mode, e2e-linux-x64-musl-build, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl
      # The restored full owned set contains several serial runtime/cold-build
      # groups. One worker timed out several tests, and three workers still
      # left a cold linker fixture at its 120 s deadline. Six fresh workers
      # retain complete coverage without globally capping compilation or
      # weakening those deadlines (soldr#3316).
      replay_partitions: '[{"label":"1-of-6","value":"hash:1/6","run_followup":false},{"label":"2-of-6","value":"hash:2/6","run_followup":false},{"label":"3-of-6","value":"hash:3/6","run_followup":false},{"label":"4-of-6","value":"hash:4/6","run_followup":false},{"label":"5-of-6","value":"hash:5/6","run_followup":false},{"label":"6-of-6","value":"hash:6/6","run_followup":false}]'
      require_wasm32_wasip1_threads_materialization: true

  # ---------- Linux ARM64 (musl) ----------
  e2e-linux-arm64-musl-build:
    name: cross-build aarch64-unknown-linux-musl (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64-musl:
    name: target-run aarch64-unknown-linux-musl
    needs: [ci-mode, e2e-linux-arm64-musl-build, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl
      require_wasm32_wasip1_threads_materialization: true

  # ---------- macOS x64 ----------
  # Full CI uses a hosted Intel Mac to replay the Linux cross-built archive.
  # Routine PR/main runs remain Linux-only; this lane runs only in full mode.
  e2e-macos-x64-build:
    name: cross-build x86_64-apple-darwin (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu
      upload_test_archive: true

  e2e-macos-x64:
    name: run x86_64-apple-darwin archive (macOS Intel)
    needs: [ci-mode, e2e-macos-x64-build]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.e2e-macos-x64-build.result == 'success' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      target: x86_64-apple-darwin
      runs_on: macos-15-intel
      artifact_name: soldr-ci-e2e-macos-x64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      extended_replay: true

  # ---------- macOS ARM64 ----------
  # Full CI uses a hosted ARM Mac to replay the Linux cross-built archive.
  e2e-macos-arm64-build:
    name: cross-build aarch64-apple-darwin (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu
      upload_test_archive: true

  e2e-macos-arm64:
    name: run aarch64-apple-darwin archive (macOS ARM)
    needs: [ci-mode, e2e-macos-arm64-build]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' && needs.e2e-macos-arm64-build.result == 'success' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      target: aarch64-apple-darwin
      runs_on: macos-15
      artifact_name: soldr-ci-e2e-macos-arm64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      extended_replay: true

  # ---------- Windows x64 ----------
  e2e-windows-x64-build:
    name: cross-build x86_64-pc-windows-msvc (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-x64:
    name: target-run x86_64-pc-windows-msvc
    needs: [ci-mode, e2e-windows-x64-build]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: windows-2025
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64
      # soldr#3122 — the single `hash:1/1` replay ran ~serially (aarch64:
      # 477 s of test time over 721 s wall) because the runtime/cold-build
      # test groups are `max-threads = 1`; three fresh workers cut the
      # critical-path tail by ~8 min. Neither lane enables
      # `run_pep517_smoke`, so `run_followup: false` drops nothing.
      replay_partitions: '[{"label":"1-of-3","value":"hash:1/3","run_followup":false},{"label":"2-of-3","value":"hash:2/3","run_followup":false},{"label":"3-of-3","value":"hash:3/3","run_followup":false}]'
      require_wasm32_wasip1_threads_materialization: true

  # ---------- Windows x64 (GNU) ----------
  # soldr#2336: the Linux-hosted MinGW bundle is a blessed canonical target.
  # Replay the resulting PE binaries on the same native Windows runner class
  # as MSVC; the ABI is a build-toolchain choice, not a separate host class.
  e2e-windows-x64-gnu-build:
    name: cross-build x86_64-pc-windows-gnu (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-gnu
      artifact_name: soldr-ci-e2e-windows-x64-gnu
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-x64-gnu:
    name: target-run x86_64-pc-windows-gnu
    needs: [ci-mode, e2e-windows-x64-gnu-build]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: windows-2025
      target: x86_64-pc-windows-gnu
      artifact_name: soldr-ci-e2e-windows-x64-gnu
      # The full native GNU archive replay needs more than the shared 30-minute
      # target-run default after cold Cargo front doors are serialized (#2701).
      extended_replay: true
      require_wasm32_wasip1_threads_materialization: true
      # Fixture-local cache roots persist for a test process lifetime. Three
      # fresh workers keep each shard below hosted Windows disk capacity while
      # hash partitioning still covers the complete archive exactly once (#2704).
      replay_partitions: '[{"label":"1-of-3","value":"hash:1/3","run_followup":false},{"label":"2-of-3","value":"hash:2/3","run_followup":false},{"label":"3-of-3","value":"hash:3/3","run_followup":false}]'

  # ---------- Windows ARM64 ----------
  # soldr#1524: the managed ARM64 xwin cache and zlib-ng catalogue row
  # make this the same blessed build + nextest archive path as x64 MSVC.
  e2e-windows-arm64-build:
    name: cross-build aarch64-pc-windows-msvc (linux host)
    needs: [ci-mode, e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-arm64:
    name: target-run aarch64-pc-windows-msvc
    needs: [ci-mode, e2e-windows-arm64-build]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      runs_on: windows-11-arm
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
      # soldr#3122 — the single `hash:1/1` replay ran ~serially (aarch64:
      # 477 s of test time over 721 s wall) because the runtime/cold-build
      # test groups are `max-threads = 1`; three fresh workers cut the
      # critical-path tail by ~8 min. Neither lane enables
      # `run_pep517_smoke`, so `run_followup: false` drops nothing.
      replay_partitions: '[{"label":"1-of-3","value":"hash:1/3","run_followup":false},{"label":"2-of-3","value":"hash:2/3","run_followup":false},{"label":"3-of-3","value":"hash:3/3","run_followup":false}]'
      require_wasm32_wasip1_threads_materialization: true

  # ---------- `soldr wheel` cross-verification (soldr#2139 acceptance) ----------
  #
  # soldr#2139 asked for a blessed wheel surface; #2291 shipped the verb but
  # nothing ever produced a wheel through it, and `verify_wheel_glibc.py` --
  # which exists because "the tag is a claim" -- had never been pointed at its
  # output. This pair is that acceptance check: build a real release wheel via
  # `soldr wheel --release --target aarch64-unknown-linux-gnu` (a cross wheel
  # from an x86_64 Linux host, the issue's actual criterion), assert the
  # filename carries the manylinux_2_17 tag, then read the embedded binary's
  # ELF and prove the tag matches the bytes.
  #
  # Cost (soldr#1978): this is one extra ubuntu-24.04 runner doing a full
  # cross compile. Full mode always selects the wheel matrix; minimal mode
  # skips the policy job and the build job before allocating either runner.
  wheel-cross-policy:
    name: wheel lane policy
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
          fetch-depth: 0
      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - name: Select wheel lane matrix
        id: policy
        run: uv run --no-project --python 3.13 python .github/scripts/wheel_lane_policy.py --full

  wheel-cross-verify:
    name: soldr wheel --target ${{ matrix.target }} (tag vs bytes)
    needs: [ci-mode, wheel-cross-policy, e2e-cross-bootstrap-soldr]
    # An empty matrix schedules zero jobs. See wheel_lane_policy.py.
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.wheel-cross-policy.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    # Cross-compiling the whole workspace cold, plus catalogue sysroot download.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.wheel-cross-policy.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      # soldr#2453/#2469: this is a cache-disabled, all-miss release+LTO build.
      # Two concurrent rustc processes still OOM-killed zccache-daemon-core on
      # the 4-vCPU hosted runner, so the policy matrix carries the measured
      # per-cell memory bound.
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      SOLDR_JOBS: ${{ matrix.jobs }}
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install rustup 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)

      - name: Add ${{ matrix.target }} rust target
        run: rustup target add ${{ matrix.target }} --toolchain 1.98.1  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)

      # Reuse the shared bootstrap binary rather than compiling a fourth copy
      # of soldr; this lane is about what `soldr wheel` does, not about
      # building soldr.
      - name: Download shared bootstrap soldr artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: soldr-ci-bootstrap-linux-gnu
          path: ${{ runner.temp }}/soldr-bin

      # zackees/ci.yml#209 (CACHE-025) retired the Swatinem/rust-cache step
      # that used to restore `wheel-cross-<target>-release-v1` here. Unlike
      # the bootstrap driver, this lane HAS a soldr (the shared bootstrap
      # artifact above), so the bootstrap carve-out does not apply. The lane
      # is now uncached across runs, the same outcome soldr#3047 chose for
      # the pep517 wheel lane: it runs only under `ci-full` or a
      # wheel-relevant change, and it canaries the release helper's exact
      # `--locked --strip` maturin build, whose cargo env a cook slice would
      # have to reproduce byte for byte to hit. If wall time demands a cache,
      # the sanctioned layer is `zackees/setup-soldr/cook` (tier `cook`),
      # never rust-cache.

      # Deliberately no `pip install maturin` here: provisioning maturin is
      # part of what `soldr wheel` claims to do (it re-enters through the
      # `soldr maturin ...` execution path, which resolves the managed
      # maturin). Pre-installing one would hide a regression in that ladder.

      - name: Setup uv for release wheel canary
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Build the wheel through `soldr wheel`
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/soldr-bin/soldr"
          chmod +x "$driver"
          "$driver" --version
          # The verb under test. `--release` is opt-in as of the #2139
          # follow-up, and a release linux-gnu build -- cross or, since
          # soldr#3432, host target -- is the shape in which soldr claims a
          # manylinux floor, because `target_lifecycle::prepare_for_invocation`
          # ran and mounted the catalogue sysroot that creates the floor.
          #
          # allow-release: the release profile is precisely what is under test here -- a manylinux tag is only claimed on a release cross build, so a cheaper profile would verify a wheel in a shape soldr never claims a floor for (soldr#1981 second criterion).
          # Canary the exact release helper, including --locked, --strip,
          # output selection and version validation (#3436), without publish.
          version="$("$driver" --version)"
          uv run --no-project --python 3.13 .github/scripts/prepare_release_wheel.py \
            --target "${{ matrix.target }}" --runner-os Linux \
            --expected-version "${version#soldr }" \
            --driver-dir "$RUNNER_TEMP/soldr-bin"

      - name: Assert the wheel filename carries the expected tags
        shell: python
        env:
          EXPECTED_TAG: ${{ matrix.expected_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          import os
          import sys
          from pathlib import Path

          expected = os.environ["EXPECTED_TAG"]
          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("`soldr wheel` produced no wheel in dist/")

          # soldr's wheel has no PyO3 extension module -- soldr-cli's [lib] is
          # a plain rlib and the wheel ships a `[[bin]]` plus a pure-Python
          # package. maturin therefore emits `py3-none-<platform>`, NOT
          # `cp3xx-abi3-<platform>`. `abi3` in `soldr wheel` names the *scope
          # gate* (it refuses builds that would need a target-side CPython),
          # not a tag this particular project's wheel carries. Asserting the
          # tag maturin actually emits is what makes this a gate; asserting a
          # tag that cannot appear would only ever fail.
          bad = [w.name for w in wheels if expected not in w.name]
          if bad:
              sys.exit(
                  f"wheel(s) missing the {expected} platform tag: {bad}\n"
                  "soldr claimed this floor because the build was a release\n"
                  "linux-gnu wheel, so `target_lifecycle::prepare_for_invocation`\n"
                  "ran (host target included, soldr#3432).\n"
                  "A different tag means maturin re-derived it from the bytes,\n"
                  "i.e. the catalogue sysroot did not take effect."
              )
          untagged = [w.name for w in wheels if "-py3-none-" not in w.name]
          if untagged:
              sys.exit(
                  f"unexpected Python/ABI tag: {untagged}\n"
                  "This wheel is bin-bindings + pure Python, so maturin emits\n"
                  "py3-none-*. A cp3xx-abi3-* name means the project grew an\n"
                  "extension module and this assertion needs revisiting."
              )
          print(f"tag assertion OK ({expected}): {[w.name for w in wheels]}")

      # The step above reads the NAME. This one reads the BYTES. A wheel
      # tagged manylinux_2_17 whose binary needs GLIBC_2.39 is worse than an
      # untagged one: pip trusts the tag, installs it on Debian 12, and the
      # program dies at run time. See soldr#1060.
      - name: Verify the embedded binary honours the claimed floor
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_wheel_glibc.py \
            --max-glibc "${{ matrix.max_glibc }}" dist/*.whl

      - name: Smoke the release helper's host wheel
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          version="$("$RUNNER_TEMP/soldr-bin/soldr" --version)"
          uv run --no-project --python 3.13 .github/scripts/smoke_release_wheel.py \
            --expected-version "${version#soldr }"

      - name: Upload the wheel for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: warn
          retention-days: 7

      # soldr#3347: record per-path input sizes before rust-cache's post job.
      - name: Inventory wheel rust-cache inputs
        if: success()
        run: bash .github/scripts/cache_path_inventory.sh "${{ matrix.target }}"

  # soldr#3276 §6: dogfooding proof. `build-linux-x64` already builds this
  # repo with `[workspace.metadata.soldr] linker = "reld"` declared in its
  # own Cargo.toml (soldr's own build is the dogfood), but that alone proves
  # only that the build succeeded -- not that reld was actually fetched and
  # linked with an absolute path, nor that `--cfg tokio_unstable` (this
  # repo's own `[build] rustflags`) survived being combined with the reld
  # linker injection. This job re-links soldr-cli under `-v` and inspects
  # the rustc invocation directly. Informational only (not in
  # `full-coverage`'s `needs:`): a transient failure here must not block
  # merges on top of the real build-linux-x64 signal.
  reld-dogfood-proof-linux:
    name: reld dogfood proof (linux x64)
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' && needs.build-linux-x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - name: Install rustup 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update  # ci-lint: allow RUST-001 bootstrap: pre-seeds ~/.rustup before setup-soldr puts soldr on PATH (soldr#1340)
      - name: Build local soldr driver
        run: cargo build -p soldr-cli  # ci-lint: allow RUST-001 bootstrap: builds soldr from source before any soldr exists in this job
      - name: Prove reld resolves to an absolute path and tokio_unstable survives
        run: |
          uv run --no-project --python 3.13 python \
            .github/scripts/reld_dogfood_proof.py --soldr-bin target/debug/soldr

  # soldr#3276 §6 live-acceptance gap: prior evidence (soldr#3356) covered
  # only Linux x64. reld bridges to lld-link on Windows MSVC and ld64.lld on
  # macOS (driven through clang `--ld-path`, soldr#3359; see
  # `crates/soldr-cli/src/linker.rs` `LinkerChoice::Reld`), so it is meant to support these hosts -- this
  # exercises a real, network-touching `SOLDR_LINKER=reld` fetch + link on
  # each native runner, using the already cross-built soldr binary from the
  # matching e2e lane rather than paying for a second native build.
  # Informational only, same reasoning as reld-dogfood-proof-linux above.
  reld-live-fetch-windows-x64:
    name: reld live fetch (windows x64)
    needs: [ci-mode, e2e-windows-x64-build]
    if: ${{ needs.ci-mode.outputs.mode == 'full' && needs.e2e-windows-x64-build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: soldr-ci-e2e-windows-x64
          path: dist
      - name: Live SOLDR_LINKER=reld fetch + link probe
        shell: bash
        run: |
          # soldr#3539: the artifact ships soldr once; derive soldr-daemon.
          cp dist/package/soldr.exe dist/package/soldr-daemon.exe
          uv run --no-project --python 3.13 python \
            ci/reld_live_fetch_probe.py --soldr-bin dist/package/soldr.exe

  reld-live-fetch-macos-arm64:
    name: reld live fetch (macos arm64)
    needs: [ci-mode, e2e-macos-arm64-build]
    if: ${{ needs.ci-mode.outputs.mode != 'minimal' && needs.e2e-macos-arm64-build.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.ci-mode.outputs.checkout_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: soldr-ci-e2e-macos-arm64
          path: dist
      - name: Live SOLDR_LINKER=reld fetch + link probe
        run: |
          # soldr's own daemon spawn needs the sidecar binary executable too
          # (soldr#3276 §6 CI iteration: a daemon spawn "Permission denied"
          # on macOS traced back to only `soldr` itself being chmod +x'd).
          # soldr#3539: the artifact ships soldr once; derive soldr-daemon.
          cp dist/package/soldr dist/package/soldr-daemon
          chmod +x dist/package/soldr dist/package/soldr-daemon
          uv run --no-project --python 3.13 python \
            ci/reld_live_fetch_probe.py --soldr-bin dist/package/soldr

  # Expensive smoke gates belong to the full candidate graph. Both are
  # required by Full coverage; routine events never allocate these runners.
  setup-soldr-action:
    name: Setup soldr action smoke
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/setup-soldr-action.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}

  cook-size-gate:
    name: Cook size gate
    needs: [ci-mode, build-linux-x64]
    if: ${{ needs.ci-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/cook-size-gate.yml
    with:
      source_ref: ${{ needs.ci-mode.outputs.checkout_sha }}

  macos-recovery-replay:
    name: macOS Recovery replay
    needs: ci-mode
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'macos-replay' }}
    uses: ./.github/workflows/macos-recovery-replay.yml
    secrets: inherit

  # ---------- Cancel-on-first-failure sentinels (soldr#3037 follow-up) ----------
  #
  # GHA has no built-in "cancel the whole run on first failure". The run
  # is shaped in two layers to get as close as `needs:` allows:
  #
  #   1. A serial gate (owner directive, 2026-09-04): lint -> build-linux-x64
  #      (`soldr ci-test`, whose DAG includes Dylint) -> every other root
  #      job. Lint is minutes, the host validation is the deepest gate, and
  #      nothing else starts until both are green, so their failures need
  #      no sentinel at all: downstream jobs simply never become eligible.
  #      The former lint / host-validation sentinels were deleted with that
  #      change.
  #   2. The two sentinels below cover the early-deciders that DO fan out:
  #      e2e-cross-bootstrap-soldr (feeds 8 cross-build lanes + wheel
  #      verify) and e2e-linux-x64 (the proof-of-life target run). Both
  #      start in parallel with the other stage-3 roots, so a failure there
  #      still has live siblings worth cancelling.
  #
  # `needs:` is an AND-wait, so one sentinel listing both would fire no
  # sooner than the slower of the two; GHA has no `needs: A OR B`, hence
  # one small job per early-decider.
  #
  # `strategy.fail-fast` (see `pep517-daemon-smoke` and `wheel-cross-verify`,
  # both `fail-fast: false`) only governs legs WITHIN one matrix and stays
  # untouched -- each wants every platform leg reported.
  # `concurrency.cancel-in-progress` at the top of this file cancels a
  # PREVIOUS run of the same ref; it says nothing about sibling jobs of
  # the SAME run.
  #
  # Left out on purpose: windows-e2e-policy and wheel-cross-policy are
  # matrix-selection jobs; a failure leaves their outputs unset, so every
  # job gated on `needs.<policy>.outputs.* == 'true'` skips on its own.
  #
  # PR-only (github.event_name == 'pull_request'): cancelling a `main` push
  # destroys the post-merge validation record -- this repo has already lost
  # a comparison baseline that way. auto-release.yml also triggers off
  # push-to-main, so every commit on main must run CI to completion.
  #
  # Branch protection (checked 2026-09-02): main carries NO required status
  # checks (`gh api repos/zackees/soldr/branches/main/protection` -> 404,
  # rulesets -> []), so a cancelled job cannot leave a PR permanently
  # unmergeable today. If a required check is ever configured on a job a
  # sentinel can cancel, a cancelled run becomes a permanently red PR --
  # a real risk from that point on, not mitigated here.
  #
  # `gh run cancel` needs `actions: write`, scoped per sentinel job rather
  # than widening the workflow-level `permissions: contents: read`. On a
  # fork PR GITHUB_TOKEN is force-read-only, so the call returns 403 and
  # the sentinel goes red -- harmless, the run was already failing.
  #
  # No `.github/scripts/*.py` here: each step is one `gh run cancel` call
  # with no branching, looping, or parsing (see CLAUDE.md's "GitHub Actions
  # workflow conventions").

  full-coverage:
    name: Full coverage
    needs: [ci-mode, lint, build-linux-x64, pep517-daemon-smoke, e2e-linux-x64, windows-e2e-policy, e2e-cross-bootstrap-soldr, e2e-linux-x64-gnu-build, e2e-linux-arm64-build, e2e-linux-arm64, e2e-linux-x64-musl-build, e2e-linux-x64-musl, e2e-linux-arm64-musl-build, e2e-linux-arm64-musl, e2e-macos-x64-build, e2e-macos-x64, e2e-macos-arm64-build, e2e-macos-arm64, e2e-windows-x64-build, e2e-windows-x64, e2e-windows-x64-gnu-build, e2e-windows-x64-gnu, e2e-windows-arm64-build, e2e-windows-arm64, wheel-cross-policy, wheel-cross-verify, setup-soldr-action, cook-size-gate]
    if: ${{ always() && needs.ci-mode.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
      EXPECTED_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      SELECTED_SHA: ${{ needs.ci-mode.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Policy and contracts come from reviewed base code.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python3 .github/scripts/ci_full_coverage.py --expected-sha "$EXPECTED_SHA" --selected-sha "$SELECTED_SHA" --report "$RUNNER_TEMP/full-coverage.json"
      - name: Upload candidate-bound full coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-full-coverage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-coverage.json
          retention-days: 7
          if-no-files-found: warn

  # This stable merge context runs even when the selector or a required cell fails.
  ci-summary:
    name: CI summary
    needs: [ci-mode, lint, build-linux-x64, pep517-daemon-smoke, e2e-linux-x64, windows-e2e-policy, e2e-cross-bootstrap-soldr, e2e-linux-x64-gnu-build, e2e-linux-arm64-build, e2e-linux-arm64, e2e-linux-x64-musl-build, e2e-linux-x64-musl, e2e-linux-arm64-musl-build, e2e-linux-arm64-musl, e2e-macos-x64-build, e2e-macos-x64, e2e-macos-arm64-build, e2e-macos-arm64, e2e-windows-x64-build, e2e-windows-x64, e2e-windows-x64-gnu-build, e2e-windows-x64-gnu, e2e-windows-arm64-build, e2e-windows-arm64, wheel-cross-policy, wheel-cross-verify, setup-soldr-action, cook-size-gate, lint-docs, path-selection, full-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
      CI_MODE: ${{ needs.ci-mode.outputs.mode }}
      CI_TRUSTED: ${{ needs.ci-mode.outputs.trusted }}
      DOCS_ONLY: ${{ needs.path-selection.outputs.docs_only }}
      AUTHOR_PERMISSION: ${{ needs.ci-mode.outputs.author_permission }}
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      SELECTED_SHA: ${{ needs.ci-mode.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Policy and contracts come from reviewed base code.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: python3 .github/scripts/ci_summary.py --adapter ci/summary-contract.json --full-contract ci/canonical-targets.json --report "$RUNNER_TEMP/ci-summary.json"
      - name: Upload merge summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-summary.json
          retention-days: 7
          if-no-files-found: warn

  cancel-on-bootstrap-failure:
    name: Cancel run (bootstrap soldr failed)
    needs: e2e-cross-bootstrap-soldr
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No checkout, so `gh` has no git repo to infer the owner/name from;
      # GH_REPO supplies it (run 33899935849's sentinel died with "failed to
      # determine base repo" and the run kept going).
      - run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  cancel-on-e2e-linux-x64-failure:
    name: Cancel run (e2e-linux-x64 build failed)
    needs: e2e-linux-x64
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No checkout, so `gh` has no git repo to infer the owner/name from;
      # GH_REPO supplies it (run 33899935849's sentinel died with "failed to
      # determine base repo" and the run kept going).
      - run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
