name: Cook Size Gate

# Catches regressions in `soldr cook`'s post-trim output size. Builds soldr,
# runs `soldr cook` against a stable representative fixture (zccache), and
# fails when the resulting `target/` is heavier than the documented baseline
# + a small buffer.
#
# Baseline measured by the gate itself on 2026-05-30 against zccache main
# with soldr 0.7.45 (run https://github.com/zackees/soldr/actions/runs/26680734035):
#
#   - file count                 = 3690
#   - inflated target/ size      = 1269 MiB  (info only — not gated)
#   - compressed tar + zstd -3   = 313 MiB
#
# Defaults trip at ~+33 % of compressed size (415 MiB) and ~+30 % of file
# count (4800). Tunable via workflow_dispatch inputs so a single PR can
# raise them in lockstep with a deliberate baseline change (e.g., adopting
# a heavier bundled tool). For background see issue #571.
#
# Note: the 408 MiB / 7633 figures cited in #571's earlier comments came
# from setup-soldr's cook-cache *restore archive* (which includes its own
# manifest / metadata layer on top of soldr's bare cook output). This gate
# measures the raw post-trim cook output directly, so the numbers diverge.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact candidate SHA selected by canonical CI
        required: true
        type: string
  # Full CI owns automatic invocation; manual smoke runs remain available.
  workflow_dispatch:
    inputs:
      max_compressed_mb:
        description: Maximum allowed compressed tarball size in MiB (baseline ~313)
        required: false
        default: '415'
      max_file_count:
        description: Maximum allowed file count in target/ post-trim (baseline 3690)
        required: false
        default: '4800'

permissions:
  contents: read

concurrency:
  # A called workflow inherits the caller's github.workflow; use a literal
  # prefix so this job cannot cancel the canonical CI run that invoked it.
  group: cook-size-gate-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # zackees/ci.yml#6: every cache this workflow can save in PR context
  # carries `pr-<N>` in its key, so the ci-pre janitor can delete it once
  # the PR closes. Empty outside a pull request, so main keys are
  # unchanged. Enforced by .github/scripts/check_pr_cache_keys.py.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

jobs:
  cook-size-gate:
    name: Measure soldr cook size against zccache fixture
    runs-on: ubuntu-latest
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 30
    steps:
      - name: Checkout soldr
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: soldr
          submodules: recursive

      # soldr#3148 step 1: the compile caps below are rung 4 of CLAUDE.md's
      # ladder; swap is rung 3 and must be in place before any cap is lifted.
      # The script degrades to a warning where swap cannot be enabled.
      - name: Enlarge swap (OOM headroom)
        shell: bash
        working-directory: soldr
        run: bash .github/scripts/setup_ci_swap.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@a07bab94f16124b5c6857b137a237a53a61e06d1
        with:
          # Save caches fully under act (local bosn runs are pull_request events); setup-soldr#537 makes this the default. Remove then.
          save-cache: ${{ env.ACT && 'true' || 'auto' }}
          cook-delta: false
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          toolchain: 1.98.1
          # soldr#2451: `cache: false` alone does NOT gate setup-soldr's
          # soldr-mini / build-cache / target-cache reuse layers, and this
          # lane runs the checkout-built soldr — every layer must be off so
          # a stale restore can never masquerade as the binary under test.
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          zccache-seed-strict: true

      # soldr#1981 — ci-release. This builds only the *tool* that runs `cook`
      # below; the thing the gate measures is cook's output over the zccache
      # fixture, not this binary. The `--release` on `soldr cook --release` is
      # a separate, load-bearing flag and stays.
      # Uncapped (soldr#3148). This build used to run at jobs=1 because the
      # pinned soldr predated soldr#3211: compiler children carried
      # PR_SET_PDEATHSIG, which fired when the spawning tokio thread retired,
      # and rustc for soldr_daemon was SIGTERMed mid-compile in 3 of 4 uncapped
      # runs (soldr#3210, PR #3209). The 0.9.16 pin above carries soldr#3211,
      # so exclusive admission owns concurrency here again. The job log's
      # `soldr: daemon compile concurrency =` line (soldr#3206) shows the
      # limit actually applied.
      - name: Build soldr CLI (ci-release)
        working-directory: soldr
        run: soldr cargo build -p soldr-cli --profile ci-release

      # Pinned to the exact zccache crate version soldr embeds, never `main`
      # (soldr#3301). Two reasons. A moving fixture makes the size thresholds
      # below meaningless: they were measured against one tree and are asserted
      # against whatever zccache happened to merge that morning. And it breaks
      # the gate for every open PR without any of them changing — zccache
      # 03d6ebb removed `vendor/`, and the gate went red on PRs that had passed
      # it hours earlier. `tests/test_cook_size_gate_workflow.py` keeps this ref
      # equal to the `zccache` version in Cargo.lock, so bumping the dependency
      # is what moves the fixture.
      - name: Checkout zccache fixture
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/zccache
          ref: "1.15.5"
          path: zccache-fixture

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          cache-suffix: ${{ env.PR_CACHE_TAG }}

      - name: Prepare zccache fixture path dependencies
        run: >-
          uv run --no-project --python 3.13 python
          soldr/.github/scripts/prepare_cook_fixture.py
          --fixture zccache-fixture

      - name: Install zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          zstd --version

      - name: Run soldr cook against zccache (release profile)
        working-directory: zccache-fixture
        env:
          SOLDR_GITHUB_TOKEN: ${{ github.token }}
          SOLDR_BINARY: ${{ github.workspace }}/soldr/target/ci-release/soldr
          SOLDR_CACHE_DIR: ${{ runner.temp }}/cook-size-soldr
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/cook-size-soldr/cache/zccache
          ZCCACHE_DISABLE: "1"
          CARGO_BUILD_JOBS: "1"
          SOLDR_JOBS: "1"
        run: |
          set -euo pipefail
          # cargo-chef happens in-process via soldr's bundled chef; using
          # --release matches the historical default that the size baseline
          # was measured against.
          "${GITHUB_WORKSPACE}/soldr/target/ci-release/soldr" cook --release

      - name: Measure cook output + assert thresholds
        working-directory: zccache-fixture
        env:
          MAX_COMPRESSED_MB: ${{ github.event.inputs.max_compressed_mb || '415' }}
          MAX_FILE_COUNT: ${{ github.event.inputs.max_file_count || '4800' }}
        run: |
          set -euo pipefail

          if [ ! -d target ]; then
            echo "::error::expected target/ to exist after soldr cook; nothing to measure"
            exit 2
          fi

          FILE_COUNT=$(find target -type f | wc -l | tr -d ' ')
          INFLATED_BYTES=$(du -sb target | cut -f1)
          INFLATED_MB=$((INFLATED_BYTES / 1024 / 1024))

          # Compress with tar+zstd at level 3 — matches setup-soldr's
          # cook-cache save configuration so the threshold tracks the
          # archive size consumers actually pay to upload/restore.
          tar -cf - target | zstd -3 -q -o cook.tar.zst
          COMPRESSED_BYTES=$(stat -c '%s' cook.tar.zst)
          COMPRESSED_MB=$((COMPRESSED_BYTES / 1024 / 1024))

          {
            echo "## soldr cook size gate"
            echo
            echo "Measured against \`zackees/zccache@main\` (release profile)."
            echo
            echo "| Metric | Measured | Threshold |"
            echo "| --- | ---: | ---: |"
            echo "| File count                  | ${FILE_COUNT} | ${MAX_FILE_COUNT} |"
            echo "| Inflated \`target/\` size   | ${INFLATED_MB} MiB | (info only) |"
            echo "| Compressed (tar + zstd -3)  | ${COMPRESSED_MB} MiB | ${MAX_COMPRESSED_MB} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "file_count=${FILE_COUNT}"
          echo "inflated_mb=${INFLATED_MB}"
          echo "compressed_mb=${COMPRESSED_MB}"

          FAIL=0
          if [ "${COMPRESSED_MB}" -gt "${MAX_COMPRESSED_MB}" ]; then
            echo "::error::Compressed cook tarball ${COMPRESSED_MB} MiB exceeds threshold ${MAX_COMPRESSED_MB} MiB (regression suspected; if intentional, raise the threshold via workflow input or bump the default in cook-size-gate.yml)"
            FAIL=1
          fi
          if [ "${FILE_COUNT}" -gt "${MAX_FILE_COUNT}" ]; then
            echo "::error::Cook target/ file count ${FILE_COUNT} exceeds threshold ${MAX_FILE_COUNT} (regression suspected; same tuning path)"
            FAIL=1
          fi
          exit ${FAIL}

      # soldr#3210: the daemon's log and compile journal are what named the
      # SIGTERMed compiler child, and they never reach the job log, so they
      # are uploaded on every run. Same path set as _bootstrap-e2e.yml, rooted at
      # the setup-soldr state dir.
      - name: Upload soldr daemon logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cook-size-gate-soldr-logs
          if-no-files-found: ignore
          # setup-soldr points SOLDR_CACHE_DIR here, not at ~/.soldr.
          # soldr#3152: `cache/soldr-daemon/logs/` carries the daemon's
          # shadow-mode `admission-estimate.jsonl`, which
          # `.github/scripts/fit_memory_estimate.py` joins to the compile
          # journals in this same artifact.
          path: |
            ${{ runner.temp }}/setup-soldr-soldr/logs/
            ${{ runner.temp }}/setup-soldr-soldr/cache/zccache/logs/
            ${{ runner.temp }}/setup-soldr-soldr/cache/zccache/history/**/*.json
            ${{ runner.temp }}/setup-soldr-soldr/cache/zccache/history/**/*.jsonl
            ${{ runner.temp }}/setup-soldr-soldr/cache/soldr-daemon/logs/
