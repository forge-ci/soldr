name: Build all targets from Linux (pinned soldr, zero host toolchain)

# soldr#1309 — the self-hosting proof, now with a real pinned driver.
#
# One ubuntu runner installs a PINNED, previously-released soldr from
# PyPI and drives `soldr build --release --target X` for all 9 targets.
# No in-tree `cargo build` of the driver (the "N-1 builds N" ratchet:
# a released soldr compiles the next one), and — because soldr 0.8.17+
# self-provisions the entire cross toolchain (LLVM from
# zackees/clang-tool-chain-bins, Apple SDK + xwin-cache + cmake/ninja
# from the soldr-toolchain catalogue) — NO host `apt install clang lld
# llvm musl-tools`. soldr is a bootstrapping tool: the runner brings
# only rust + the pinned soldr wheel.
#
# The pin MUST be >= 0.9.5: it contains catalogue v2 support required by the
# non-LFS multipart asset publication. The GNU matrix row supplies its Rust
# triple directly as the N-1 build input.
#
# Dry-run: builds + format-verifies each binary; no packaging/publish.
#
# This is an on-demand operational N-1 sweep. Canonical ci.yml already
# validates the same target catalogue on pull requests (soldr#3318).

on:
  workflow_dispatch:
    inputs:
      soldr_version:
        description: "soldr version from PyPI (default: latest release)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326 / #1328.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-all:
    name: ${{ matrix.alias }} (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { alias: linux-x64,       target: x86_64-unknown-linux-gnu,    exe_suffix: "" }
          - { alias: linux-arm64,     target: aarch64-unknown-linux-gnu,   exe_suffix: "" }
          - { alias: linux-x64-musl,  target: x86_64-unknown-linux-musl,   exe_suffix: "" }
          - { alias: linux-arm64-musl, target: aarch64-unknown-linux-musl, exe_suffix: "" }
          - { alias: mac-x64,         target: x86_64-apple-darwin,         exe_suffix: "" }
          - { alias: mac-arm64,       target: aarch64-apple-darwin,        exe_suffix: "" }
          - { alias: win-x64,         target: x86_64-pc-windows-msvc,      exe_suffix: ".exe" }
          # Use the Rust triple directly for the GNU N-1 build input.
          - { alias: win-x64-gnu,     target: x86_64-pc-windows-gnu,       input: x86_64-pc-windows-gnu, exe_suffix: ".exe" }
          - { alias: win-arm64,       target: aarch64-pc-windows-msvc,     exe_suffix: ".exe" }

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # The hosted image's pre-existing toolchain can contain an untracked
      # cargo-fmt binary that conflicts with rustfmt component preparation
      # (#2703/#836). Establish a fresh pair before rust-toolchain runs so the
      # action and the pinned N-1 driver own the same clean toolchain state.
      - name: Isolate N-1 toolchain homes
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/soldr-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/soldr-rustup" >> "$GITHUB_ENV"

      # Rust std for the cross target. (This is the rust toolchain, not
      # a cross C toolchain — soldr provisions the latter itself.)
      - name: Install Rust toolchain + cross target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          # Install the manifest components in the same fresh-toolchain
          # transaction. Adding rustfmt after the minimal toolchain is present
          # conflicts with the cargo-fmt path shipped by Rust 1.95 (#2703).
          components: rustfmt, clippy

      # The pinned driver — the ONLY way soldr enters this workflow.
      # A venv sidesteps PEP 668 and exposes soldr's console entry point.
      - name: Install soldr from PyPI
        shell: bash
        run: |
          set -euo pipefail
          soldr_version="${{ inputs.soldr_version }}"
          echo "soldr driver: ${soldr_version:-latest}"
          python3 -m venv "$RUNNER_TEMP/soldr-venv"
          "$RUNNER_TEMP/soldr-venv/bin/pip" install --disable-pip-version-check \
            "soldr${soldr_version:+==${soldr_version}}"
          echo "$RUNNER_TEMP/soldr-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/soldr-venv/bin/soldr" --version

      # Deliberately NO `apt install clang lld llvm musl-tools`. If this
      # build needs a host cross toolchain, soldr isn't provisioning the
      # right assets — that is the bug this workflow guards against.
      - name: Build soldr — soldr build --release --target ${{ matrix.alias }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::soldr build --target ${{ matrix.input || matrix.alias }} (${{ matrix.target }})"
          # The pinned wheel predates the vendored zccache cross-target output
          # fix; disable only its compile cache here so this bootstrap lane
          # validates the released driver and artifact layout deterministically.
          ZCCACHE_DISABLE=1 soldr build --release \
            --target "${{ matrix.input || matrix.alias }}" \
            --package soldr-cli \
            --bin soldr
          echo "::endgroup::"

      - name: Verify cross-compiled binary
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ matrix.exe_suffix }}"
          built="target/${{ matrix.target }}/release/soldr${suffix}"
          if [ ! -f "$built" ]; then
            echo "expected soldr binary not found at $built" >&2
            ls -la "target/${{ matrix.target }}/release/" >&2 || true
            exit 1
          fi
          ls -la "$built"
          # Magic-byte format check (no file(1) dependency) — a silent
          # host-target fallthrough (the bug the pinned driver prevents)
          # fails loudly here.
          magic="$(head -c4 "$built" | od -An -tx1 | tr -d ' \n')"
          echo "magic: $magic"
          case "${{ matrix.target }}" in
            *-pc-windows-*)     [ "${magic:0:4}" = "4d5a" ] || { echo "NOT a PE binary (magic=$magic)" >&2; exit 1; } ;;
            *-apple-darwin)     case "$magic" in cffaedfe|feedfacf|cafebabe) : ;; *) echo "NOT a Mach-O binary (magic=$magic)" >&2; exit 1 ;; esac ;;
            *-unknown-linux-*)  [ "$magic" = "7f454c46" ] || { echo "NOT an ELF binary (magic=$magic)" >&2; exit 1; } ;;
          esac
          echo "OK: ${{ matrix.target }} built by pinned soldr with zero host cross toolchain"
