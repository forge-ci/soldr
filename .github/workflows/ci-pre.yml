# CI Pre: called as the first job of ci.yml, and by cache-budget.yml for the
# triggers ci.yml does not have (non-main pushes, schedule, dispatch). It
# implements the fleet proto-policy in zackees/ci.yml#6 ("Two workflows",
# section 2, row 9 "Cache (live)") under the owner's name, `ci-pre.yml`.
#
# Contract: stdlib `python3` from the runner image only (nothing installed),
# one sparse checkout per job, 2-minute timeouts, and nothing in ci.yml
# `needs:` this workflow, so a janitor queued behind another sweep never
# delays a build. Concurrency is job-level on the janitor only: no
# workflow-level group (which would cancel sweeps mid-delete), and the verdict
# never waits for the janitor.
#
# See .github/scripts/check_cache_budget.py for the sweep plan
# (`plan_sweep`) and the event-dependent verdict (`enforcement_mode`), and
# ci.toml [cache.family] for each family's prefix and size, and
# ci/cache-ownership.json `family_groups` for its janitor `evict` policy (soldr#3618).

name: CI Pre

on:
  workflow_call:

permissions:
  contents: read
  actions: write

env:
  # zackees/ci.yml#6 / check_pr_cache_keys.py: every PR-reachable cache save
  # carries this tag; empty outside a pull request.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

jobs:
  cache-janitor:
    name: Cache janitor
    # Deleting needs a writable token. A fork PR's token is read-only, so the
    # sweep runs on pushes, schedule, dispatch and same-repository PRs only.
    # The merge queue sweeps at the end of ci.yml instead (queue-cache-janitor):
    # batched queue runs arrive together, and GitHub cancels a *pending* job
    # when a newer request for the shared `cache-janitor` group waits, so a
    # second sweeper here concluded every queue run `cancelled` (run
    # 41335680472: "Canceling since a higher priority waiting request for
    # cache-janitor exists"). The push to main that follows each merge still
    # runs this sweep plus the end-of-queue one, so nothing goes unswept.
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # One sweep at a time, repository-wide, and never cancelled mid-delete.
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # A same-repository author can lose write access before a rerun.
          # Cache control always executes reviewed base code on PR events.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check_cache_budget.py
            .github/scripts/cache_families.py
            ci.toml
            src/soldr/__init__.py
            src/soldr/_process.py
            ci/cache-ownership.json
          sparse-checkout-cone-mode: false
      - name: Sweep reclaimable and evictable cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/check_cache_budget.py
          --require-live --prune --apply --sweep-only

  cache-budget:
    # Kept from ci.yml's former job so the check still reads the same.
    name: Repository Actions cache budget
    # No `needs: cache-janitor` and no concurrency: the verdict runs at once
    # and evaluates live state on its own, so it never queues behind a sweep.
    # On main/schedule a transient overage that a concurrent sweep is still
    # deleting can fail one run; the next run sees the converged state.
    # soldr#3342: the post-main-CI `workflow_run` trigger exists to sweep after
    # main's cache save. The verdict runs beside the janitor and reads the state
    # from before its deletions land, so on that event it could only ever report
    # the very overage the sweep is removing. The next main push, schedule or PR
    # judges the converged state.
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check_cache_budget.py
            .github/scripts/cache_families.py
            ci.toml
            src/soldr/__init__.py
            src/soldr/_process.py
            ci/cache-ownership.json
          sparse-checkout-cone-mode: false
      - name: Repository Actions cache budget
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Fork PR tokens can be read-only; keep the intentional skip there.
          REQUIRE_LIVE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          args=(--event-name "$EVENT_NAME" --ref "$REF")
          if [[ "$REQUIRE_LIVE" == "true" ]]; then args+=(--require-live); fi
          python3 .github/scripts/check_cache_budget.py "${args[@]}"

  # zackees/ci.yml#198 (GATE-010), soldr#3534: publish each stamp-valid
  # `Ci-Attestation:` of this commit as its own tiny cache entry,
  #   att1-<gate>-m<b>-c<k>-<sha10>${{ env.PR_CACHE_TAG }}
  # (a human-readable, ancestor-defining lineage label). Later runs list
  # them (GET-only REST) with `ci-lint attest resolve --require-gate` to
  # choose which caches are valid to hydrate. Off the critical path: nothing
  # needs this job. Two documented deviations from this file's contract
  # (tests/test_ci_pre_workflow.py pins both): it checks out the PR HEAD with
  # full history, because lineage ordinals and the trailers live there --
  # but only READS it (the code it runs is ci_lint from the pinned ci.yml
  # ref, never a PR-authored script), and it holds no `actions: write`;
  # cache saves use the runner's token, which GitHub scopes to this PR.
  attestations:
    name: Publish ci-attestations
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/ci.yml
          ref: 29087cb90ddebb84cd5f4b2e0f85380e76c743e5
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Validate attestations and derive side-entry keys
        id: att
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.ci-lint python3 -m ci_lint attest keys --github-context --repo . --out-dir "$RUNNER_TEMP/ci-attestations" --slots 16 --github-output
      - name: Save attestation side entry 0
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 0 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_0 }}
          key: ${{ steps.att.outputs.stem_0 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 1
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 1 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_1 }}
          key: ${{ steps.att.outputs.stem_1 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 2
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 2 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_2 }}
          key: ${{ steps.att.outputs.stem_2 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 3
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 3 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_3 }}
          key: ${{ steps.att.outputs.stem_3 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 4
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 4 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_4 }}
          key: ${{ steps.att.outputs.stem_4 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 5
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 5 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_5 }}
          key: ${{ steps.att.outputs.stem_5 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 6
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 6 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_6 }}
          key: ${{ steps.att.outputs.stem_6 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 7
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 7 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_7 }}
          key: ${{ steps.att.outputs.stem_7 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 8
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 8 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_8 }}
          key: ${{ steps.att.outputs.stem_8 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 9
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 9 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_9 }}
          key: ${{ steps.att.outputs.stem_9 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 10
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 10 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_10 }}
          key: ${{ steps.att.outputs.stem_10 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 11
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 11 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_11 }}
          key: ${{ steps.att.outputs.stem_11 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 12
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 12 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_12 }}
          key: ${{ steps.att.outputs.stem_12 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 13
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 13 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_13 }}
          key: ${{ steps.att.outputs.stem_13 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 14
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 14 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.att.outputs.path_14 }}
          key: ${{ steps.att.outputs.stem_14 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 15
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 15 }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
