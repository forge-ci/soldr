# soldr's local gate (zackees/ci.yml#166, #168, GATE-001..005).
#
# Before every push, from a clean, committed tree:
#
#   uvx --from git+https://github.com/zackees/ci.yml@<CI_LINT_REF> ci-lint local-gate run
#
# <CI_LINT_REF> is the SHA in ci.toml's `linter`, the one canonical pin
# (soldr#3616). It is not repeated here: this file is a mandatory input of
# every lane, and a second copy is one more file a pin bump must edit
# (soldr#3556).
#
# runs `run` below and, on success, stamps HEAD with a tree-bound
# `Local-Gate:` trailer. CI's `ci-mode` job (`verify`) fails a PR whose head
# lacks it, and every other job needs `ci-mode`. Install the matching
# pre-push hook once per clone with `... ci-lint local-gate install-hook`.
[gate]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py"]
# The remote Lint job runs `ci/local_gate.py --lane lint` and nothing else.
mirrors = ["ci.yml:lint"]
setup-steps = ["Enlarge swap (OOM headroom)", "Install ripgrep"]
verify = "ci.yml:ci-mode"
# ci-pre must not wait on anything (zackees/ci.yml#23); path-selection only
# computes outputs and runs beside ci-mode rather than after it.
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group and must
# run first, with no `needs:`.
verify-exempt = ["ci-pre", "path-selection", "cancel-superseded"]
mode = "enforce"

# zackees/ci.yml#168 (GATE-005), soldr#3516: soldr's tests start soldr
# daemons and touch soldr state roots, so they never run against the caller's
# soldr state. The nextest run-wrapper refuses unless CI=true or the marker is
# set. No bosn (owner directive 2026-10-16): the runner below moves HOME,
# XDG_CONFIG_HOME, XDG_RUNTIME_DIR, TMPDIR and SOLDR_CACHE_DIR into a private
# root under ~/.cache/soldr-local-gate/<worktree hash>, checks the guard still refuses an
# unmarked run, and sets the marker for its own children only.
[gate.isolation]
marker = "SOLDR_TEST_ISOLATED"
runner = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/workspace_test.py", "--host"]
guard = ".github/scripts/nextest_wrapper.sh"
# zackees/ci.yml#196 (GATE-009): the gate writes .gate-nonce and
# ci/workspace_test.py echoes it from the tree it tests, so a run against
# another worktree fails instead of attesting someone else's tree.
proves-tree = true

# zackees/ci.yml#177 (GATE-007): the gate as cacheable lanes, split along
# input boundaries. A lane is skipped when its inputs -- the commit tree minus
# `exclude`, plus `keep` and the mandatory inputs (this file,
# ci/local_gate.py, Cargo.lock, rust-toolchain.toml) -- match a recorded pass.
# Exclusions must be evidence-based: replay history with
# `ci-lint local-gate lanes --simulate N`, and never exclude a path a lane
# might read. Measured traps: the Rust crates `include_str!`
# src/soldr/_bundle_bins.py, crates/*/benchmarks/*.md and tests/fixtures/**,
# so `**/*.py`, `**/*.md` and `tests/**` are NOT safe Rust exclusions.

# soldr#3703: py-static, guards and ci-lint never compile into the shared
# target dir, so they are `weight = "light"`: ci-lint runs them concurrently
# beside the heavy chain (rust, cross, wine, winvm, tests, one at a time).

# Python linters: only Python sources and their configs.
[gate.lanes.py-static]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "py-static"]
weight = "light"
tools = ["uv"]
exclude = [
  "crates/**", "dylints/**", "_vender/**", "Cargo.toml", "Cargo.lock", "docs/**", "*.md", "*.png", "contracts/**",
  "docker/**", "bosn.toml", ".github/workflows/**", "examples/**", "perf/**",
  # Data files: the linters read only Python and their own configs.
  "**/*.json", "**/*.yml", "**/*.yaml", "**/*.rs",
]

# Repository-scanning guards and the Python tests: they read everything.
[gate.lanes.guards]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "guards"]
weight = "light"
tools = ["uv", "node"]

# soldr lint ci + dependency policy: seconds; reads CI surfaces and lockfiles.
[gate.lanes.ci-lint]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "ci-lint"]
weight = "light"
tools = ["soldr"]

# rustfmt, Clippy, Dylint: the Rust world.
[gate.lanes.rust]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "rust"]
tools = ["soldr"]
env = ["SOLDR_LINKER"]
exclude = [
  "docs/**", "*.md", "*.png", "contracts/**", "bench/**", "perf/**", "examples/**",
  "tests/**", "docker/**", "bosn.toml", ".github/**", "ci/**", "tools/**", "scripts/**", ".claude/**",
  "src/**", "install", "install.sh", "lint", "test", "clean", "package.json", "uv.lock",
]
keep = ["tests/fixtures/**", "src/soldr/_bundle_bins.py"]

# zackees/ci.yml#198 phase 2: Clippy + Dylint for Windows MSVC and Apple
# arm64, cross-checked from Linux. Same inputs as the rust lane. soldr#3787:
# per-target Dylint skips on proof (ci/cross_dylint.py skip_reason), so the
# script and its shared crate graph are lane inputs.
[gate.lanes.cross]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "cross"]
tools = ["soldr"]
env = ["SOLDR_LINKER"]
exclude = [
  "docs/**", "*.md", "*.png", "contracts/**", "bench/**", "perf/**", "examples/**",
  "tests/**", "docker/**", "bosn.toml", ".github/**", "ci/**", "tools/**", "scripts/**", ".claude/**",
  "src/**", "install", "install.sh", "lint", "test", "clean", "package.json", "uv.lock",
]
keep = ["tests/fixtures/**", "src/soldr/_bundle_bins.py", "ci/cross_dylint.py", "ci/crate_graph.py"]

# zackees/ci.yml#202 phase 3: Windows-MSVC unit tests under Wine, in a
# container. Rust inputs plus the lane script and its image. soldr#3704: the
# lane itself logs a SKIPPED pass when the diff touches only crates outside
# its dependency closure (ci/wine_lane.py skip_reason).
[gate.lanes.wine]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "wine"]
tools = ["soldr", "docker"]
env = ["SOLDR_LINKER"]
exclude = [
  "docs/**", "*.md", "*.png", "contracts/**", "bench/**", "perf/**", "examples/**",
  "tests/**", "docker/**", "bosn.toml", ".github/**", "ci/**", "tools/**", "scripts/**", ".claude/**",
  "src/**", "install", "install.sh", "lint", "test", "clean", "package.json", "uv.lock",
]
keep = ["tests/fixtures/**", "src/soldr/_bundle_bins.py", "ci/wine_lane.py", "ci/crate_graph.py", "docker/wine-test/**"]

# zackees/ci.yml#202: the Windows-MSVC target-run partition, replayed natively
# in a warm local dockur/windows VM (ci/winvm_lane.py + ci/winvm_guest.ps1).
# Host-optional: without the VM (or /dev/kvm) the lane exits 75, ci-lint
# records `winvm:n/a`, never caches or attests it, and the gate passes.
# Rust inputs plus the lane scripts, the guest-probe tooling they reuse, and
# the CI selection they replay (ownership manifest, nextest profile, helpers).
[gate.lanes.winvm]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "winvm"]
tools = ["soldr", "docker"]
env = ["SOLDR_LINKER", "SOLDR_WINVM_CONTAINER", "SOLDR_WINVM_SSH_KEY"]
optional = true
exclude = [
  "docs/**", "*.md", "*.png", "contracts/**", "bench/**", "perf/**", "examples/**",
  "tests/**", "docker/**", "bosn.toml", ".github/**", "ci/**", "tools/**", "scripts/**", ".claude/**",
  "src/**", "install", "install.sh", "lint", "test", "clean", "package.json", "uv.lock",
]
keep = [
  "tests/fixtures/**", "src/soldr/_bundle_bins.py",
  "ci/winvm_lane.py", "ci/winvm_guest.ps1", "ci/crate_graph.py",
  "ci/windows_guest_probe.py", "ci/windows_guest_probe/**",
  "ci/target-run-ownership.json", ".github/scripts/target_run_ownership.py",
  ".github/scripts/fetch_catalogued_nextest.py", ".github/scripts/download_catalogued_asset.py",
  ".github/scripts/toolchain_asset_query.py",
]

# The test suite, in a private host root: the Rust world plus the harness it
# runs under. zackees/ci.yml#399: it builds in its private root's own target
# dir (~/.cache/soldr-local-gate/<hash>/target), never the host target/, so it
# is its own heavy group and runs beside the host chain (rust, cross, wine,
# winvm) instead of after it. soldr#3731: the lane narrows itself to the
# changed crates' reverse-dependency closure plus soldr-cli when the diff is
# crate source only (ci/workspace_test.py select_packages), and logs it.
[gate.lanes.tests]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "tests"]
group = "isolated"
tools = ["uv", "soldr"]
exclude = [
  "docs/**", "*.md", "*.png", "contracts/**", "bench/**", "perf/**", "examples/**",
  "tests/**", ".github/**", "ci/**", "tools/**", "scripts/**", ".claude/**",
  "src/**", "install", "install.sh", "lint", "test", "clean", "package.json", "uv.lock",
]
keep = [
  "tests/fixtures/**", "src/soldr/_bundle_bins.py", ".github/scripts/nextest*",
  "ci/workspace_test.py", "ci/crate_graph.py",
]

# zackees/ci.yml#190 (GATE-008, pilot #189): an attested PR head skips the
# remote Lint and Linux x64 jobs -- they would rerun exactly what the gate
# just ran, at ~14 min of PR latency. CI's ci-mode job decides with
# `ci-lint local-gate verify --trust`, from THIS file as committed on the
# PR's base. It fails closed: a fork or non-writer author, a `ci-full`
# label, a head not attested for its exact tree, a trailer missing a lane,
# a change to any surface below (or to this file, ci/local_gate.py, ci.yml,
# _build-and-test.yml and the local actions they use), or the 1-in-10
# audit sample all run the jobs as before. Pushes to main always run them
# (the post-merge catch); the release candidate's full run is the last.
[gate.trust]
mode = "enforce"
skip = ["ci.yml:lint", "ci.yml:build-linux-x64"]
# Linux x64 is not a pure mirror: its `soldr ci-test` DAG is the rust
# (fmt/Clippy/Dylint), ci-lint (dependency policy) and tests (nextest +
# doctests, private host root) lanes; the CI-only probes below run on every main push.
covered-by = { "ci.yml:build-linux-x64" = ["rust", "ci-lint", "tests"] }
# Scripts only the skipped jobs run: a change to one can only be validated
# remotely.
surfaces = [
  ".github/scripts/setup_ci_swap.sh",
  ".github/scripts/analyze_compile_journal.py",
  ".github/scripts/check_compile_fallbacks.py",
  ".github/scripts/check_pr_cache_keys.py",
  ".github/scripts/check_third_party_compiles.py",
  ".github/scripts/check_toolchain_homes.py",
  ".github/scripts/dylint_toolchain_channel.py",
  ".github/scripts/fit_memory_estimate.py",
  ".github/scripts/index_build_logs.py",
  ".github/scripts/install_ci_cargo_guard.py",
  ".github/scripts/measure_zccache_working_set.py",
  ".github/scripts/report_dylint_tree_size.py",
  ".github/scripts/ci_mode.py",
  "ci/check_linked_libs.py",
  "ci/check_zccache_feature_graph.py",
]
