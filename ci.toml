# ci.toml — this repository's CI contract. Checked and planned by ci-lint
# (zackees/ci.yml). Nothing here generates YAML: it bounds what the YAML may
# do and decides what each run selects.
#
# First declaration for this repository (zackees/ci.yml#335). Every platform,
# runner, target, cache family and permission below was read off the existing
# workflows and the live cache listing. Where the YAML and this file disagree,
# the YAML is right and this file is the bug.
#
# `[local.gate]` is deliberately ABSENT: this repository declares its gate in
# `local-gate.toml`, and declaring both is a GATE-001 violation.
schema  = 3
profile = "rust-pypi-app"
linter  = "zackees/ci.yml@29087cb90ddebb84cd5f4b2e0f85380e76c743e5"

# ── Platforms ────────────────────────────────────────────────────────────────
# Cross-compiled from a Linux host (soldr cross), executed on its own runner.
# Each host below is one this repository actually uses: ubuntu-24.04-arm
# (ci.yml:620,682), windows-11-arm (ci.yml:825), macos-15 for aarch64-apple-darwin
# (ci.yml:729), macos-15-intel for the Intel leg.
[platforms]
linux-x64     = { target = "x86_64-unknown-linux-gnu",  runs-on = "ubuntu-24.04",     group = "linux",   wheel = "manylinux_2_17" }
linux-arm64   = { target = "aarch64-unknown-linux-gnu", runs-on = "ubuntu-24.04-arm", group = "linux",   wheel = "manylinux_2_17" }
windows-x64   = { target = "x86_64-pc-windows-msvc",    runs-on = "windows-2025",     group = "windows" }
windows-arm64 = { target = "aarch64-pc-windows-msvc",   runs-on = "windows-11-arm",   group = "windows" }
macos-arm64   = { target = "aarch64-apple-darwin",      runs-on = "macos-15",         group = "macos" }
macos-x64     = { target = "x86_64-apple-darwin",       runs-on = "macos-15-intel",   group = "macos" }

# ── Python packaging ─────────────────────────────────────────────────────────
[python]
backend = "soldr"
cli     = { name = "soldr", crate = "soldr-cli", native = true }
abi3    = "cp310"
pythons = ["3.11"]

# ── Rust workspace discipline ─────────────────────────────────────────────────
# soldr publishes no crates (Cargo.toml:6), so membership carries no external
# surface; the seven crates are all internal.
[rust]
public  = "crates/soldr-cli"
private = "crates/*"

[rust.tests]
max-binary = "80MB"
max-total  = "600MB"
binaries   = ["soldr-core:lib", "soldr-cli:lib", "soldr-cache:lib", "soldr-daemon:lib", "soldr-fetch:lib", "soldr-platform:lib"]

# ── Suites ───────────────────────────────────────────────────────────────────
[suites]
unit        = { run = "ci/test.py unit",        required = true }
smoke       = { run = "ci/wheel.py smoke",      required = true }
integration = { run = "ci/test.py integration", required = true }
init        = { run = "ci/test.py init",        cache = "none" }

# ── Flows ────────────────────────────────────────────────────────────────────
[flow.pr]
platforms = ["linux-x64"]
suites    = ["unit", "smoke"]
budget    = { critical-path = "8m" }

# `pre-prune` is deliberately ABSENT from both writer flows (`main`, `nightly`).
# It was declared but never honoured: nothing here runs `ci-lint cache preprune`,
# and CACHE-004 waived the lockfile-change peak purely on that declaration
# (zackees/ci.yml#352, rule CACHE-034; soldr#3583). `ci-pre.yml` cannot host a
# real pre-prune: it holds `actions: write` but nothing in `ci.yml` `needs:` it
# (deliberately -- a janitor never delays a build), so its deletions are not
# ordered ahead of this repository's cache saves (zackees/ci.yml#354).
[flow.main]
extends   = "pr"
cache     = "write"

[flow.release]
platforms = "all"
suites    = "all"
wheels    = "all"
publish   = "pypi"

[flow.nightly]
extends   = "release"
schedule  = "daily"
cache     = "write"
janitor   = true
publish   = "none"

# ── Tags ─────────────────────────────────────────────────────────────────────
[tags]
ci-full        = { add = { platforms = "all", suites = ["integration"] } }
ci-cache-save  = { cache = "pr-base" }
no-test        = { remove = { suites = "tests" } }
release        = { flow = "release", publish = "rehearsal" }

# ── Default-branch reuse ─────────────────────────────────────────────────────
# `off` is the honest value, not a default. soldr has never reused a verified
# default-branch run (measured: its real reuse rate is 0%, from duplicated job
# DISPLAY NAMES -- two jobs both called `Lint` -- not from absent wiring). The
# rename is the prerequisite; `ci-lint reuse-report` is what would show reuse
# actually happening before this moves to "shadow".
[reuse.default-branch]
mode          = "off"
max-age-hours = 24

# ── Cache ────────────────────────────────────────────────────────────────────
# THE cache-family declaration for this repository (soldr#3618). Every live
# Actions-cache prefix is declared here exactly once, with its size; nothing
# else in the tree carries a per-family byte number. Two readers:
#
# * ci-lint (CACHE-001/004/029, `ci-lint cache janitor`) reads it as-is;
# * .github/scripts/check_cache_budget.py -- the janitor that actually deletes
#   (ci-pre.yml, `actions: write`) and the budget verdict -- reads it through
#   .github/scripts/cache_families.py. Its allocation for a family is the same
#   footprint CACHE-004 computes (`max x cardinality`, or the sum of `shapes`).
#
# What ci/cache-ownership.json still holds is NOT a size: `family_groups` maps
# these families onto the ownership groups whose `entries` its guard checks,
# and records the janitor eviction policy (`newest`, `newest-per-lineage`, or
# none) that this schema's `evict` (only "lru") cannot spell. A group's budget
# is the SUM of its members' footprints, so the janitor still pools, e.g., the
# nine experiment-lane prefixes under one allocation.
#
# `[cache].budget` is the hard ceiling (formerly `fail_total_bytes`, 9.5 GiB;
# sizes here are binary, "1GB" = 1 GiB, as ci-lint parses them). CACHE-004's
# worst case is steady + the lockfile-change peak (no writer flow pre-prunes;
# see [flow.main]) + [cache.pr].budget. The janitor's own target is
# steady <= 8.5 GiB -- the old `total_max_bytes`.
# They sum to 8685 MiB (8.48 GiB). Sized 2026-10-09 from the live listing
# (`gh api 'repos/zackees/soldr/actions/caches?per_page=100' --paginate`,
# 93 entries, 7.39 GiB); re-measure before retuning.
#
# Every family declares `evict = "lru"` so ci-lint's janitor bounds it at its
# footprint (CACHE-029) rather than keeping only the newest entry per prefix,
# which would delete warm entries of multi-shape families (cook's five flag
# shapes, xwin's two targets). Each footprint sits at or above its live size.
# Never list a live prefix in `[cache].retired` to silence a finding: that is
# CACHE-009 and tells every janitor to DELETE warm caches.
[cache]
budget   = "9.5GB"
write-on = ["main", "nightly"]
never    = []
retired  = []
pr       = { mode = "delta", families = ["compile"], max-per-pr = "128MB", budget = "1GB", trim = "on-close" }

[cache.family]
# -- group attestation-evidence: ~450 B ci-attestation markers (GATE-010).
att1                   = { prefix = "att1-",                               max = "16MB",   evict = "lru" }

# -- group pinned-immutable-download (janitor: newest-per-lineage), 1056 MiB.
rustup                 = { prefix = "rustup-",                             max = "240MB",  evict = "lru" }
xwin                   = { prefix = "soldr-xwin-cache-", max = "140MB", evict = "lru", shapes = { x86-64 = { max = "140MB" }, aarch64 = { max = "140MB" } } }
apple-sdk              = { prefix = "soldr-apple-sdk-", max = "60MB", evict = "lru", shapes = { x86-64 = { max = "60MB" }, aarch64 = { max = "60MB" } } }
# Two writers (linux-x64 171.6 MB, windows-x64 155.0 MB live). `per = "os"`
# would count three; `shapes` states the two that exist.
toolchain              = { via = "setup-soldr:solo-toolchain", max = "180MB", evict = "lru", shapes = { linux-x64 = { max = "180MB" }, windows-x64 = { max = "170MB" } } }
soldr-mini             = { via = "setup-soldr:soldr-mini", max = "30MB", min = "1MB", evict = "lru", shapes = { linux-x64 = { max = "30MB" }, windows-x64 = { max = "30MB" } } }
# setup-uv entries are ~1 KB each, one per (arch, platform, python).
uv                     = { via = "setup-uv",                   max = "1MB",   per = "platform",          evict = "lru" }

# -- group bootstrap-driver-binary (janitor: no budget eviction), 150 MiB.
bootstrap-soldr        = { prefix = "bootstrap-soldr-blessed-", max = "50MB", evict = "lru", shapes = { cross-build = { max = "50MB" }, ci-dev = { max = "50MB" }, ci-dev-pr = { max = "50MB" } } }

# -- group cook-layer (janitor: no budget eviction; cook's own lineage rules
#    prune it), 2480 MiB. Five concurrent flag shapes from one writer (live
#    546/512/512/426/422 MiB, 2418 MiB on 2026-10-23, when growth of 1-2 MiB
#    per archive pushed the family to 100.3% and failed the budget gate), so
#    `max` is the largest shape.
#    `cook-delta-v2-` is retired fleet-wide (check_cache_budget.py
#    RETIRED_PREFIXES) and has no producer here.
cook                   = { via = "setup-soldr:cook", max = "560MB", min = "1MB", evict = "lru", shapes = { flags1 = { max = "560MB" }, flags2 = { max = "525MB" }, flags3 = { max = "525MB" }, flags4 = { max = "435MB" }, flags5 = { max = "435MB" } } }

# -- group dylint-foundation (janitor: no budget eviction), 608 MiB. One
#    entry per nightly; the headroom covers a nightly bump's second generation
#    while the superseded one ages out.
dylint-foundation      = { prefix = "dylint-foundation-",                  max = "600MB",  evict = "lru" }
dylint-driver          = { prefix = "dylint-driver-",                      max = "8MB",    evict = "lru" }

# -- group setup-soldr-action-stores (janitor: newest), 1370 MiB.
# `compile` is setup-soldr's build cache: two writers (linux-x64 648 MB,
# windows-x64 388 MB live), declared as the two shapes that exist.
compile                = { via = "setup-soldr:build-cache",   max = "680MB", lockfile = true, min = "1MB", evict = "lru", promote = "ancestor", shapes = { linux-x64 = { max = "680MB" }, windows-x64 = { max = "410MB" } } }
registry               = { via = "setup-soldr:cargo-registry", max = "140MB", lockfile = true, per = "none", evict = "lru" }
dogfood-zccache        = { prefix = "setup-soldr-dogfood-zccache-", max = "70MB", evict = "lru", shapes = { current = { max = "70MB" }, previous = { max = "70MB" } } }

# -- group experiment-lanes (janitor: lru, pooled across the group), 496 MiB.
#    The cache is the subject under test in these workflows.
soldr-bin              = { prefix = "soldr-bin-", max = "43MB", evict = "lru", shapes = { g1 = { max = "43MB" }, g2 = { max = "43MB" }, g3 = { max = "42MB" } } }
perf-build             = { prefix = "v0-rust-perf-build-soldr-",           max = "64MB",   evict = "lru" }
cache-delta-exp        = { prefix = "v0-rust-cache-delta-exp-",            max = "64MB",   evict = "lru" }
bootstrap-release      = { prefix = "bootstrap-soldr-linux-gnu-release-",  max = "64MB",   evict = "lru" }
zigbuild-toolchain     = { prefix = "soldr-zigbuild-toolchain-",           max = "32MB",   evict = "lru" }
perf-cold-warm-zccache = { prefix = "perf-cold-warm-zccache-",             max = "64MB",   evict = "lru" }
soldr-baseline         = { prefix = "soldr-baseline-",                     max = "32MB",   evict = "lru" }
soldr-cook             = { prefix = "soldr-cook-",                         max = "32MB",   evict = "lru" }
soldr-delta            = { prefix = "soldr-delta-",                        max = "16MB",   evict = "lru" }

# -- group zccache-unit (janitor: newest), 2509 MiB. Six ~402 MB lineage
#    generations live (2411 MiB).
zccache-unit           = { prefix = "zccache-unit-", max = "419MB", evict = "lru", shapes = { g1 = { max = "419MB" }, g2 = { max = "418MB" }, g3 = { max = "418MB" }, g4 = { max = "418MB" }, g5 = { max = "418MB" }, g6 = { max = "418MB" } } }

# Ancestor promotion (CACHE-024, zackees/ci.yml#335). Standardizing on
# setup-soldr's ancestor encoding -- shortest parent-edge distance from a live
# git DAG walk -- rather than a first-parent ordinal, which INVERTS on wide
# merges: a 50-commit branch tip reports ordinal 53 while the merge commit
# containing it reports 4, so a cache saved at the merge looks older than one
# saved 50 commits before it. #335 keeps the `m<n>` label for offline audit only.
#
# `compile` opts in. The setup-soldr dylint layers (`setup-soldr:dylint`,
# `setup-soldr:dylint-output`) that #3576 also opted in are not enabled by any
# workflow here and had no live entry, so #3618 dropped their families; the
# Dylint caches this repository writes are `dylint-foundation`/`dylint-driver`.
#
# DECLARATION ONLY: setup-soldr#566 is merged but unreleased, so CACHE-030 and
# CACHE-032 report `needs_review` and the opt-in is inert until a tag lands.
[cache.promote]
mode          = "ancestor"
max-age-hours = 168

# ── Local runs ───────────────────────────────────────────────────────────────
# Only the runner: the gate itself lives in `local-gate.toml`, and declaring
# `[local.gate]` here as well would be GATE-001.
[local]
runner = "bosn-act"
lanes  = ["precheck"]
cache  = "machine"

# ── Allowlist ────────────────────────────────────────────────────────────────
# The full workflow set, by name. Which workflows a repository HAS is
# repo-specific (soldr ships 29; the canonical example has 2) -- `example
# drift` classifies that difference as repo-specific, not policy (ci.yml#341).
[allow]
workflows         = { "ci.yml" = ["pull_request", "merge_group", "push:main", "schedule", "workflow_dispatch"], "ci-pre.yml" = ["pull_request", "push:main", "merge_group"], "_build-and-test.yml" = ["workflow_call"], "_bootstrap-e2e.yml" = ["workflow_call"], "_ci-cross-build-linux.yml" = ["workflow_call"], "_ci-target-run.yml" = ["workflow_call"], "setup-soldr-action.yml" = ["workflow_call"], "cook-size-gate.yml" = ["workflow_call"], "cache-budget.yml" = ["schedule", "workflow_dispatch"], "cache-delta-experiment.yml" = ["workflow_call"], "baseline-zero-deps.yml" = ["workflow_call"], "benchmark-stats.yml" = ["schedule"], "build-all-from-linux.yml" = ["workflow_call"], "cargo-orchestration-telemetry.yml" = ["workflow_call"], "cross-compile-all-targets.yml" = ["workflow_call"], "cross-compile-stress.yml" = ["workflow_call"], "docker-linux-cross-smoke.yml" = ["workflow_call"], "dylint-cache-acceptance.yml" = ["workflow_call"], "dylint-cook-acceptance.yml" = ["workflow_call"], "macos-recovery-replay.yml" = ["workflow_call"], "macos-universal2-probe.yml" = ["workflow_call"], "nextest-cacheability.yml" = ["workflow_call"], "parent-cache-bench.yml" = ["workflow_call"], "perf-cold-warm.yml" = ["workflow_call"], "perf-matrix.yml" = ["workflow_call"], "published-dylint-smoke.yml" = ["workflow_call"], "auto-release.yml" = ["push:tag", "workflow_dispatch"], "windows-guest-probe.yml" = ["workflow_call"], "win-gnu-smoke.yml" = ["workflow_call"] }
actions           = ["actions/checkout", "actions/upload-artifact", "actions/download-artifact", "zackees/setup-soldr", "astral-sh/setup-uv"]
tools             = ["soldr", "uv", "python3", "yq", "git"]
secrets           = []
platform-selector = "crates/soldr-platform/src/lib.rs"
platform-code     = ["crates/soldr-platform/src/**", "scripts/**"]

# Read off the workflows: the release job publishes to PyPI/crates.io with an
# OIDC token, and cache-budget retires entries with `actions: write`.
permissions = { "id-token: write" = ["publish"], "actions: write" = ["cache-budget"] }

# This repository calls `zackees/setup-soldr` directly from its workflows and has
# no composite wrapper under `.github/actions/`, so `only-in` is the empty
# string: it asserts "no wrapper anywhere" rather than naming a directory that
# does not exist.
setup-soldr       = { only-in = "", require = { save-cache = "plan" } }
setup-uv          = { require = { save-cache = "plan" } }

# ── Publish ──────────────────────────────────────────────────────────────────
[publish]
pypi = { auth = "oidc", environment = "pypi", mode = "mock" }