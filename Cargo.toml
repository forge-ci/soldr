[workspace]
resolver = "2"
# Internal publish=false crate split (#1490, reversing the 2026-05
# monocrate collapse): `soldr-core` is the foundation crate; the
# remaining trees split out phase by phase (fetch, cache, daemon).
# soldr publishes no crates, so workspace membership has no external
# surface — the old monocrate_guard test was deleted with the split.
members = [
    "crates/soldr-cli",
    "crates/soldr-daemon",
    "crates/soldr-cache",
    "crates/soldr-core",
    "crates/soldr-fetch",
    "crates/soldr-platform",
    "crates/soldr-nextest-wrapper",
]
# soldr#2837 removed the two entries this list used to exist for. zccache and
# running-process were `_vender/` submodules with their own [workspace]
# declarations, and each needed excluding so cargo would not fold its crates
# into soldr's workspace and mis-version them. They are exact crates.io
# dependencies now (`zccache = { version = "=1.15.5" }` in
# `[workspace.dependencies]`, the single pin every member inherits;
# `running-process = { version = "=4.10.16" }`), so there is no nested
# workspace left to exclude. zccache#1955 patches zccache back to
# `_vender/zccache`, but as the published single-crate amalgamation, which has
# no `[workspace]` of its own; running-process has no `[patch]` at all.
#
# `tests/test_externalized_dependency_sources.py` fails if a path dep, a
# `[patch]` redirect, or a gitlink puts them back: the only other symptom
# would be 19 packages returning to the lockfile and every fresh checkout
# recompiling them, which reads as ordinary CI slowness.
exclude = [
    ".extern-repos/soldr-maturin",
]

[workspace.package]
version = "0.9.41"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/zackees/soldr"
homepage = "https://github.com/zackees/soldr"

[workspace.metadata.soldr]
# Compatibility mirror of the authoritative `ci/canonical-targets.json`,
# consumed by `soldr prepare --target all` (RFC #914).
# Cargo ignores `[workspace.metadata.*]` — this is the blessed way to
# attach tool-specific config to a manifest. A parity guard checks every
# runtime, workflow, release, alias, documentation, and catalogue mirror.
# When this checkout is run with a locally-built soldr, hand off to the
# globally-installed `soldr` on PATH when it has a newer SemVer version.
prefer_newer_global = true
# soldr#3276 §6: dogfood the reld linker on soldr's own build. `.github/
# scripts/reld_dogfood_proof.py` (run in CI) proves the resolved linker is
# an absolute path derived from a fetched reld, never the bare `reld` name
# clang's `--ld-path=` rejects, and that this repo's own `.cargo/config.toml`
# `[build] rustflags` (`--cfg tokio_unstable`) survives the injection.
linker = "reld"
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[workspace.metadata.dylint]
libraries = [{ path = "dylints/*" }]

[workspace.dependencies]
# The one zccache pin (soldr#3604): every member uses `workspace = true`.
# `default-features = false` can only be set here; a member cannot re-disable it.
zccache = { version = "=1.15.5", default-features = false }
cap-fs-ext = "3.4.4"
cap-std = "3.4.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# Opt-in tokio-console support for soldr-daemon. Only pulled into
# soldr-cli when the crate's `tokio-console` feature is enabled.
console-subscriber = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
# soldr#1356 prep — reqwest features made explicit for robustness.
# fetch/forge_dispatch.rs + fetch/manifest_lookup.rs use Response::text()
# (`charset`), Response::json() (`json`), and Response streaming
# (`stream`). Previously these were pulled in by feature-unification
# through other deps; declaring them explicitly makes soldr's build
# self-sufficient against dep-trim churn.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "stream"] }
tempfile = "3"
# soldr#1356 A4 — default-features=false + deflate only. Drops bzip2-sys
# (C build) + aes + sha1 + lzma + deflate64 + zopfli + zip's own zstd copy.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# soldr#1356 A3 — rust_backend replaces zlib-ng. Drops libz-ng-sys
# (C build) + the `cmake` build-dependency needed to compile it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# .tar.xz support — cargo-zigbuild and other rust-cross prebuilts ship
# their per-triple binary tarballs in xz, not gzip. Without this, soldr
# falls through to the "raw binary" branch in fetch::archive and writes
# the compressed tarball bytes to disk as the binary (#809).
# `static` links liblzma into the binary instead of letting lzma-sys's
# build.rs dynamically link whatever liblzma pkg-config finds on the
# build host. A host-linked liblzma gets vendored into `soldr.libs/` by
# auditwheel with an `$ORIGIN/../soldr.libs` RPATH, but soldr materializes
# copies of its own binary as relocated shim images elsewhere on disk
# where that relative RPATH does not resolve — every wrapped compile then
# fails with "error while loading shared libraries: liblzma...". Static
# linking makes the binary host-independent, matching the released
# PyPI artifacts.
xz2 = { version = "0.1", features = ["static"] }
toml = "0.8"
toml_edit = "0.22"
rayon = "1"
prost = "0.14"
# soldr#1356 A2 — walkdir workspace dep removed; jwalk is the sole
# directory walker used in soldr-cli.
jwalk = "0.8"
wait-timeout = "0.2"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
# soldr#3735: binstall `pkg-fmt = "tbz2"`. bzip2 0.6 defaults to the
# pure-Rust libbz2-rs-sys backend (no C build, unlike bzip2-sys).
bzip2 = "0.6"
# soldr#3735: binstall minisign signature verification. Zero-dependency
# verify-only crate by the minisign author.
minisign-verify = "0.2"
filetime = "0.2"
# Jaro-Winkler scoring for the target-triple classifier in
# `src/prepare_cmd.rs`. Lets `classify_target` pick the best-match
# token from a registry of known arches/oses/abis instead of doing
# brittle exact-string matches that miss obvious aliases.
strsim = "0.11"
# Used by `core::git::normalize_origin_url` for canonicalizing git
# remote URLs into the prefetch hint stored alongside cook artifacts
# (issue #577).
url = "2"
# Read-only access to cargo's `$CARGO_HOME/.global-cache` SQLite database
# (issue #349). `bundled` compiles SQLite ourselves so neither the
# managed wheel nor the cargo-install path needs a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

[patch.crates-io]
# soldr#2406: use the vendored notify with bumped windows-sys (0.52→0.61)
# and HANDLE type fixes for 0.59+ API to converge the dependency graph.
# Also takes notify-types 2.x, which drops the unmaintained `instant`
# (RUSTSEC-2024-0384).
notify = { path = "_vender/notify" }
# The published amalgamated zccache crate, vendored so soldr's own tests run
# against the exact compiler-cache code that ships inside soldr, and so a
# cache-key defect can be reproduced and fixed here before the upstream
# release (zccache#1955 cross-worktree OUT_DIR misses). One package, not the
# old 22-package submodule; `tests/test_externalized_dependency_sources.py`
# pins that shape.
zccache = { path = "_vender/zccache" }
# soldr#2406: bump filetime_creation's windows-sys (0.52→0.61) to converge.
filetime_creation = { path = "_vender/patches/filetime_creation" }
# soldr#2406: relax windows-sys caps across the cap-std ecosystem so the
# entire workspace converges on a single windows-sys version. Upstream
# caps at <=0.59; the APIs used are stable through 0.61.
winx = { path = "_vender/winx" }
cap-primitives = { path = "_vender/cap-primitives" }
cap-fs-ext = { path = "_vender/cap-fs-ext" }
cap-std = { path = "_vender/cap-std" }
fs-set-times = { path = "_vender/fs-set-times" }
io-extras = { path = "_vender/io-extras" }
# soldr#2406: bump petgraph hashbrown 0.15→0.17 to converge.
petgraph = { path = "_vender/petgraph" }
# soldr#2406: bump protox-parse logos 0.15→0.16 to converge.
protox-parse = { path = "_vender/protox-parse" }
# soldr#2406: bump hashlink hashbrown 0.14→0.17 to converge.
hashlink = { path = "_vender/hashlink" }
# Release profile size optimization (#920). soldr ships as a template
# binary that every CI consumer downloads via setup-soldr / actions/
# cache@v4 / cross-build-artifact passing — leaner binary = faster
# CI cycles for every consumer. The cargo defaults (`strip = "none"`,
# `lto = false`, `codegen-units = 16`) leave ~50% on the table for a
# pure-CLI binary that doesn't need user-side debuggability. Numbers:
# pre-change shipped 16.3 MB uncompressed for soldr v0.7.59.
# soldr#1985 — the dev profile had no override, so it used Cargo's default
# `debug = 2` (full DWARF). The two heaviest ubuntu-24.04 CI jobs both build
# with it — `_build-and-test.yml`'s `cargo build --workspace --tests --bins`
# (8m09s observed) and `ci.yml`'s `cargo clippy --workspace --all-targets` —
# and full debuginfo is a large share of that in codegen, link, and disk I/O.
#
# `line-tables-only` is the same trade soldr#1168 already made for the
# `ci-nextest` profile: panics and backtraces still resolve to file:line,
# only debugger variable inspection is lost. Applies to local `cargo build`
# too, which is the point — dev builds get faster as well.
[profile.dev]
debug = "line-tables-only"

# Workspace-only line symbols. `[profile.dev]` above gives every crate
# line-tables-only debuginfo; this override matches all *dependencies*
# (Cargo's `package."*"` matches every non-workspace-member) and drops
# their debuginfo entirely. Workspace crates keep file:line for panics /
# backtraces; external deps — the bulk of codegen + link + disk I/O in a
# `--workspace` build — emit no DWARF at all, shrinking the biggest
# contributor to dev build time and target/ size without touching the
# symbols we actually debug. Backtraces through soldr's own code are
# unchanged; only frames inside third-party crates lose file:line.
[profile.dev.package."*"]
debug = false

# The crates.io zccache package folds its upstream workspace into one large
# rustc unit. Keep its internal LLVM fan-out to one without slowing ordinary
# dependencies, which retain the wildcard profile above.
[profile.dev.package.zccache]
debug = false
codegen-units = 1

# soldr#3138: blake3 must be optimized even in the dev/test profiles.
#
# Soldr hashes its own ~100 MB executable image on every cold broker route
# (`broker_spawn`'s `StreamHasher` -> `zccache::hash` -> blake3). Unoptimized,
# blake3 runs at roughly 17 MB/s, so that hash takes **6.0 seconds** --
# measured directly with `SOLDR_STARTUP_TRACE=1` against a fresh home:
#
#   broker_image_hash  ms=6020
#   broker_stage_image ms=106
#   broker_spawn_wait  ms=55
#
# The hash is 98% of a cold broker bringup and dwarfs the image copy beside
# it. Optimized, blake3 runs at GB/s and the same hash is a rounding error.
#
# `codegen-units = 1` above does NOT imply optimization -- `opt-level` is
# still 0 for dev -- which is why this needs saying separately. Scoped to the
# one crate that does the work, so the rest of the workspace keeps its fast
# unoptimized builds and its debuggability. `constant_time_eq` and `arrayvec`
# are blake3's hot-path dependencies and get the same treatment.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.constant_time_eq]
opt-level = 3

[profile.dev.package.arrayvec]
opt-level = 3

# soldr#3163: sha2 must be optimized in the dev/test profiles, for exactly
# the reason blake3 above must be -- and found the same way, by measuring.
#
# `running-process`'s `DaemonProcess::current_process` hashes soldr's own
# ~110 MB executable TWICE on every daemon cold start: once with BLAKE3 for
# `exe_hash`, and again with SHA-256 for the `legacy_exe_sha256` field kept for
# the process-probe wire contract. Timed directly against the real binary:
#
#   blake3=8.3ms   sha256=2871ms   host_identity=0.18ms
#
# BLAKE3 is already fast here -- it is optimized above AND uses
# `update_mmap_rayon`. SHA-256 was doing 110 MB at ~38 MB/s unoptimized, and it
# is 97% of the `daemon_identity` bringup phase, which is itself 97% of a cold
# start. Optimized it runs in 128ms, a 22x cut, taking `soldr daemon start`
# from 6.2s to ~1.0s end-to-end.
#
# This is the cost roughly forty integration tests each pay independently for
# their own isolated root (soldr#3163), so it is test-suite wall time, not just
# a developer-loop annoyance. `cpufeatures` is sha2's runtime CPU-detection
# dependency and gets the same treatment for the same reason `constant_time_eq`
# and `arrayvec` do for blake3.
#
# Found by the daemon bringup breadcrumbs added in the same change: the phase
# table named `daemon_identity` immediately, after three earlier rounds of
# hypothesising had blamed the 110 MB staging copy, zccache init, and the
# state store -- all three measured wrong.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3

# The host CI warm-up and nextest invocation share target/<triple>/debug.
# Mirror dev's effective codegen settings here so their fingerprints remain
# reusable across that handoff (soldr#2864).
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.test.package.zccache]
debug = false
codegen-units = 1

# Same reason as `[profile.dev.package.blake3]` above. The gate's test binaries
# build under this profile, and roughly 40 integration tests each cold-start
# their own broker route -- so an unoptimized blake3 costs ~6 s per test.
[profile.test.package.blake3]
opt-level = 3

[profile.test.package.constant_time_eq]
opt-level = 3

[profile.test.package.arrayvec]
opt-level = 3

# Same reason as `[profile.dev.package.sha2]` above. The gate's test binaries
# build under this profile, and the ~40 integration tests that cold-start their
# own isolated daemon each pay the unoptimized SHA-256 pass.
[profile.test.package.sha2]
opt-level = 3

[profile.test.package.cpufeatures]
opt-level = 3

[profile.release]
# soldr#786 / linux+macOS follow-up, revised by soldr#3038: a crash or heap
# profile from a released daemon must be symbolizable on every platform, not
# just Windows (MSVC's PDB was always a free by-product of the link step;
# Linux and macOS shipped with no debug info at all -- there was nothing to
# strip because `debug` was never set, so `strip = "symbols"` alone used to
# be the size story here).
#
# `debug = "line-tables-only"` emits function names, file names and line
# numbers -- what a backtrace or pprof heap profile needs -- without full
# DWARF type info, at a fraction of the size of `debug = true`. This is still
# what makes soldr's OWN crates carry any debug info at all; the precompiled
# std and every C dependency built through the `cc` crate (`ring`,
# `zstd-sys`, `lzma-sys`, `libsqlite3-sys`, mimalloc-pprof) embed their own
# DWARF in the final link regardless of this setting.
#
# `split-debuginfo` deliberately stays `"off"` here -- soldr#3038 found that
# `"packed"` only splits the per-crate DWARF rustc itself compiles in this
# build. It cannot see the debug info std and the `cc`-built C dependencies
# contribute during the link, so that portion stayed embedded in the shipped
# binary *in addition to* being duplicated into the `.dwp` for the crates
# `"packed"` could see -- soldr's own release binary went from 21.3 MiB
# (stripped) to 73.8 MiB (packed, "split") while the `.dwp` beside it held
# another 48.5 MiB: debug info duplicated, not moved. `strip` stays `"none"`
# for the same reason it did under `"packed"`: the release-lane packaging
# script (`stage_release_binaries.py::stage_debug_symbols`) needs the fully
# linked, undisturbed binary as its input. It runs a post-link
# `objcopy --only-keep-debug` / `strip --strip-debug` /
# `objcopy --add-gnu-debuglink` sequence instead, which operates on the
# COMPLETE linked binary -- every source of DWARF in one pass, no
# duplication -- and produces the shipped, stripped binary plus a `.debug`
# sidecar in the same `-symbols.tar.zst` asset the `.dwp` used to ride in.
# See docs/DEBUG_SIDECARS.md for the measured before/after size table and the
# macOS asymmetry (dsymutil's `.dSYM` model does not have this duplication
# problem, so macOS keeps `split-debuginfo = "packed"` -- injected only for
# darwin targets via `CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO` in
# auto-release.yml / native_release_build.py, not here).
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"
# Cross-crate inlining + dead-code elimination. Soldr is a large product,
# and full/fat LTO has excessive peak-memory requirements for our CI builders.
# Thin LTO is the practical release-quality compromise: it preserves most of
# the optimization and size benefit while keeping CI compilation feasible.
lto = "thin"
# Single codegen unit unlocks the last bit of optimization. Slows
# clean builds further; release-only, so acceptable. Deliberate, not a copy of
# the zccache override below (soldr#3055): it predates that override (#929,
# citing #920's size work), and the owner's standing direction is that shipped
# release builds stay at maximum optimization with LTO.
codegen-units = 1

# soldr#3055: bound the amalgamated zccache unit here too, rather than leaning
# on the workspace-wide `codegen-units = 1` above. Every other profile carries
# this override; without it, loosening the release-wide setting would silently
# unbound the one crate that genuinely needs a single codegen unit.
# `version_lockstep.rs` guards it alongside the others.
[profile.release.package.zccache]
codegen-units = 1

# soldr#1282 — fast-compile profile for the CI bootstrap step.
# `Bootstrap soldr for SDK / blessed-build prep` builds a throwaway
# host-side soldr binary used only inside the same cross-build lane —
# it never ships to a user, never gets downloaded via setup-soldr, and
# never survives past post-step cleanup. Optimising it for size buys
# nothing. Dropping opt-level 3, LTO, and cu=1 saves the three
# darwin/MSVC lanes from compiling an optimized helper binary that is
# thrown away before the job exits.
[profile.ci-bootstrap]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
strip = "none"
# soldr#786 linux+macOS follow-up: `[profile.release]` now sets
# `debug = "line-tables-only"` for shipped-binary symbolication. This
# profile builds a throwaway binary that never survives past the job that
# built it, so paying for debug-info codegen buys nothing here -- opt back
# out explicitly rather than inherit it silently. `split-debuginfo` inherits
# `"off"` from `[profile.release]` (soldr#3038), which was already a no-op
# for this profile once `debug = false` -- there is nothing to split either
# way.
debug = false

# The bootstrap deliberately bypasses the compiler cache, so zccache cannot
# use its runtime admission gate while its own amalgamated crate is compiling.
[profile.ci-bootstrap.package.zccache]
debug = false
codegen-units = 1

# soldr#1357 — fast-compile profile for CI cross-build lanes. Same
# rationale as ci-bootstrap but applied to Stage B of
# `_ci-cross-build-linux.yml` where `soldr build --profile ci-release --target X`
# spends 5+ min per lane, most of it in single-threaded LLVM codegen +
# link for the soldr-cli monocrate. CI cross-build artifacts are
# `soldr-ci-e2e-*` — consumed only by `_ci-target-run.yml` for
# nextest smoke runs; NOT the shipped `release-soldr-*` /
# `pypi-soldr-*` artifacts produced by `auto-release.yml` (which
# stays on `--release` for shipped-binary quality). Keep a light
# optimizer pass so CI still catches optimized-codegen issues without
# paying full release opt-level 3 on every cross/PEP smoke build.
# Keeps `strip = "symbols"` so archive size stays comparable.
# soldr#786 linux+macOS follow-up: also keeps `debug = false` explicitly --
# `[profile.release]` now generates `line-tables-only` debug info for
# shipped-binary symbolication, but these are throwaway cross-build/smoke
# artifacts (not the shipped release), so inheriting that cost would only
# slow this lane down for no benefit. `[profile.ci-nextest]` below re-opts-in
# to debug info for its own reason (target-run backtraces) by setting `debug`
# itself, so this does not affect it.
[profile.ci-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = "symbols"
debug = false

[profile.ci-release.package.zccache]
debug = false
codegen-units = 1

# soldr#1248 — fast-compile profile for CI cross-build lanes that also
# produce nextest archives. It matches ci-release's compile-time wins so
# Stage B and Stage C share target/<triple>/ci-nextest artifacts, while
# preserving the soldr#1168 line-table-only debug info target-run needs
# for useful backtraces from archived tests.
[profile.ci-nextest]
inherits = "ci-release"
# These artifacts exist only for cross-target test execution. Avoid LLVM's
# optimized-codegen memory cost on cold, all-miss hosted-runner builds.
opt-level = 0
# Integration-test seams such as the broker lease pause are deliberately
# debug-only so production binaries cannot be delayed through SOLDR_TEST_*
# environment variables. Target-run archives must retain those seams even
# though this profile inherits its remaining defaults from ci-release.
debug-assertions = true
debug = "line-tables-only"
strip = "none"
# soldr#3038: `[profile.release]` itself now sets `split-debuginfo = "off"`
# (a post-link objcopy pass replaced rustc's packed split for the shipped
# binary -- see that profile's comment), so this inherits the value it
# needs without an override. Kept explicit anyway: nextest test binaries
# have no sidecar-shipping mechanism at all -- `_ci-target-run.yml` archives
# and runs the raw executable only -- so debug info MUST stay embedded here
# regardless of what the base profile does, and a future edit to the base
# profile should not silently change that for this one.
split-debuginfo = "off"

# Same workspace-only rule as `[profile.dev.package."*"]`: target-run
# backtraces only need file:line inside soldr's own frames, so external
# deps emit no debuginfo here either — keeping ci-nextest archives lean
# without losing the soldr#1168 line-table backtrace target.
[profile.ci-nextest.package."*"]
debug = false

[profile.ci-nextest.package.zccache]
debug = false
codegen-units = 1

[workspace.lints.rust]
unused_mut = "deny"
# `#[cfg_attr(dylint_lib = "...", allow(...))]` is how a site opts out of a
# repo Dylint (soldr#3387); declare the cfg so rustc does not warn on it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values(any()))'] }

# Enforce the "no new bincode" rule from CLAUDE.md's
# "Serialization (issues #580 / #603)" section. The actual disallowed-methods
# list lives in workspace-root `clippy.toml`. #603 already removed every
# bincode call site; this gate keeps it that way.
[workspace.lints.clippy]
disallowed_methods = "deny"
# Function-complexity ratchet (zackees/ci.yml#229, RUST-018): every function
# stays under clippy's default ceilings (clippy.toml must not raise them).
# The functions already over carry `#[expect(clippy::<lint>, reason = ...)]`,
# never `allow`; an expectation that stops firing is itself a warning, so a
# refactor deletes its suppression in the same change and the list only
# shrinks.
cognitive_complexity = "warn"
too_many_lines = "warn"
# soldr#3856: a synchronous guard or `RefCell` borrow held across `.await`
# can deadlock the daemon's runtime (the #3836 class). Clippy's built-ins
# cover std/parking_lot locks and `RefCell`; `await_holding_invalid_type`
# covers soldr's own timed guards, listed in root `clippy.toml`.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
