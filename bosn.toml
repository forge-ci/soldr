cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-core --lib toolchain_resolve; a=$?; CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo nextest run -p soldr-cli --test toolchain_env -E 'test(/^cli_toolchain_home_boundary::/)'; b=$?; exit $((a | b))"

