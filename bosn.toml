stack = "cook"
cmd = "cd /repo/dylints/ban_swallowed_child_stdio && CARGO_TARGET_DIR=/target/dylint-ui /opt/soldr-bootstrap/bin/soldr cargo test"

# soldr#3387: run the new Dylint over the whole workspace (must be clean).
