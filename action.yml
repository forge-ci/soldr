name: setup-soldr
author: zackees
description: Extraction-ready Soldr setup action. Installs one soldr binary, bootstraps rustup when needed, provisions the resolved Rust toolchain, and restores a cacheable runner-local Soldr root.
branding:
  icon: terminal
  color: green
inputs:
  version:
    description: Soldr version or tag to install. Defaults to the latest release.
    required: false
    default: ""
  repo:
    description: Release source repository override for extraction or local testing. Not part of the intended public setup-soldr@v0 beta contract.
    required: false
    default: zackees/soldr
  cache:
    description: Restore and save the action-managed cache/state root across workflow runs.
    required: false
    default: "true"
  cache-dir:
    description: Override the runner-local cache/state root used for Soldr, Cargo, and rustup state rehydrated by this action.
    required: false
    default: ""
  cache-key-suffix:
    description: Optional extra suffix appended to the cache key.
    required: false
    default: ""
  toolchain:
    description: Override the exact Rust toolchain channel string. When empty, toolchain-file is used if present, otherwise stable.
    required: false
    default: ""
  toolchain-file:
    description: Toolchain file to read when toolchain is not explicitly set.
    required: false
    default: rust-toolchain.toml
  trust-mode:
    description: Optional value for SOLDR_TRUST_MODE.
    required: false
    default: ""
  build-cache:
    description: >
      Restore and save the Soldr-owned zccache compilation artifact cache
      across workflow runs. Default "true"; the action restores the
      action-managed zccache cache root with a toolchain-scoped key and
      saves it at end-of-job, letting
      GitHub's own-branch -> PR base -> default-branch restore order seed
      feature-branch runs from the latest main-branch save without any
      repo-side configuration. Set to "false" to opt out.
    required: false
    default: "true"
  s3-bucket:
    description: >-
      Optional S3-compatible bucket (e.g. a DigitalOcean Space) used as the
      remote cache instead of actions/cache. Off when empty, or when the
      SOLDR_S3_CACHE_ACCESS_KEY / SOLDR_S3_CACHE_SECRET_KEY env vars (from
      workflow secrets) are absent. Save with the `s3-save` sub-action
      (.github/actions/setup-soldr/s3-save) at the end of the job.
    required: false
    default: ""
  s3-endpoint:
    description: S3 endpoint host, e.g. nyc3.digitaloceanspaces.com.
    required: false
    default: ""
  s3-region:
    description: SigV4 region. Empty derives it from a DigitalOcean endpoint (nyc3), else us-east-1.
    required: false
    default: ""
  s3-cache-limit:
    description: High watermark for the bucket (e.g. 50G, 500GiB, 1TB). Enforced only on merge_group runs. Empty means 50G.
    required: false
    default: ""
  target-cache:
    description: 'Deprecated no-op. soldr#2996 removed the target cache; soldr cook and zccache own compiler caching. Accepted for compatibility and ignored (a warning is printed when enabled).'
    required: false
    default: "false"
  target-cache-mode:
    description: 'Deprecated no-op. soldr#2996 removed the target cache; soldr cook and zccache own compiler caching. Accepted for compatibility and ignored (a warning is printed when enabled).'
    required: false
    default: "off"
  target-dir:
    description: Cargo target directory (retained for compatibility).
    required: false
    default: target
  tool-shims:
    description: >
      Optional PATH shim mode for existing workflows. Set to "cargo" to make
      later `cargo ...` steps run through `soldr cargo ...` without rewriting
      them. Default "false" leaves PATH unchanged.
    required: false
    default: "false"
  native-cache:
    description: >
      Default-on native C/C++ compiler caching for build-script work
      (e.g. bundled SQLite from `libsqlite3-sys`). When "true", soldr
      injects zccache as the `CC` / `CXX` wrapper so cc-rs invocations
      hit the same managed cache that rustc invocations do. Default
      "true"; set to "false" to write `SOLDR_NATIVE_CACHE=0` to the job
      env so later `soldr cargo ...` steps skip native compiler
      wrapping while keeping Rust caching intact. `soldr --no-cache
      cargo ...` is still the global kill-switch and overrides this
      input at command time.
    required: false
    default: "true"
outputs:
  soldr-path:
    description: Installed Soldr binary path added to PATH for later steps.
    value: ${{ steps.resolve.outputs.soldr_path }}
  soldr-version:
    description: Installed Soldr version reported by soldr version --json.
    value: ${{ steps.verify.outputs.soldr_version }}
  cache-dir:
    description: Runner-local cache/state root used by the action.
    value: ${{ steps.resolve.outputs.cache_root }}
  cache-hit:
    description: Whether the action restored an exact cache hit for the selected cache/state root.
    value: ${{ steps.cache-meta.outputs.cache_hit }}
  build-cache-hit:
    description: >
      Whether the action restored the Soldr-owned zccache compilation
      artifact cache. "true" for an exact key match, "false" for a
      restore-key fallback or no cache, empty string when `build-cache`
      is explicitly disabled.
    value: ${{ steps.cache-meta.outputs.build_cache_hit }}
  target-cache-hit:
    description: Deprecated; always empty (target cache removed in soldr#2996).
    value: ${{ steps.cache-meta.outputs.target_cache_hit }}
  target-cache-mode:
    description: Deprecated; always "off".
    value: ${{ steps.resolve.outputs.target_cache_mode }}
  toolchain:
    description: Exact Rust toolchain channel configured by rustup for the action.
    value: ${{ steps.resolve.outputs.toolchain }}
  tool-shims-dir:
    description: Directory containing generated tool shims when tool-shims is enabled.
    value: ${{ steps.resolve.outputs.shim_dir }}
  native-cache-enabled:
    description: >
      Effective native C/C++ compiler cache policy resolved by the
      action. "true" when soldr will inject zccache as the `CC` / `CXX`
      wrapper for later `soldr cargo ...` steps; "false" when the
      action wrote `SOLDR_NATIVE_CACHE=0` to the job env. The
      command-time kill-switch `soldr --no-cache cargo ...` is not
      reflected here because it overrides the action's policy at run
      time.
    value: ${{ steps.resolve.outputs.native_cache_enabled }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
        INPUT_CACHE_KEY_SUFFIX: ${{ inputs.cache-key-suffix }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
        INPUT_TRUST_MODE: ${{ inputs.trust-mode }}
        INPUT_TARGET_CACHE: ${{ inputs.target-cache }}
        INPUT_TARGET_CACHE_MODE: ${{ inputs.target-cache-mode }}
        INPUT_TARGET_DIR: ${{ inputs.target-dir }}
        INPUT_TOOL_SHIMS: ${{ inputs.tool-shims }}
        INPUT_NATIVE_CACHE: ${{ inputs.native-cache }}
        ACTION_WORKSPACE: ${{ github.workspace }}
        ACTION_OS: ${{ runner.os }}
        ACTION_ARCH: ${{ runner.arch }}
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/resolve_setup.py"

    # actions/cache@v4 picks its tar codec by probing `zstd --quiet --version`
    # on PATH (see @actions/toolkit/packages/cache/src/internal/cacheUtils.ts).
    # The windows-11-arm image omits zstd from its preinstalled software
    # (https://github.com/actions/partner-runner-images), so cache save/restore
    # silently falls back to single-threaded `tar -z` (gzip). On 2 GB payloads
    # that turns a ~30s post-step into ~4m on ARM Windows runners. Installing
    # zstd before any cache step lets actions/cache pick the multi-threaded
    # `zstd -T0` path that x64 Windows already uses. Tracked upstream as
    # actions/cache#1622 (unresolved as of v5.0.5). No-op on other platforms
    # and when a future image starts shipping zstd, thanks to the PATH probe.
    - id: ensure-zstd-windows-arm64
      if: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' }}
      shell: pwsh
      run: |
        if (Get-Command zstd -ErrorAction SilentlyContinue) {
          Write-Host "zstd already on PATH; skipping install."
          zstd --version
          exit 0
        }
        Write-Host "zstd not on PATH; installing via Chocolatey so actions/cache picks the multi-threaded zstd codec."
        choco install zstandard -y --no-progress
        if ($LASTEXITCODE -ne 0) {
          throw "choco install zstandard exited with code $LASTEXITCODE"
        }
        if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
          throw "zstd installation completed but the binary is not on PATH"
        }
        zstd --version

    # Optional remote S3 cache (off unless s3-bucket + secret env are set).
    # When it reports enabled=true it replaces the actions/cache steps below.
    - id: s3-restore
      if: ${{ inputs.s3-bucket != '' }}
      shell: pwsh
      env:
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        INPUT_S3_REGION: ${{ inputs.s3-region }}
        INPUT_S3_CACHE_LIMIT: ${{ inputs.s3-cache-limit }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_BUILD_CACHE: ${{ inputs.build-cache }}
        SETUP_CACHE_ROOT: ${{ steps.resolve.outputs.cache_root }}
        SETUP_CACHE_KEY: ${{ steps.resolve.outputs.cache_key }}
        SETUP_CACHE_RESTORE_PREFIX: ${{ steps.resolve.outputs.cache_restore_prefix }}
        SETUP_BUILD_CACHE_PATH: ${{ steps.resolve.outputs.build_cache_path }}
        SETUP_BUILD_CACHE_KEY: ${{ steps.resolve.outputs.build_cache_key }}
        SETUP_BUILD_CACHE_RESTORE_TOOLCHAIN: ${{ steps.resolve.outputs.build_cache_restore_key_toolchain }}
        SETUP_BUILD_CACHE_RESTORE_OS_ARCH: ${{ steps.resolve.outputs.build_cache_restore_key_os_arch }}
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/s3_cache.py" restore

    - id: cache
      if: ${{ inputs.cache == 'true' && steps.s3-restore.outputs.enabled != 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.resolve.outputs.cache_root }}
        key: ${{ steps.resolve.outputs.cache_key }}
        restore-keys: |
          ${{ steps.resolve.outputs.cache_restore_prefix }}

    - id: build-cache-restore
      if: ${{ inputs.build-cache == 'true' && steps.s3-restore.outputs.enabled != 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.resolve.outputs.build_cache_path }}
        key: ${{ steps.resolve.outputs.build_cache_key }}
        restore-keys: |
          ${{ steps.resolve.outputs.build_cache_restore_key_toolchain }}
          ${{ steps.resolve.outputs.build_cache_restore_key_os_arch }}

    - id: toolchain
      shell: pwsh
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/ensure_rust_toolchain.py"

    - id: install
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOLDR_REPO: ${{ steps.resolve.outputs.soldr_repo }}
        SOLDR_INSTALL_DIR: ${{ steps.resolve.outputs.bin_dir }}
        # Prefer the resolved release tag so the installed binary matches
        # the tag baked into the cache key. Falls back to the original
        # requested value (possibly empty for "latest") when the resolver
        # could not reach the GitHub API. See issue #214.
        SETUP_SOLDR_VERSION: ${{ steps.resolve.outputs.soldr_version_resolved || steps.resolve.outputs.soldr_version_requested }}
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/ensure_soldr.py"

    - id: verify
      shell: pwsh
      env:
        SETUP_SOLDR_PATH: ${{ steps.resolve.outputs.soldr_path }}
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/verify_soldr.py"

    - id: tool-shims
      shell: pwsh
      env:
        SETUP_SOLDR_PATH: ${{ steps.resolve.outputs.soldr_path }}
        SETUP_SOLDR_SHIM_DIR: ${{ steps.resolve.outputs.shim_dir }}
        SETUP_SOLDR_TOOL_SHIMS: ${{ inputs.tool-shims }}
      run: python "${{ github.action_path }}/.github/actions/setup-soldr/install_tool_shims.py"

    - id: cache-meta
      shell: pwsh
      env:
        RAW_CACHE_HIT: ${{ steps.cache.outputs.cache-hit || steps.s3-restore.outputs.cache_hit }}
        RAW_BUILD_CACHE_HIT: ${{ steps.build-cache-restore.outputs.cache-hit || steps.s3-restore.outputs.build_cache_hit }}
        BUILD_CACHE_ENABLED: ${{ inputs.build-cache }}
      run: |
        $value = $env:RAW_CACHE_HIT
        if ([string]::IsNullOrWhiteSpace($value)) {
          $value = "false"
        }
        "cache_hit=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        if ($env:BUILD_CACHE_ENABLED -eq "true") {
          $buildValue = $env:RAW_BUILD_CACHE_HIT
          if ([string]::IsNullOrWhiteSpace($buildValue)) {
            $buildValue = "false"
          }
        } else {
          $buildValue = ""
        }
        "build_cache_hit=$buildValue" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        "target_cache_hit=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
